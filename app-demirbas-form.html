<script>
/* =====================================================================
   DEMİRBAŞ FORMU — rota 95 · brief §5 (CreateEditPage deseni) · §20.3 ·
   §20.4 · §20.7 · §22.0 · §22.2 · §22.3 · §22.4 · §22.10 · §22.15 ·
   §22.16 · §22.17

   DESEN: `GV.pageHead` + `GV.form` + `GV.afterSave`. Bu depoda
   `CreateEditPage` ADINDA bir bileşen yoktur; desen budur (brief §5).

   BU EKRANIN ÇEKİRDEK KURALI — DURUM TÜRETİLMİŞTİR
   ─────────────────────────────────────────────────────────────────────
   `DB.transitions.asset` YOKTUR (brief §22.3; ölçüldü: geçiş tablosunda
   15 varlık var, `asset` onlardan biri değil). Demirbaşın `durum` ve
   `zimmetli` alanları TÜRETİLMİŞ GÖRÜNÜMDÜR; otorite `DB.assignments`
   defteridir (ADR-R2-29 · K-30 · brief §20.3). Bu yüzden:

     · Form durum sözlüğünün TAMAMINI listelemez. Hangi değerin
       yazılabilir olduğunu ekran KENDİ SÖZÜNDEN değil, türetim
       yordamının kendisinden ölçer: sözlüğün her değeri
       `GV.varlik.tazele` yordamından bir SONDA nesnesiyle geçirilir ve
       yordamın EZDİĞİ değerler listeden düşer (aşağıda `SONDA`). Kuralı
       ikinci kez yazmak (L-40) yerine yordama sorulur.
       Ölçülen sonuç: `Depoda` ve `Aktif` korunur · `Zimmetli` ve
       `Zimmet bekliyor` `Depoda`ya EZİLİR · `Hurda` korunur ama onu
       YAZAN YORDAM YOK (§22.16.1) — o yüzden o da listelenmez.
     · `zimmetli` · `zimmetTarihi` · `iadeTarihi` alanlarına bu ekran
       HİÇ YAZMAZ; doğum literalinde de yer almazlar. `DB.assets`
       üstünde doğrudan atama yasaktır (§22.17.1). Bu üç alanı yazan tek
       yer `GV.varlik` ad alanıdır (`kabulEt` · `kabulGeriAl` · `tazele`).
     · DURUM YALNIZ DOĞUMDA BİR ALANDIR. §22.10 forma iki değer veriyor
       (`Depoda` varsayılan · `Aktif`), §22.17.1 ise `a.durum = …`
       atamasını yasaklıyor; ikisini birden karşılayan tek yol §22.1b.4'ün
       DOĞUM LİTERALİDİR. Var olan bir demirbaşın durumunu yazan bir ortak
       yordam yazılmamıştır (`GV.varlik` ad alanında böyle bir imza yok),
       o yüzden düzenleme kipinde alan SALT OKUNUR basılır, kaydetme onu
       OKUMAZ ve eksik yordam beyan edilir. Kardeş formlar (proje ·
       personel · izin) durumu aynı biçimde salt okunur basıyor.
     · Açık (iade edilmemiş) bir zimmet tutanağı olan demirbaşta durum
       zaten tutanaktan türer: ne yazılsa `GV.varlik.tazele` bir sonraki
       yüklemede tutanağın söylediğini yazar (ölçüldü). Yazılamayan bir
       alanı bir `<select>` olarak basmak vaat olurdu.

   SONDA DEFTERE DOKUNMAZ: `GV.varlik.tazele` yalnız verilen nesneyi ve
   `DB.assignments`i okur; sonda nesnesi `DB.assets`e girmez, aktivite
   defterine satır yazmaz (ölçüldü: 207 aktivite kaydı sonda öncesi ve
   sonrası aynı) ve `GV.varlik.sonTazeleme` ölçümünü bozmaz.

   KAYIT YAZMA — `GV.demirbas.*` DİYE BİR AD ALANI YOKTUR (§22.16.6) ve
   `GV.varlik.olustur/guncelle` de yoktur. Kayıt, teklif/fatura/proje/
   personel formlarındaki desenle NESNE LİTERALİYLE doğar; doğum durumu
   literalde verilir, kayda sonradan durum yazan satır YOKTUR
   (§22.1b.4 · §14.5).

   KOD ÜRETİMİ: brief §22.2 GLOBAL-max varyantı. Yıl-içi tarama
   `DMB-2026-016` yerine `DMB-2026-004` üretirdi; oysa 004 numarası
   `DMB-2025-004` olarak defterde kullanılmış — sıra yıllar arasında
   ilerliyor (`DMB-2023-011` · `DMB-2024-001…003` · `DMB-2025-004…010` ·
   `DMB-2026-012…015`). Bugünkü veriyle üretilen kod: `DMB-2026-016`
   (ölçüldü).

   YÜKLENEN VERİ (brief §22.0 tablosu, sıra §1.1): org · crm · work ·
   misc · ops · hr · lifecycle.
   ⚠️ ÖLÇÜM: `DB.assets` · `DB.assignments` · `DB.assetClaimDrops` ·
   `DB.suppliers` · `DB.orders` · `DB.assetCategories` **`ops.js`te**,
   `DB.assetStatuses` **`hr.js`te**, `DB.departments` **`org.js`te**.
   Brief §20.0 bu koleksiyonları `hr.js`e yazıyor; ölçüm başkasını
   söylüyor ve raporda bildirildi. İki dosya da bu ekranda yüklü olduğu
   için sonuç doğru; ama "kullanmadığın veri dosyasını yükleme" kuralı
   bu satırın doğru olmasına bağlıdır. `firsat.js` · `odeme.js` ·
   `notes.js` · `reports.js` yüklenmez.
   ===================================================================== */
document.addEventListener('gv:ready', function(){
  var mount = document.getElementById('rec');
  if(!mount) return;

  var esc = GV.esc;
  var F   = GV.fmt;

  var q    = new URLSearchParams(location.search);
  var kod  = q.get('id');
  var tumu = DB.assets || [];
  /* Kaydı ortak yordam bulur (`GV.varlik.kayit` kod da kayıt da kabul
     eder — brief §20.3); ekran ikinci bir arama yazmaz. */
  var rec  = kod ? GV.varlik.kayit(kod) : null;

  /* ---- Küçük yardımcılar -------------------------------------------- */
  function bosNull(x){
    var s = (x == null) ? '' : String(x).trim();
    return s === '' ? null : s;
  }
  function sayiYaNull(x){
    var s = String(x == null ? '' : x).trim();
    if(s === '') return null;
    var n = parseFloat(s.replace(',', '.'));
    return isFinite(n) ? n : null;
  }
  function faint(s){ return '<span class="u-faint">' + esc(s) + '</span>'; }
  function faintNot(html){ return '<p class="u-faint u-sm">' + html + '</p>'; }
  function kodEt(s){ return '<span class="cell-code">' + esc(s) + '</span>'; }
  function benzersiz(list){
    return (list || []).filter(function(v, i, s){
      return v != null && v !== '' && s.indexOf(v) === i; });
  }
  function trSirala(a, b){ return String(a).localeCompare(String(b), 'tr'); }
  function kart(ikon, baslik, meta, govde){
    return '<section class="gv-card u-mt-4"><div class="gc-head">' +
      '<h3 class="gc-title">' + GV.ico(ikon) + esc(baslik) + '</h3>' +
      (meta ? '<span class="gc-meta">' + meta + '</span>' : '') +
      '</div><div class="gc-body">' + govde + '</div></section>';
  }
  function depKaydi(k){ return (DB.departments || []).filter(function(d){ return d.kod === k; })[0] || null; }
  function tedarikciKaydi(k){ return (DB.suppliers || []).filter(function(s){ return s.kod === k; })[0] || null; }
  function siparisKaydi(k){ return (DB.orders || []).filter(function(o){ return o.kod === k; })[0] || null; }

  /* =================================================================
     0. ÜÇ KAPI — kayıt yok · müşteri oturumu · yetki yok
     ================================================================= */
  if(kod && !rec){
    GV.pageHead({
      eyebrow:'Ekip ve Kaynaklar', title:'Kayıt bulunamadı', sub:kod,
      actions:[{ label:'Varlık listesine dön', icon:'i-arrow-left', href:'app-varlik.html?t=demirbas' }]
    });
    mount.innerHTML = GV.errorState({
      title:kod + ' bulunamadı',
      desc:'Bu kod demirbaş defterindeki ' + tumu.length + ' kayıttan hiçbiriyle eşleşmedi. ' +
           'Adres çubuğundaki kodu kontrol edin ya da demirbaş yüzeyinden kaydı seçin.',
      action:'<a class="btn btn-acc" href="app-demirbas-form.html">Yeni demirbaş kaydı aç</a>' });
    return;
  }

  /* Müşteri oturumuna karşı kayıt kapısı (brief §6 adım 2 · §21.11).
     Demirbaş kaydında `musteri` alanı YOKTUR (ölçüldü: 20 alanlı şemada
     böyle bir alan yok) — kapıya `musteri:null` verilir: yordam müşteri
     oturumunu her hâlükârda reddeder, personel oturumunu geçirir. Ekran
     ikinci bir "müşteri mi" testi yazmaz. */
  if(!GV.guardRecord({ mount:'#rec', musteri:null, kod:rec ? rec.kod : null,
      eyebrow:'Ekip ve Kaynaklar',
      title:rec ? ([rec.marka, rec.model].filter(Boolean).join(' ') || rec.kod) : 'Yeni Demirbaş',
      geriHref:'app-varlik.html?t=demirbas', geriLabel:'Varlık listesine dön' })) return;

  var izinli = rec ? GV.perm.can('duzenle') : GV.perm.can('ekle');
  if(!izinli){
    GV.pageHead({
      eyebrow:'Ekip ve Kaynaklar',
      title:rec ? ([rec.marka, rec.model].filter(Boolean).join(' ') || rec.kod) : 'Yeni Demirbaş',
      sub:'Bu ekran için yetkiniz yok',
      actions:[{ label:'Varlık listesine dön', icon:'i-arrow-left', href:'app-varlik.html?t=demirbas' }]
    });
    mount.innerHTML = GV.empty({ icon:'i-lock',
      title:rec ? 'Demirbaş kaydını düzenleme yetkiniz yok' : 'Yeni demirbaş kaydı açma yetkiniz yok',
      desc:'Rolünüz (' + GV.perm.role() + ') bu işlem için yetkili değil. Varlık listesini ' +
           'görüntülemeye devam edebilirsiniz.',
      action:'<a class="btn btn-line" href="app-varlik.html?t=demirbas">Varlık listesine dön</a>' });
    return;
  }

  /* =================================================================
     1. DURUM EKSENİ — TÜRETİM YORDAMINA SORULUR, YENİDEN YAZILMAZ
     -----------------------------------------------------------------
     `DB.assetStatuses` 5 değer taşır. Hangisinin bu formdan YAZILABİLİR
     olduğunu ekran bir listeye gömmez: her değeri bir SONDA nesnesiyle
     `GV.varlik.tazele`den geçirir ve yordamın ezdiklerini düşürür.
     Sonda `DB.assets`e girmez, deftere satır yazmaz.
     ================================================================= */
  var DURUMLAR = DB.assetStatuses || [];

  /* Sonda kodu defterde OLMAYAN bir koddur: `GV.varlik.zimmetOf` onu
     `DB.assignments` içinde aradığında hiçbir tutanak bulmaz, yani
     "tutanaksız demirbaş" hâli ölçülür.
     ⚠️ Sonda nesnesi ŞEKLİ TAM olmalıdır ve soru `r.degisti` DEĞİLDİR:
     ölçüldü ki `zimmetli` alanını TAŞIMAYAN bir nesnede yordam alanı
     `undefined`dan `null`a çekiyor ve `degisti:true` diyor — yani
     `degisti` iki ekseni birden (durum VE zimmet) cevaplıyor. Buradaki
     soru yalnız DURUM eksenidir; o yüzden karşılaştırma `p.durum`
     üzerinden yapılır. Bu ayrım ölçülmeden yazılan ilk sürüm bütün
     sözlüğü "türetilir" sayıp formu durumsuz bırakıyordu. */
  var SONDA_KOD = 'DMB-OLCUM-0';
  var SONDA = DURUMLAR.map(function(d){
    var p = { kod:SONDA_KOD, durum:d, zimmetli:null, zimmetTarihi:null, iadeTarihi:null };
    GV.varlik.tazele(p);
    return { durum:d, sonra:p.durum, ezildi:p.durum !== d };
  });
  var TURETILEN = SONDA.filter(function(s){ return s.ezildi; })
                       .map(function(s){ return s.durum; });   /* Zimmetli · Zimmet bekliyor */
  /* Yordamın KORUDUĞU değerler yazılabilir adaylardır; ama bir değeri
     yazan yordam yoksa o da listelenmez. `Hurda` tam bu durumdadır:
     `GV.varlik.hurdayaAyir` YOK (§22.16.1) ve `a.durum = 'Hurda'`
     yazmak yasak (§22.17.1). Ad listesi tek yerde durur. */
  var YORDAMSIZ = ['Hurda'];
  var SECILEBILIR = SONDA.filter(function(s){
    return !s.ezildi && YORDAMSIZ.indexOf(s.durum) === -1; }).map(function(s){ return s.durum; });
  var DOGUM = SECILEBILIR[0] || null;      /* sözlüğün ilk değeri — 'Depoda' */

  /* Defterin bugünkü hâli — sayılar ölçülür, yazılmaz. */
  var DURUM_DAGILIM = DURUMLAR.map(function(d){
    return { durum:d, n:tumu.filter(function(a){ return a.durum === d; }).length };
  });
  var TAZELE = GV.varlik.sonTazeleme || null;   /* { olculen, degisen[] } — yükleme ölçümü */

  /* ⚠️ DURUM YALNIZ DOĞUMDA YAZILIR — düzenlemede HİÇ OKUNMAZ.
     İki kural aynı noktada kesişiyor:
       · §22.10: formda seçilebilen durum İKİ değerdir (Depoda · Aktif),
       · §22.17.1: `a.durum = …` YASAK — türetilmiş görünüme atama.
     İkisini birden karşılayan tek yol, brief §22.1b.4'ün doğum literali
     desenidir: durum kayıt DOĞARKEN literalde verilir, var olan bir
     kayda SONRADAN yazılmaz. Mevcut bir demirbaşı `Depoda` ↔ `Aktif`
     arasında çeviren bir ortak yordam YAZILMAMIŞTIR (`GV.varlik` ad
     alanında böyle bir imza yok — brief §20.3'teki liste tamdır) ve
     olmayan yordamın yerine atama koymak yasaktır. Bu yüzden düzenleme
     kipinde alan SALT OKUNUR basılır, sebebi yazılır ve eksik yordam
     raporlanır. Kardeş formlar (proje · personel · izin) durumu aynı
     biçimde salt okunur basıyor — sözleşme aynı. */
  var acikZimmet   = rec ? GV.varlik.zimmetOf(rec.kod) : null;
  var durumBasilir = !rec;                  /* yalnız DOĞUM kipinde alan */
  /* İKİ YÖNÜN DEFTER ÖLÇÜMÜ: kapı sessiz çalışmaz. */
  var ACIK_ZIMMETLI_N = tumu.filter(function(a){ return !!GV.varlik.zimmetOf(a.kod); }).length;
  var DOGABILIR_N = tumu.filter(function(a){ return SECILEBILIR.indexOf(a.durum) !== -1; }).length;
  var YORDAMSIZ_N = tumu.filter(function(a){ return YORDAMSIZ.indexOf(a.durum) !== -1; }).length;

  /* =================================================================
     2. SÖZLÜKLER, TÜRETİLEN SEÇENEKLER VE DEFTER ÖLÇÜMLERİ
     ================================================================= */
  var canFinans   = GV.perm.can('finans');
  var ROL_SAYI    = Object.keys(DB.permMatrix || {}).length;
  var FINANS_ROL  = Object.keys(DB.permMatrix || {}).filter(function(r){
    return (DB.permMatrix[r] || {}).finans === true; }).length;
  /* Ekleme yetkisi olan rol sayısı — ekranın kendi yetki kapısının
     ölçülebilen yönü. Bölüm erişimi (kabuk 403) matristen okunamaz:
     o karar kabuğun kendi eşlemesindedir ve bu ekran onu ölçemez. */
  var EKLE_ROL = Object.keys(DB.permMatrix || {}).filter(function(r){
    return (DB.permMatrix[r] || {}).ekle && (DB.permMatrix[r] || {}).ekle !== 'yok'; }).length;

  /* Kategori: SÖZLÜK VARDIR (20 değer) — kayıtlardan türetilmez.
     Ölçüldü: 15 kayıtta 8 kategori kullanılmış. */
  var KATEGORILER   = DB.assetCategories || [];
  var KAT_KULLANILAN= benzersiz(tumu.map(function(a){ return a.kategori; }));

  /* SÖZLÜĞÜ OLMAYAN ALANLAR (brief §22.4): seçenekler defterden
     türetilir ve kaynağı ekranda YAZILIR (§10.1). */
  var ALT_KATEGORI = benzersiz(tumu.map(function(a){ return a.altKategori; })).sort(trSirala);
  var LOKASYONLAR  = benzersiz(tumu.map(function(a){ return a.lokasyon; })).sort(trSirala);

  /* Tedarikçi ve sipariş defterleri: kodları kayıt taşır, sözlük değil.
     Pasiflik sorusu `GV.arsivli`den geçer — `aktif` alanı OKUNMAZ
     (§22.17.4 · K-33). Ölçüldü: 7 tedarikçinin hiçbiri pasif değil. */
  var TEDARIKCILER = DB.suppliers || [];
  var TED_PASIF    = TEDARIKCILER.filter(function(s){ return GV.arsivli(s); }).length;
  var TED_SEC      = TEDARIKCILER.map(function(s){
    return { value:s.kod, label:s.kod + ' · ' + s.unvan +
      (s.kategori ? ' · ' + s.kategori : '') + (GV.arsivli(s) ? ' · pasif' : '') };
  });
  var SIPARISLER = DB.orders || [];
  var SIP_SEC    = SIPARISLER.slice().sort(function(a, b){
    return String(b.tarih || '').localeCompare(String(a.tarih || '')); }).map(function(o){
    return { value:o.kod, label:o.kod + ' · ' + (o.tedarikci || 'tedarikçi yok') + ' · ' +
      (o.tarih ? F.date(o.tarih) : 'tarih yok') + ' · ' + (o.durum || '—') };
  });
  var DEPLER    = DB.departments || [];
  var DEP_PASIF = DEPLER.filter(function(d){ return GV.arsivli(d); }).length;
  var DEP_SEC   = DEPLER.map(function(d){
    return { value:d.kod, label:d.kod + ' · ' + d.ad + (GV.arsivli(d) ? ' · pasif departman' : '') };
  });

  /* KORUNAN SEÇENEK (brief §22.1b.5): düzenlenen kaydın kendi değeri
     türetimin dışında kalabilir (sözlükten düşmüş bir kategori, elle
     girilmiş bir lokasyon, defterden silinmiş bir tedarikçi). O değer
     listeye EKLENİR — yoksa `select` onu sessizce başka bir değere
     çevirir ve kaydetmek VERİ KAYBI olur. Yeni kayıtta eklenmez;
     çelişki yayılmaz. */
  function korunan(secenekler, alan, gerekce){
    if(!rec) return secenekler;
    var v = rec[alan];
    if(v == null || v === '') return secenekler;
    var varMi = secenekler.some(function(o){
      return (o && typeof o === 'object' ? o.value : o) === v; });
    if(varMi) return secenekler;
    return secenekler.concat([{ value:v, label:v + ' · ' + gerekce }]);
  }

  /* ---- Defter ölçümleri — hepsi sayılır ---------------------------- */
  var ALTKAT_DOLU  = tumu.filter(function(a){ return !!a.altKategori; }).length;
  var OZELLIK_DOLU = tumu.filter(function(a){ return !!a.ozellik; }).length;
  var BARKOD_DOLU  = tumu.filter(function(a){ return !!a.barkod; }).length;
  var SIPARIS_DOLU = tumu.filter(function(a){ return !!a.siparis; }).length;
  var TED_DOLU     = tumu.filter(function(a){ return !!a.tedarikci; }).length;
  var DEP_DOLU     = tumu.filter(function(a){ return !!a.dep; }).length;
  var ALIS_DOLU    = tumu.filter(function(a){ return !!a.alisTarihi; }).length;
  var GAR_BAS_DOLU = tumu.filter(function(a){ return !!a.garantiBas; }).length;
  var GAR_BIT_DOLU = tumu.filter(function(a){ return !!a.garantiBit; }).length;
  var GAR_BITEN    = tumu.filter(function(a){ return a.garantiBit && String(a.garantiBit) < String(DB.today); }).length;
  var GAR_ALIS_AYNI= tumu.filter(function(a){ return a.garantiBas && a.garantiBas === a.alisTarihi; }).length;
  var SERI_TEKIL   = benzersiz(tumu.map(function(a){ return a.seri; })).length;
  var ARSIVLI_N    = tumu.filter(function(a){ return GV.arsivli(a); }).length;
  var FIYAT_DOLU   = tumu.filter(function(a){ return typeof a.alisFiyati === 'number'; }).length;
  var FIYAT_SIFIR  = tumu.filter(function(a){ return a.alisFiyati === 0; }).length;
  var IDDIA_DUSEN  = (DB.assetClaimDrops || []).length;

  /* Barkod deseni ÖLÇÜLDÜ: 15 kaydın 15'inde barkod, kodun sıra
     numarasından türüyor (`DMB-2026-015` → `GW-DMB-0015`). Bu yüzden
     alan boş bırakıldığında değer TÜRETİLİR ve türetildiği ekranda
     yazılır — sessizce değil. */
  function barkodTuret(demirbasKod){
    var m = /-(\d+)$/.exec(String(demirbasKod || ''));
    return m ? 'GW-DMB-' + String(+m[1]).padStart(4, '0') : null;
  }
  var BARKOD_DESEN = tumu.filter(function(a){ return a.barkod === barkodTuret(a.kod); }).length;

  /* ---- Üretilecek kod: brief §22.2 GLOBAL-max varyantı ------------- */
  function kodUret(){
    var yil = String(DB.today).slice(0, 4), max = 0;
    (DB.assets || []).forEach(function(x){
      var m = /^DMB-\d{4}-(\d+)$/.exec(x.kod || '');
      if(m) max = Math.max(max, +m[1]);        /* ← YIL SERBEST, sıra global */
    });
    return 'DMB-' + yil + '-' + String(max + 1).padStart(3, '0');
  }

    formKayit.durum = DOGUM || '';

  /* GARANTİ KAPISI — İKİ YÖNDEN DE REDDEDER (brief §22.10).
     "Uyar ama geçir" yasak (§14.12): bitiş başlangıçtan önce olamaz.
     ISO tarih dizeleri sözlükbilimsel sırada karşılaştırılır. Aynı kural
     iki alandan da sorulur ki kullanıcı hangisini sonradan değiştirirse
     değiştirsin kapı kapansın — kural tek yerde (`garantiSirasi`). */
  function garantiSirasi(bas, bit){
    if(!bas || !bit) return '';
    if(String(bit) < String(bas)) return 'Garanti bitişi (' + F.date(bit) + '), garanti ' +
      'başlangıcından (' + F.date(bas) + ') önce olamaz.';
    return '';
  }
  function garantiBitKontrol(val, veri){ return garantiSirasi(bosNull(veri.garantiBas), bosNull(val)); }
  function garantiBasKontrol(val, veri){ return garantiSirasi(bosNull(val), bosNull(veri.garantiBit)); }

  function ayniAlan(alan, deger){

    return tumu.filter(function(a){

             String(a[alan] || '').trim().toLocaleLowerCase('tr') === String(d).toLocaleLowerCase('tr');
    });
  }

  function yanPanel(v){
    var out = '';
    var hedefKod = rec ? rec.kod : kodUret();

    /* ---- Kayıt özeti ------------------------------------------------ */
    /* Garanti başlangıcı BOŞSA alış tarihinden türetilecek (aşağıdaki
       türetim kartı bunu kaydetmeden önce gösterir) — panel de aynı
       değeri ölçer ki kapı iki yerde ayrışmasın. */
    var garBas = bosNull(v.garantiBas) || bosNull(v.alisTarihi);
    var garBit = bosNull(v.garantiBit);
    out += '<div class="gv-card">' +
      '<div class="gc-head"><h3 class="gc-title">' + GV.ico('i-package') + 'Kayıt özeti</h3>' +
        '<span class="gc-meta">' + esc(rec ? 'düzenleme' : 'yeni kayıt') + '</span></div>' +
      '<div class="gc-body">' +
        GV.dl([
          ['Demirbaş no', rec
            ? kodEt(rec.kod)
            : kodEt(hedefKod) + ' ' + faint('kaydederken defterden üretilir')],
          ['Durum', rec
            ? GV.badge(rec.durum) + GV.cell.sub('türetilmiş görünüm — otorite zimmet defteri')
            : (DOGUM ? GV.badge(DOGUM) + GV.cell.sub('doğum durumu, literalde verilir')
                     : faint('durum sözlüğü okunamadı'))],
          ['Kategori', bosNull(v.kategori)
            ? esc(v.kategori) + (bosNull(v.altKategori) ? GV.cell.sub(esc(v.altKategori)) : '')
            : faint('seçilmedi')],
          ['Marka / Model', (bosNull(v.marka) || bosNull(v.model))
            ? esc([bosNull(v.marka), bosNull(v.model)].filter(Boolean).join(' ')) +
              (bosNull(v.seri) ? GV.cell.sub('Seri: ' + esc(v.seri)) : '')
            : faint('girilmedi')],
          ['Barkod', bosNull(v.barkod)
            ? kodEt(v.barkod)
            : (barkodTuret(hedefKod)
                ? kodEt(barkodTuret(hedefKod)) + GV.cell.sub('boş bırakıldı → kaydederken kod ' +
                    'numarasından türetilecek')
                : faint('türetilemedi — kod deseni okunamadı'))],
          ['Konum', bosNull(v.lokasyon)
            ? esc(v.lokasyon) + (bosNull(v.dep) ? GV.cell.sub(esc(v.dep)) : '')
            : faint('seçilmedi')],
          ['Alış bedeli', canFinans
            ? (sayiYaNull(v.alisFiyati) == null
                ? faint('girilmedi')
                : GV.cell.mny(sayiYaNull(v.alisFiyati)) + GV.cell.sub('NET · KDV hariç'))
            : '<span class="cell-mask">••••••</span>' + GV.cell.sub('para yetkisi kapalı')]
        ]) +
      '</div></div>';

    /* ---- DURUM EKSENİ — sonda ölçümüyle ----------------------------- */
    var sondaSatir = SONDA.map(function(s){
      var yaz = SECILEBILIR.indexOf(s.durum) !== -1;
      return [esc(s.durum),
        (yaz
          ? '<span class="u-ok">formda seçilebilir</span>'
          : (s.ezildi
              ? '<span class="u-warn">türetilir — sonda "' + esc(s.durum) + '" yazdı, yordam "' +
                esc(s.sonra) + '" bıraktı</span>'
              : '<span class="u-muted">listelenmez — yazan yordam yok</span>')) +
        GV.cell.sub(s.ezildi
          ? 'envanteri bu duruma getiren tek olay personelin KABULÜDÜR (tutanağın yazılması ' +
            'değil): GV.varlik.kabulEt / .kabulGeriAl'
          : (yaz
              ? 'zimmetten bağımsız durum · GV.varlik.tazele bu değeri EZMEZ (sonda ölçtü)'
              : 'GV.varlik.hurdayaAyir YOK (§22.16.1) ve a.durum = … yazmak yasak')) +
        GV.cell.sub('defterde ' +
          ((DURUM_DAGILIM.filter(function(d){ return d.durum === s.durum; })[0] || {}).n || 0) +
          ' kayıt bu durumda')];
    });
    out += '<div class="gv-card">' +
      '<div class="gc-head"><h3 class="gc-title">' + GV.ico('i-refresh') +
        'Durum ekseni — TÜRETİLMİŞ</h3>' +
        '<span class="gc-meta">' + SECILEBILIR.length + '/' + DURUMLAR.length + ' seçilebilir</span>' +
      '</div><div class="gc-body">' +
        GV.dl(sondaSatir) +
        faintNot('Demirbaşın geçiş tablosu <b>yoktur</b>: <b>durum</b> ve <b>zimmetli</b> ' +
          'alanları <b>DB.assignments</b> defterinden türetilir (ADR-R2-29 · K-30). Bu tablo ' +
          'bir liste olarak yazılmadı — sözlüğün her değeri <b>GV.varlik.tazele</b> yordamından ' +
          'bir sonda nesnesiyle geçirildi ve yordamın ezdikleri düşürüldü. Sonda deftere ' +
          'girmez, aktivite yazmaz. Kural iki yerde tanımlanmaz; kapı değişirse bu liste ' +
          'kendiliğinden takip eder.') +
        faintNot('Yükleme ölçümü: ' + (TAZELE
          ? '<b>' + TAZELE.olculen + '</b> demirbaş ölçüldü, <b>' +
            (TAZELE.degisen || []).length + '</b> kayıt değişti' +
            ((TAZELE.degisen || []).length === 0
              ? ' — envanter defterle tutarlı (K-30: bir onarımın her açılışta tekrar koşması, ' +
                'onarılmamış demektir).'
              : ' → ' + esc((TAZELE.degisen || []).join(' · ')) + '.')
          : 'GV.varlik.sonTazeleme okunamadı — ölçüm yapılamadı.')) +
        faintNot('Durum yalnız <b>doğum kipinde</b> bir alandır; düzenlemede salt okunur ' +
          'basılır ve kaydetme onu <b>okumaz</b>. Sebebi: §22.10 forma iki değer veriyor, ' +
          'ama var olan bir kayda durum yazan bir ortak yordam yok ve türetilmiş bir alana ' +
          'atama yasak — ikisini birden karşılayan tek yol doğum literalidir. Defterin ' +
          'bugünkü hâli: <b>' + DOGABILIR_N + '/' + tumu.length + '</b> kayıt bu formun ' +
          'doğurabileceği bir durumda (' + esc(SECILEBILIR.join(' · ')) + '), <b>' +
          ACIK_ZIMMETLI_N + '</b> kayıtta açık zimmet tutanağı var (türetim tutanaktan gelir), ' +
          '<b>' + YORDAMSIZ_N + '</b> kayıt yazan yordamı olmayan bir durumda (' +
          esc(YORDAMSIZ.join(' · ')) + ').') +
      '</div></div>';

    if(acikZimmet){
      out += GV.notice({ tone:'info', icon:'i-user-check',
        title:'Yaşayan zimmet tutanağı: ' + acikZimmet.kod,
        text:'Bu demirbaş ' + (DB.empName(acikZimmet.personel) || acikZimmet.personel) +
             ' üzerinde; personel onayı "' + acikZimmet.personelOnay + '"' +
             (acikZimmet.teslimTarihi ? ', teslim ' + F.date(acikZimmet.teslimTarihi) : '') +
             '. Envanterin "' + (rec ? rec.durum : '—') + '" durumu bu tutanaktan türer; bu ' +
             'formdan hiçbir şekilde değişmez. Kabul ve kabul geri alma tutanak çekmecesindedir.',
        actions:[{ label:'Zimmet yüzeyini aç', href:'app-varlik.html?t=zimmet' }] });
    }
    if(rec && !acikZimmet){
      out += GV.notice({ tone:'warn', icon:'i-alert',
        title:'Var olan bir demirbaşın durumunu yazan yordam yok',
        text:'Kayıt "' + rec.durum + '" durumunda. Bu değeri değiştiren bir ortak yordam ' +
             'yazılmamış: GV.varlik ad alanında yalnız zimmet ekseni var (kabulEt · ' +
             'kabulGeriAl · tazele), hurdaya ayırma yordamı da yok. Türetilmiş bir alana ' +
             'doğrudan atama yasak olduğu için durum alanı salt okunur basıldı ve kaydetme ' +
             'ona dokunmuyor. Devre dışı bir düğme bile vaat sayılır, o yüzden hiç basılmadı; ' +
             'eksik yordam raporlandı.' +
             (SECILEBILIR.indexOf(rec.durum) !== -1
               ? ' ("' + SECILEBILIR.join('" ↔ "') + '" çevirmesi bu yüzden yapılamıyor.)'
               : '') });
    }

    /* ---- DÜŞEN ZİMMET İDDİASI — varsa basılır ----------------------- */
    if(rec){
      var iddia = GV.varlik.dusenIddiaSatiri(rec.kod);
      if(iddia){
        out += GV.notice({ tone:'warn', icon:'i-alert',
          title:'Envanterdeki eski zimmet iddiası düşürüldü (K-30)',
          text:iddia.metin + ' Bu satır veriye YAZILMAZ; görüntü anında defterden türer ve ' +
               'burada basılır çünkü envanterin bir zamanlar başka bir şey söylediği bilgisi ' +
               'kaybolmamalıdır.' });
      }
    }

    /* ---- TÜRETİLECEK DEĞERLER — sessiz değil, önceden gösterilir ---- */
    var turetim = [];
    if(!bosNull(v.barkod)){
      turetim.push(['Barkod', barkodTuret(hedefKod)
        ? kodEt(barkodTuret(hedefKod)) + GV.cell.sub('kaynak: kodun sıra numarası · ölçüm ' +
            BARKOD_DESEN + '/' + tumu.length + ' kayıtta bu desen')
        : faint('türetilemedi — kod deseni okunamadı, alan boş kalır')]);
    }
    if(!bosNull(v.garantiBas) && bosNull(v.alisTarihi)){
      turetim.push(['Garanti başlangıcı', '<span class="cell-date">' + F.date(v.alisTarihi) +
        '</span>' + GV.cell.sub('kaynak: alış tarihi · ölçüm ' + GAR_ALIS_AYNI + '/' +
        GAR_BAS_DOLU + ' kayıtta ikisi eşit')]);
    }
    if(turetim.length){
      out += kart('i-sliders', 'Boş bırakılan alanlar için türetim', turetim.length + ' alan',
        GV.dl(turetim) +
        faintNot('Bu değerler kaydetmede türetilecek ve denetim kaydında türetildikleri ' +
          'yazılacak. Alanı elle doldurursanız sizin değeriniz korunur; türetim yalnız BOŞ ' +
          'alanda çalışır. Türetilemeyen alan boş kalır — uydurulmaz.'));
    }

    /* ---- GARANTİ ---------------------------------------------------- */
    var garSatir = [];
    var garHata = garantiSirasi(garBas, garBit);
    garSatir.push(['Aralık', (garBas || garBit)
      ? esc((garBas ? F.date(garBas) : '—') + ' → ' + (garBit ? F.date(garBit) : '—'))
      : faint('girilmedi')]);
    if(garBit){
      /* Gün farkı ORTAK YORDAMDAN: GV.fmt.days(iso) = iso − DB.today,
         gün cinsinden (brief §21.11 · §22.1c.1 — SÜRE biçimlendiricisi
         DEĞİL). Yönü ekran ISO karşılaştırmasıyla söyler, ikinci bir
         gün aritmetiği kurmaz. */
      var fark = F.days(garBit);
      var bitti = String(garBit) < String(DB.today);
      garSatir.push([bitti ? 'Biteli' : 'Kalan',
        (fark == null || !isFinite(Number(fark)))
          ? faint('ölçülemedi')
          : GV.cell.gun(Math.abs(Number(fark)), bitti ? 'danger' : 'ok') +
            GV.cell.sub(bitti ? 'garanti bugüne göre BİTMİŞ (bugün ' + F.date(DB.today) + ')'
                              : 'bugün ' + F.date(DB.today))]);
    }
    if(garHata){
      garSatir.push(['Sıra', '<span class="u-danger">' + esc(garHata) +
        '</span>' + GV.cell.sub('kaydetme bu hâlde REDDEDİLİR — uyarıp geçmek yasak')]);
    }
    if(garBas && bosNull(v.alisTarihi) && String(garBas) < String(v.alisTarihi)){
      garSatir.push(['Alışla ilişki', '<span class="u-warn">garanti başlangıcı alış ' +
        'tarihinden önce</span>' + GV.cell.sub('bu bir KAPI DEĞİL gözlemdir: defterde ' +
        GAR_ALIS_AYNI + '/' + GAR_BAS_DOLU + ' kayıtta ikisi eşit, ama ikinci el alımda ' +
        'ayrışabilir — kayıt kabul edilir')]);
    }
    out += kart('i-shield-check', 'Garanti', esc(GAR_BITEN + '/' + tumu.length + ' kayıt bitmiş'),
      GV.dl(garSatir) +
      faintNot('Garanti bitişi başlangıçtan önce olamaz ve bu bir <b>kapıdır</b>: kural iki ' +
        'alandan da sorulur (hangisini sonradan değiştirirseniz kapı kapanır) ve kaydetme ' +
        '<b>reddedilir</b>. Kalan gün <b>GV.fmt.days</b> ile ölçülür; ekran ikinci bir gün ' +
        'aritmetiği kurmaz.'));

    /* ---- TEDARİK ---------------------------------------------------- */
    var tedSatir = [];
    var ted = bosNull(v.tedarikci) ? tedarikciKaydi(v.tedarikci) : null;
    var sip = bosNull(v.siparis) ? siparisKaydi(v.siparis) : null;
    tedSatir.push(['Tedarikçi', ted
      ? '<span class="cell-main">' + esc(ted.unvan) + '</span>' +
        GV.cell.sub(esc(ted.kod + ' · ' + (ted.kategori || 'kategori yok') +
          (ted.odemeVadesi ? ' · vade ' + ted.odemeVadesi : '') +
          (typeof ted.puan === 'number' ? ' · puan ' + F.num(ted.puan, 1) : '')))
      : (bosNull(v.tedarikci)
          ? '<span class="u-warn">' + esc(v.tedarikci) + ' tedarikçi defterinde yok</span>'
          : faint('seçilmedi — defterde ' + TED_DOLU + '/' + tumu.length + ' kayıtta dolu'))]);
    tedSatir.push(['Sipariş', sip
      ? kodEt(sip.kod) + GV.cell.sub(esc((sip.tedarikci || '—') + ' · ' +
          (sip.tarih ? F.date(sip.tarih) : 'tarih yok') + ' · ' + (sip.durum || '—') +
          (sip.teslimKontrol ? ' · teslim kontrolü: ' + sip.teslimKontrol : '')))
      : (bosNull(v.siparis)
          ? '<span class="u-warn">' + esc(v.siparis) + ' sipariş defterinde yok</span>'
          : faint('bağlanmadı — ' + SIPARIS_DOLU + '/' + tumu.length +
                  ' demirbaş bir siparişten türetildi'))]);
    if(ted && sip && sip.tedarikci && ted.kod !== sip.tedarikci){
      tedSatir.push(['Tutarlılık', '<span class="u-warn">seçilen sipariş başka bir ' +
        'tedarikçinin (' + esc(sip.tedarikci) + ')</span>' +
        GV.cell.sub('bu bir gözlemdir; siparişi bir demirbaşa bağlayan kuralı yazan yordam ' +
                    'yok, kayıt reddedilmez')]);
    }
    out += kart('i-truck', 'Tedarik zinciri', null, GV.dl(tedSatir) +
      faintNot('Sipariş bağı <b>opsiyoneldir</b> ve boş kalması ölçülmüş bir gerçektir: ' +
        'defterdeki ' + tumu.length + ' demirbaşın ' + SIPARIS_DOLU + ' tanesi bir siparişe ' +
        'bağlı. Tedarikçi eşleşmesi bir sipariş bağı DEĞİLDİR ve öyle sayılmaz.'));

    /* ---- PARA KAPISI — kapalıysa SEBEBİ yazılır (boş kutu bırakılmaz) */
    if(!canFinans){
      out += GV.notice({ tone:'info', icon:'i-lock',
        title:'Alış bedeli alanı basılmadı',
        text:'Rolünüz (' + GV.perm.role() + ') para göremiyor; ' + FINANS_ROL + '/' + ROL_SAYI +
             ' rolde bu bayrak açık. Maskelenmiş bir giriş alanı kaydedildiğinde gerçek değeri ' +
             '"••••••" ile ezerdi, bu yüzden alan hiç basılmadı ve kaydetme onu okumuyor' +
             (rec ? ' — kaydın mevcut bedeline dokunulmuyor.'
                  : '; kayıt bedel alanı boş (null) doğar. "0" yazmak "bedeli sıfır" demek ' +
                    'olurdu, oysa doğru cümle "bu oturumda yazılamadı".') });
    }

    /* ---- MÜKERRER GÖZLEMİ — kapı değil ------------------------------ */
    var seriAyni   = ayniAlan('seri', v.seri);
    var barkodAyni = ayniAlan('barkod', v.barkod);
    if(seriAyni.length || barkodAyni.length){
      out += GV.notice({ tone:'warn', icon:'i-alert',
        title:'Aynı değer başka bir demirbaş kaydında yazılı',
        text:(seriAyni.length
                ? 'Seri no: ' + seriAyni.map(function(a){ return a.kod; }).join(' · ') + '. '
                : '') +
             (barkodAyni.length
                ? 'Barkod: ' + barkodAyni.map(function(a){ return a.kod; }).join(' · ') + '. '
                : '') +
             'Bu bir KAPI DEĞİLDİR: demirbaş defteri için mükerrer kontrolü yordamı ' +
             'yazılmamış ve olmayan bir kuralı reddetmek onu uydurmak olurdu. Ölçüldü: ' +
             SERI_TEKIL + '/' + tumu.length + ' kayıtta seri no tekil — yani çakışma ' +
             'defterin bugünkü hâline aykırıdır ve büyük olasılıkla bir hatadır.' });
    }

    /* ---- Düzenleme kipinde: kaydetme neye dokunur ------------------- */
    if(rec){
      out += kart('i-edit', 'Kaydetme neye dokunur', null,
        GV.dl([
          ['Yazılacak', esc(METIN_ALAN.map(zorLabel).join(', '))],
          ['Alış bedeli', canFinans
            ? 'yazılacak'
            : '<span class="u-muted">okunmayacak — para yetkisi kapalı, kayıttaki değer ' +
              'korunuyor</span>'],
          ['Durum', '<span class="u-muted">okunmayacak — türetilmiş görünüm, otorite zimmet ' +
            'defteri; durum yalnız doğum literalinde verilir</span>'],
          ['Dokunulmayacak', 'durum · zimmetli · zimmetTarihi · iadeTarihi · arsiv · aktif' +
            GV.cell.sub('ilk üçü türetilmiş görünümün alanları (tek yazan yer GV.varlik), ' +
              '<b>arsiv</b> ayrı bir eksen (bu kayıtta ' +
              (GV.arsivli(rec) ? 'ARŞİVLİ' : 'arşivli değil') + '), <b>aktif</b> tuzaklı')]
        ]));
    }

    return out;
  }

  /* =================================================================
     8. KAYDETME
     ================================================================= */
  function kaydet(){
    var v = form.submit();
    if(!v) return false;                     /* doğrulama düştü — bileşen söyledi */
    return rec ? guncelle(v) : yeniKayit(v);
  }

  /* Bağ doğrulaması TEK yerde: seçenek listesi dışından (adres, korunan
     seçenek, DOM kurcalama) gelen bir kodu sessizce yazmak, defterde
     karşılığı olmayan bir bağ üretmek olurdu. */
  function baglarGecerli(v){
    var depKod = bosNull(v.dep);
    if(depKod && !depKaydi(depKod)){
      GV.toast(depKod + ' departman defterinde bulunamadı; departman bağı kurulmadı.', 'danger');
      return false;
    }
    var tedKod = bosNull(v.tedarikci);
    if(tedKod && !tedarikciKaydi(tedKod)){
      GV.toast(tedKod + ' tedarikçi defterinde bulunamadı; tedarikçi bağı kurulmadı.', 'danger');
      return false;
    }
    var sipKod = bosNull(v.siparis);
    if(sipKod && !siparisKaydi(sipKod)){
      GV.toast(sipKod + ' sipariş defterinde bulunamadı; sipariş bağı kurulmadı.', 'danger');
      return false;
    }
    var g = garantiSirasi(bosNull(v.garantiBas) || bosNull(v.alisTarihi), bosNull(v.garantiBit));
    if(g){
      /* İkinci sigorta: alan doğrulaması normalde buraya düşmez, ama
         garanti başlangıcı TÜRETİLDİĞİNDE (boş alan → alış tarihi) kapı
         yeniden ölçülmelidir. Uyarıp geçmek yasak. */
      GV.toast(g + ' Kayıt kaydedilmedi.', 'danger', 6000);
      return false;
    }
    return true;
  }

  /* Durum okuma TEK yerde ve YALNIZ DOĞUMDA: düzenleme kipinde bu yordam
     hiç çağrılmaz, alan da basılmaz. */
  function durumOku(v){
    if(!durumBasilir) return null;
    var d = bosNull(v.durum);
    if(d && SECILEBILIR.indexOf(d) === -1){
      /* Buraya normalde düşülmez (select yalnız iki değer taşır); adres
         ya da DOM üzerinden gelen türetilmiş bir durumu yazmak, bir
         sonraki yüklemede ezilecek bir yalan yazmak olurdu. */
      GV.toast('"' + d + '" bu formdan yazılamaz: değer zimmet defterinden türetilir ya da ' +
               'yazan bir yordamı yok. Kayıt kaydedilmedi.', 'danger', 6000);
      return false;
    }
    return d || DOGUM;
  }

  function yeniKayit(v){
    if(!DOGUM){
      GV.toast('Demirbaş durum sözlüğü okunamadı; kayıt doğum durumu olmadan açılamaz.', 'danger');
      return false;
    }
    if(!baglarGecerli(v)) return false;
    var durum = durumOku(v);
    if(durum === false) return false;

    var hedefKod = kodUret();
    var barkod   = bosNull(v.barkod) || barkodTuret(hedefKod);
    var garBas   = bosNull(v.garantiBas) || bosNull(v.alisTarihi);
    var turetilen= [];
    if(!bosNull(v.barkod) && barkod)      turetilen.push('barkod (koddan)');
    if(!bosNull(v.garantiBas) && garBas)  turetilen.push('garantiBas (alış tarihinden)');

    /* ---- DOĞUM — nesne literali (§22.1b.4: `GV.demirbas.olustur` YOK).
       Alan sırası defterdeki 20 alanlı şemayla aynıdır; biçim değiştirmek
       defteri ikiye bölerdi.
       ZİMMET ALANLARI — `null` ŞEKLİYLE DOĞAR, DEĞER YAZILMAZ:
         `zimmetli` · `zimmetTarihi` · `iadeTarihi` türetilmiş görünümün
         alanlarıdır ve bu ekran onlara HİÇBİR ZAMAN bir personel kodu ya
         da tarih yazmaz; değer yazan tek yer `GV.varlik`tır (kabulEt ·
         kabulGeriAl · tazele) ve otorite `DB.assignments`tir (§22.17.1).
         ⚠️ Ama literalde HİÇ YER ALMAMALARI ölçüldü ve YANLIŞ çıktı:
         `zimmetli` alanını taşımayan bir kayıtta `GV.varlik.tazele`
         alanı `undefined`dan `null`a çekiyor ve `tazeleHepsi` o kaydı
         HER AÇILIŞTA "değişti" diye rapor ediyor (ölçüldü:
         `degisen:[{kod:…,eskiDurum:'Depoda',yeniDurum:'Depoda'}]`).
         K-30 tam bunu yasaklıyor: "bir onarımın her seferinde tekrar
         koşması, onarılmamış demektir" ve `sonTazeleme.degisen.length
         === 0` öyle kalmalıdır. Bu yüzden üç alan `null` DEĞERİYLE —
         yani türetimin tutanaksız demirbaş için hesapladığı değerle —
         doğar; defterdeki 15 kaydın 15'i de bu üç alanı taşıyor, şekil
         korunur. Ölçüm: tam şekilli kayıt eklendiğinde `tazeleHepsi`
         `degisen:[]` döndürüyor.
       DİĞER YAZILMAYAN alanlar ve sebepleri:
         · `arsiv` → arşiv ekseni AYRIDIR (§22.10) ve sorusu
           `GV.arsivli`den geçer. Ölçüldü: defterde alan yalnız 1/15
           kayıtta var. Yeni kayıt alanı taşımadan doğar; "false" yazmak
           var olmayan bir ekseni varmış gibi göstermek olurdu.
         · `aktif` → TUZAKLI alan (K-33): okunmaz, yazılmaz, süzülmez.
       TÜRETİLENLER: `barkod` (kodun sıra numarasından) ve boş bırakıldıysa
       `garantiBas` (alış tarihinden). İkisi de yalnız BOŞ alanda türetilir
       ve denetim kaydında yazılır. */
    var yeni = {
      kod:hedefKod,
      kategori:bosNull(v.kategori),
      altKategori:bosNull(v.altKategori),
      marka:bosNull(v.marka),
      model:bosNull(v.model),
      seri:bosNull(v.seri),
      ozellik:bosNull(v.ozellik),
      alisTarihi:bosNull(v.alisTarihi),
      alisFiyati:canFinans ? sayiYaNull(v.alisFiyati) : null,
      tedarikci:bosNull(v.tedarikci),
      garantiBas:garBas,
      garantiBit:bosNull(v.garantiBit),
      lokasyon:bosNull(v.lokasyon),
      dep:bosNull(v.dep),
      durum:durum,
      zimmetli:null,          /* ↑ üçü de TÜRETİLMİŞ görünümün ŞEKLİ:    */
      zimmetTarihi:null,      /*   tutanaksız demirbaş için türetimin     */
      iadeTarihi:null,        /*   hesapladığı değer NULL'dır (ölçüldü)   */
      barkod:barkod,
      siparis:bosNull(v.siparis)
    };
    (DB.assets || (DB.assets = [])).unshift(yeni);

    GV.audit.yaz({
      kayit:hedefKod, modul:'Demirbaş',
      islem:'Demirbaş kaydı oluşturuldu · ' +
            [yeni.kategori, [yeni.marka, yeni.model].filter(Boolean).join(' ')]
              .filter(Boolean).join(' · ') +
            ' · seri ' + (yeni.seri || 'yok') +
            ' · ' + (yeni.lokasyon || 'lokasyon yok') +
            (turetilen.length ? ' · türetilen alan: ' + turetilen.join(', ') : ''),
      yeni:durum, tone:'ok', icon:'i-plus' });

    if(!canFinans)
      GV.toast('Alış bedeli yetkiniz olmadığı için ne basıldı ne yazıldı; kayıt bedel ' +
               'bilgisi olmadan doğdu.', 'info', 6000);

    GV.afterSave({
      kod:hedefKod, liste:'app-varlik.html', detay:'app-demirbas-detay.html', yeni:true,
      mesaj:hedefKod + ' oluşturuldu; demirbaş "' + durum + '" durumunda doğdu. Durum ' +
            'TÜRETİLMİŞ bir görünümdür: zimmet ancak personel bir tutanağı kabul ettiğinde ' +
            'envanteri "Zimmetli" yapar' +
            (turetilen.length ? '. Türetilen alan: ' + turetilen.join(', ') : '') + '.',
      alt:[{ label:'Zimmet yüzeyini aç', href:'app-varlik.html?t=zimmet' }]
    });
    return true;
  }

  function guncelle(v){
    if(!baglarGecerli(v)) return false;

    /* Yazılan alanlar: YALNIZ forma basılanlar. `durum` · `zimmetli` ·
       `zimmetTarihi` · `iadeTarihi` · `arsiv` · `aktif` bu döngülerde
       YOK — basılmadıkları için okunmuyorlar da. Para alanı yalnız yetki
       varsa listeye giriyor: maskelenmiş/basılmamış bir alanı yazmak
       gerçek değeri ezerdi (§22.17.6). */
    var degisen = [];
    METIN_ALAN.forEach(function(k){
      var yeniD = bosNull(v[k]);
      /* Türetim yalnız BOŞ alanda çalışır ve neyin türetildiği yazılır. */
      if(k === 'barkod'     && !yeniD) yeniD = barkodTuret(rec.kod);
      if(k === 'garantiBas' && !yeniD) yeniD = bosNull(v.alisTarihi);
      var eskiD = (rec[k] == null || rec[k] === '') ? null : rec[k];
      if(String(yeniD) !== String(eskiD)){ degisen.push(k); rec[k] = yeniD; }
    });
    if(canFinans){
      PARA_ALAN.forEach(function(k){
        var yeniD = sayiYaNull(v[k]);
        var eskiD = rec[k] == null ? null : rec[k];
        if(yeniD !== eskiD){ degisen.push(k); rec[k] = yeniD; }
      });
    }
    /* DURUM BU DÖNGÜLERDE YOK ve bilinçli olarak yok: türetilmiş bir
       alana atama yasak (§22.17.1) ve var olan bir demirbaşın durumunu
       yazan bir ortak yordam yazılmamış. Kaydın durumu ne ise o kalır. */

    GV.audit.yaz({
      kayit:rec.kod, modul:'Demirbaş',
      islem:degisen.length
        ? 'Demirbaş kaydı güncellendi — değişen alan: ' +
          degisen.map(function(k){ return ETIKET[k] || k; }).join(', ')
        : 'Demirbaş kaydı kaydedildi — basılan alanlarda değişiklik yok',
      tone:'info', icon:'i-edit' });

    if(!canFinans)
      GV.toast('Alış bedeli yetkiniz olmadığı için ne basıldı ne okundu; kayıttaki değer ' +
               'korundu.', 'info', 6000);
    GV.toast('Durum alanı okunmadı: türetilmiş görünüme atama yasak ve var olan bir ' +
             'demirbaşın durumunu yazan yordam yok. Kayıttaki durum ("' + rec.durum +
             '") korundu.', 'info', 6000);

    GV.afterSave({
      kod:rec.kod, liste:'app-varlik.html', detay:'app-demirbas-detay.html', yeni:false,
      mesaj:'Demirbaş kaydı güncellendi; durum "' + rec.durum + '" olarak kaldı — durum bu ' +
            'formdan hiç okunmadı (türetilmiş görünüm; otorite zimmet defteri). Zimmet ' +
            'alanlarına (zimmetli · zimmetTarihi · iadeTarihi) dokunulmadı.',
      alt:acikZimmet ? [{ label:'Zimmet yüzeyini aç', href:'app-varlik.html?t=zimmet' }] : []
    });
    return true;
  }
