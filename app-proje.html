<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Projeler — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-sec="operasyon" data-screen="proje">
<div id="rec"></div>

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/data/hr.js"></script>
<script src="assets/data/lifecycle.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script src="assets/js/quicknote.js"></script>
<script>
/* =====================================================================
   PROJELER — ekran brief §4 (GV.list) · §18 (Dilim 3) · §19 (§19.0/§19.5)

   TEK LİSTE. Tablo, sayfalama, arama, gelişmiş filtre, kolon yönetimi,
   çıktı, arşiv toggle, tablo/kart/kanban anahtarı, URL senkronu ve satır
   kapsamı `GV.list`in işidir; bu ekran YALNIZ yapılandırma yazar.

   ⚠️ `hr.js` YÜKLENİR VE ZORUNLUDUR (brief §18.0 · §19.0). `DB.timelogs`
   (131 kayıt) `work.js`te DEĞİL `hr.js`tedir; `GV.proje.sure` ve
   `GV.proje.maliyet` onu okur. Yüklenmezse iki yordam da `kapsam:false`
   döner ve ekran "defter bu projeyi kapsamıyor" derdi — oysa doğru cümle
   "defter bu ekranda hiç yüklü değil"dir. İkisi ayrı şeydir (L-13) ve
   ilki SESSİZCE YANLIŞ beyandır. Ekran yine de defterin varlığını ölçer
   ve yoksa bunu söyler; sessiz varsayım yapmaz.
   `firsat.js` ve `odeme.js` bu ekranda kullanılmaz — yüklenmez.

   DURUM KÜMELERİ ELLE YAZILMAZ. "Bu proje açık mı / kapandı mı / gecikti
   mi" sorusunun cevabı `GV.proje.acik/kapali/bitti/arsivli/geciken`
   yordamlarındadır (brief §18.5). `p.durum !== 'Teslim'` gibi bir cümle
   yedi ekranda kopyalanmıştı ve sözlük değişince yedisi birden sessizce
   yanlışa düşüyordu; o cümle burada YOK.

   DURUM DEĞİŞİMİ BU EKRANDA YAPILMAZ. Proje geçişleri
   (`GV.flow.adimlar('project', …)` → `GV.flow.gec`) ve kapanış akışı
   (`GV.proje.kapat` — kapanış kontrolü + gerekçe + yönetici istisnası)
   proje detayında yaşar; listede ikinci bir kopya kurmak, aynı kuralı iki
   yerde tanımlamak olurdu (L-40). Liste okur, yönlendirir.
   ===================================================================== */
document.addEventListener('gv:ready', function(){
  var F = GV.fmt;
  var mount = document.getElementById('rec');
  if(!mount) return;

  var canFinans = GV.perm.can('finans');

  /* =================================================================
     0. SÖZLÜKLER VE ÖLÇÜMLER — hepsi veriden TÜRETİLİR
     ================================================================= */
  var DURUMLAR  = DB.projectStatuses || [];      /* 10 durum */
  var SAGLIKLAR = DB.healthLevels || [];         /* İyi · Dikkat · Riskli */
  var PT        = (DB.transitions && DB.transitions.project) || {};
  var tumu      = DB.projects || [];

  /* Zaman defteri bu ekranda YÜKLÜ MÜ — `kapsam:false`nin iki ayrı sebebi
     olduğu için ölçülür (yukarıdaki uyarı). `hr.js` script'i kaldırılırsa
     ekran sessizce yanlış beyanda bulunmaz, durumu söyler. */
  var defterVar = !!(DB.timelogs && DB.timelogs.length);

  /* SAĞLIK UYARISI — `DB.healthLevels` ŞİDDET SIRASINA göre dizilidir
     (İyi → Dikkat → Riskli): ilk değer sağlıklı olandır, kalanlar uyarıdır.
     Kümeyi elle yazmak yerine sözlükten kesmek, sözlüğe dördüncü bir
     seviye eklendiğinde sekmenin kendiliğinden doğru kalmasını sağlar. */
  var SAGLIK_UYARI = SAGLIKLAR.slice(1);

  /* Sessiz boşluk bırakılmaz: sözlükte olup geçiş tablosunda karşılığı
     olmayan ya da kayıtta olup sözlükte olmayan değer, sekme toplamı ile
     "Tümü" arasında açıklanamayan fark üretirdi. İkisi de ölçülür. */
  var TABLOSUZ  = DURUMLAR.filter(function(d){ return !PT[d]; });
  var SOZLUKSUZ = tumu.reduce(function(acc, p){
    if(p.durum && DURUMLAR.indexOf(p.durum) === -1 && acc.indexOf(p.durum) === -1) acc.push(p.durum);
    return acc;
  }, []);
  var SAGLIKSIZ = tumu.reduce(function(acc, p){
    if(p.saglik && SAGLIKLAR.indexOf(p.saglik) === -1 && acc.indexOf(p.saglik) === -1) acc.push(p.saglik);
    return acc;
  }, []);

  /* ---- Kısa geçitler — tanım TEK YERDE, brief §18.5 ------------------ */
  function acik(p){    return GV.proje.acik(p); }
  function kapali(p){  return GV.proje.kapali(p); }
  function bitti(p){   return GV.proje.bitti(p); }
  function arsivli(p){ return GV.proje.arsivli(p); }
  function geciken(p){ return GV.proje.geciken(p); }
  /* "İş bitti, defter kapanmadı" aralığı — kapanış akışının hedefi tam
     burasıdır. Yine kendi cümlem değil, iki yordamın farkı. */
  function teslimde(p){ return bitti(p) && !kapali(p); }
  function saglikUyari(p){ return !!p.saglik && SAGLIK_UYARI.indexOf(p.saglik) !== -1; }

  function gecikmeGun(p){
    if(!geciken(p)) return null;
    return Math.round((new Date(DB.today) - new Date(p.planlananBitis)) / 86400000);
  }

  /* ---- Bağ okuma — tarih yakınlığı bağ değildir --------------------- */
  function gorevSayisi(kod){
    return (DB.tasks || []).filter(function(t){ return t.proje === kod; }).length;
  }
  function kisiAd(kod){ return (kod && DB.empName) ? (DB.empName(kod) || kod) : (kod || ''); }

  /* Seçenekler KAYITTA GEÇEN değerlerden üretilir: 15 modüllük ya da 7
     fazlık sözlüğün tamamını listelemek, hiçbir kaydı süzmeyen ölü
     seçenekler doğururdu (app-gorev.html · app-satinalma.html ile aynı
     gerekçe). Sözlük sırası korunur, alfabetik bozulmaz. */
  function mevcut(alan, etiketle, sozluk){
    var gecen = tumu.reduce(function(acc, p){
      var v = p[alan];
      if(v == null || v === '') return acc;
      if(acc.indexOf(v) === -1) acc.push(v);
      return acc;
    }, []);
    if(sozluk && sozluk.length){
      gecen = sozluk.filter(function(v){ return gecen.indexOf(v) !== -1; })
                    .concat(gecen.filter(function(v){ return sozluk.indexOf(v) === -1; }));
    }else{
      gecen.sort(function(a, b){ return String(a).localeCompare(String(b), 'tr'); });
    }
    return gecen.map(function(v){
      return { value:v, label:etiketle ? (etiketle(v) || v) : v };
    });
  }

  /* ⚠️ SIRA — `GV.pageHead` `GV.list`ten ÖNCE (brief §2.4): liste satır
     sayısını `[data-listcount]` düğümüne yazar, o düğümü pageHead doğurur. */
  GV.pageHead({
    eyebrow:'Proje ve Operasyon',
    title:'Projeler',
    sub:tumu.length + ' proje · plandan kapanışa tek listede',
    actions:[
      /* Proje ALT kayıtlarını proje bağlamı dışında görmek için yeni ekran
         değil Operasyon kuyruğu kullanılır (brief §18.7). Bağlantı gerçek
         ve yayında; ölü buton yok. */
      { label:'Operasyon Kuyruğu', icon:'i-layers', href:'app-operasyon.html' }
    ]
  });

  mount.innerHTML =
    '<div id="prjUyari" class="u-mb-8"></div>' +
    '<div id="prjListe"></div>' +
    '<div id="prjBackend"></div>';

  /* =================================================================
     1. ÖLÇÜM ŞERİDİ — GÖRÜNEN kümeden sayılır
     ----------------------------------------------------------------
     Kapsam, sekme, arşiv, arama ve filtre süzgeçlerini `GV.list`
     uyguluyor; şerit onun `onRender` kancasından beslenir, ikinci bir
     süzgeç yazılmaz (L-40). Sayı üretilemiyorsa "0" değil, ölçümün
     kendisi söylenir (L-13).
     ================================================================= */
  function uyariCiz(gorunen){
    var el = document.getElementById('prjUyari');
    if(!el) return;

    /* Koleksiyon hiç yüklü değil → "kapsamıyor" demek yanlış olurdu; bu
       ayrı bir şerittir ve ölçüm şeridinin ÜSTÜNDE durur. */
    var defterUyarisi = defterVar ? '' : GV.notice({ tone:'warn', icon:'i-alert',
      title:'Zaman defteri bu ekranda yüklü değil',
      text:'DB.timelogs koleksiyonu bulunamadı (assets/data/hr.js). Gerçekleşen süre, ' +
           'faturalanabilir saat ve maliyet kolonları bu yüzden BOŞ bırakıldı — sıfır ' +
           'yazılmadı ve "defter bu projeyi kapsamıyor" da denmedi. İkisi ayrı şeydir; ' +
           'ölçülemeyeni ölçülmüş göstermek en pahalı hatadır.' });

    var g   = gorunen.length;
    var acikN     = gorunen.filter(acik).length;
    var kapaliN   = gorunen.filter(kapali).length;
    var arsivliN  = gorunen.filter(arsivli).length;
    var teslimdeN = gorunen.filter(teslimde).length;
    var gecikenL  = gorunen.filter(geciken);
    var uyariL    = gorunen.filter(saglikUyari);

    /* Defter kapsamı — süre ve maliyet AYNI ŞEY DEĞİLDİR: `sure.kapsam`
       "defterde satır var" der, `maliyet.kapsam` "ölçülebilen maliyet
       var" der. Onaylı saati olmayan projede birincisi true, ikincisi
       false olabilir; ikisi ayrı sayılır. */
    var sureli = 0, maliyetli = 0, onaysizBekleyen = 0, eksikP = [], guvenmez = [];
    gorunen.forEach(function(p){
      var s = GV.proje.sure(p.kod);
      var m = GV.proje.maliyet(p.kod);
      if(s.kapsam) sureli++;
      if(m.kapsam) maliyetli++;
      if(s.kapsam && s.tum > s.gerceklesen) onaysizBekleyen++;
      (m.maliyetsizPersonel || []).forEach(function(k){ if(eksikP.indexOf(k) === -1) eksikP.push(k); });
      (m.oranGuvenilmez  || []).forEach(function(k){ if(guvenmez.indexOf(k) === -1) guvenmez.push(k); });
    });

    /* Alan doluluğu — brief §19.5 uyarısı ekranda da ölçülür. */
    var gercekBitisli = gorunen.filter(function(p){ return !!p.gercekBitis; }).length;
    var fazli         = gorunen.filter(function(p){ return !!p.faz; }).length;
    var gecikmeNotlu  = gorunen.filter(function(p){ return !!p.gecikmeNedeni; }).length;

    /* ⚠️ `GV.notice` `text`i KENDİ escape eder (ui.js) — buradaki parçalarda
       ikinci kez `GV.esc` çağrılmaz, yoksa metin çift kaçışlı basılırdı. */
    var parcalar = [];
    parcalar.push('Görünen ' + g + ' projeden ' + acikN + ' tanesi açık, ' + teslimdeN +
      ' tanesi teslim edilmiş ama defteri kapanmamış, ' + kapaliN + ' tanesi kapanmış kayıt.');

    /* ARŞİV ile KAPANIŞ ayrı eksenlerdir (GV.proje.arsivli ≠ .kapali):
       arşivlenmemiş kapalı proje de mümkündür, ikisi ayrı sayılır. */
    var kapaliArsivsiz = gorunen.filter(function(p){ return kapali(p) && !arsivli(p); }).length;
    if(arsivliN){
      parcalar.push(arsivliN + ' proje arşivlidir. Arşiv, kapanıştan AYRI bir eksendir — ' +
        (kapaliArsivsiz
          ? kapaliArsivsiz + ' kapalı proje henüz arşivlenmemiş durumda.'
          : 'bu görünümde arşivlenmemiş kapalı proje yok.'));
    }else{
      parcalar.push('Bu görünümde arşivli proje yok; arşivli kayıtlar varsayılan olarak ' +
        'gizlenir ve "Arşivlenenleri Göster" ile listeye girerler. Arşiv ile kapanış ayrı ' +
        'eksenlerdir — arşivlenmemiş kapalı proje de mümkündür.');
    }

    if(gecikenL.length){
      parcalar.push(gecikenL.length + ' projenin planlanan bitişi ' + F.date(DB.today) +
        ' tarihini geçmiş ve proje hâlâ açık (' +
        gecikenL.map(function(p){ return p.kod; }).join(', ') + '). Kapanmış bir ' +
        'projenin geçmiş bitiş tarihi gecikme sayılmaz.');
    }
    if(uyariL.length){
      parcalar.push('Sağlık uyarısı taşıyan ' + uyariL.length + ' proje var: ' +
        SAGLIK_UYARI.map(function(s){
          return s + ' ' + uyariL.filter(function(p){ return p.saglik === s; }).length;
        }).join(' · ') + '.');
    }

    if(defterVar){
      parcalar.push('Zaman defteri ' + sureli + ' projeyi kapsıyor' +
        ((g - sureli)
          ? ', kalan ' + (g - sureli) + ' projede defterde tek satır yok — o satırlarda ' +
            '"0 saat" değil "—" basılır ve sebebi yazılır.'
          : '; görünen her projenin defterde kaydı var.') +
        ' Ölçülebilen maliyet ' + maliyetli + ' projede var; kalanlarda kâr ve kârlılık ' +
        'BOŞ bırakıldı, çünkü maliyeti sıfır saymak kârlılığı %100 göstermek olurdu.');
      if(onaysizBekleyen) parcalar.push(onaysizBekleyen + ' projede onay bekleyen zaman ' +
        'kaydı var; gerçekleşen süre yalnız ONAYLI satırlardan sayılır, fark hücrenin ' +
        'alt satırında yazılıdır.');
      if(eksikP.length) parcalar.push('Saatleri maliyete GİRMEYEN personel: ' +
        eksikP.map(kisiAd).join(' · ') + ' — saatlik iç maliyeti türetilemedi, ' +
        'ilgili projelerin toplamı bu kadar eksiktir.');
      if(guvenmez.length) parcalar.push('Oranı güvenilmez personel: ' +
        guvenmez.map(kisiAd).join(' · ') + ' — zaman kaydı tarihinde geçerli maaş ' +
        'kaydı yok, bugünkü oran kullanıldı; o projelerde kârlılık kesin değildir.');
    }

    parcalar.push('Alan doluluğu (görünen kümede): gerçek bitiş ' + gercekBitisli + '/' + g +
      ' · faz ' + fazli + '/' + g + ' · gecikme nedeni ' + gecikmeNotlu + '/' + g +
      '. Boş olanlarda "—" ve sebebi basılır; bugünün tarihi ya da sıfır yazılmaz.');

    if(TABLOSUZ.length)
      parcalar.push('Sözlükte olup geçiş tablosunda karşılığı olmayan durum: ' +
        TABLOSUZ.join(', ') + '.');
    if(SOZLUKSUZ.length)
      parcalar.push('Kayıtta olup DB.projectStatuses sözlüğünde olmayan durum: ' +
        SOZLUKSUZ.join(', ') + '.');
    if(SAGLIKSIZ.length)
      parcalar.push('Kayıtta olup DB.healthLevels sözlüğünde olmayan sağlık değeri: ' +
        SAGLIKSIZ.join(', ') + '.');

    el.innerHTML = defterUyarisi + GV.notice({
      tone:gecikenL.length ? 'warn' : 'info',
      icon:gecikenL.length ? 'i-alert' : 'i-briefcase',
      title:gecikenL.length
        ? gecikenL.length + ' proje planlanan bitişini geçmiş'
        : 'Bu görünümde planlanan bitişini geçen proje yok',
      text:parcalar.join(' ') });
  }

  /* =================================================================
     2. SEKMELER — durum listesi değil, yordamla ölçülen kümeler
     ----------------------------------------------------------------
     Küme soruları `GV.proje.*`a sorulur (brief §18.5); ekran kendi
     cümlesini kurmaz. Sekme SAYAÇLARINI `GV.list` basar.
     ================================================================= */
  var sekmeler = [
    { key:'tumu',    label:'Tümü',       icon:'i-list',            filter:null },
    { key:'acik',    label:'Açık',       icon:'i-activity',        filter:function(p){ return acik(p); } },
    { key:'geciken', label:'Geciken',    icon:'i-alert',           filter:function(p){ return geciken(p); } },
    { key:'saglik',  label:'Sağlık uyarısı', icon:'i-gauge',       filter:function(p){ return saglikUyari(p); } },
    /* Teslim edildi ama defteri kapanmadı — kapanış akışının hedef aralığı. */
    { key:'teslim',  label:'Kapanış bekleyen', icon:'i-truck',     filter:function(p){ return teslimde(p); } },
    { key:'kapali',  label:'Kapanan',    icon:'i-check-circle',    filter:function(p){ return kapali(p); } }
  ];

  /* =================================================================
     3. LİSTE
     ================================================================= */
  GV.list({
    mount:'#prjListe', id:'proje', key:'kod',
    source:function(){ return DB.projects; },
    exportName:'projeler', exportTitle:'Proje Listesi',
    pageSize:10, views:['table','card','kanban'],
    defaultSort:'planlananBitis', defaultDir:'asc',
    /* `urlSync` açık kalır: bu sayfada URL senkronu kullanan başka liste
       yok, çakışma olmaz (brief §18.9). Menüden ve panelden gelen
       `?t=…` / `?f_…` bağlantıları bu sayede çalışır. */

    search:{ placeholder:'Proje no, ad, müşteri, teknoloji veya risk ara',
             fields:['kod','ad','musteriAd','durum','tur','faz','kaynak','oncelik',
                     'teknoloji','ucuncuTaraf','riskler','gecikmeNedeni','sunucu','repo'],
             /* Kayıtta KOD tutulup ekranda AD gösterilen alanlar ancak böyle aranır. */
             extra:function(p){
               return [kisiAd(p.pm), kisiAd(p.teknikSorumlu), kisiAd(p.musteriSorumlu),
                       (p.ekip || []).map(kisiAd).join(' '), p.musteri || ''
                      ].filter(Boolean).join(' ');
             } },

    /* SATIR KAPSAMI — brief §4.7. Alan adları `DB.projects` şemasından
       ÖLÇÜLDÜ: `pm` (EMP-*) ve `musteri` (MUS-*) 14/14 kayıtta yazılı.
       · `kendi` bir ALAN DEĞİL YORDAMDIR: bir projenin "kendi kaydım"
         olması yalnız PM'i olmakla sınırlı değildir — ekip üyesi, teknik
         sorumlu ve müşteri sorumlusu da kayıtta adı geçen kişilerdir.
         Bileşen dizi dönen yordamı destekliyor (ui.js scopeField).
       · `departman` BİLDİRİLMEZ: proje kaydında departman alanı YOKTUR.
         Olmayan bir eşlemeyi bildirmek süzgeci sessizce yanlış kurardı;
         bildirilmeyen kapsamı bileşen kapsam şeridinde kendisi söyler. */
    scopeField:{
      kendi:function(p){
        return [p.pm, p.teknikSorumlu, p.musteriSorumlu]
                 .concat(p.ekip || []).filter(Boolean);
      },
      musteri:'musteri'
    },

    kpis:[
      /* 1 — AÇIK PROJE. `GV.proje.acik` = işi bitmemiş ve arşivlenmemiş. */
      { label:'Açık proje', icon:'i-briefcase',
        meta:function(base){
          return base.filter(kapali).length + ' kapanmış · ' +
                 base.filter(teslimde).length + ' teslim edildi, defteri kapanmadı · ' +
                 'toplam ' + base.length + ' kayıt kapsamda';
        },
        calc:function(base){ return base.filter(acik).length; } },

      /* 2 — GECİKEN. Kapanmış projenin geçmiş bitişi gecikme değildir;
             kuralı `GV.proje.geciken` tutuyor, ekran tekrar yazmıyor. */
      { label:'Geciken', icon:'i-alert', tone:'danger', metaTone:'warn',
        meta:function(){
          return 'planlanan bitişi ' + F.date(DB.today) + ' tarihinden önce olan ' +
                 've hâlâ AÇIK projeler · kapanmış projenin geçmiş bitişi sayılmaz';
        },
        calc:function(base){ return base.filter(geciken).length; } },

      /* 3 — SAĞLIK UYARISI. Durumdan bağımsız ikinci eksendir: sağlıklı
             görünen bir proje gecikebilir, geciken bir proje "İyi"
             işaretlenmiş olabilir. İkisi ayrı sayılır. */
      { label:'Sağlık uyarısı', icon:'i-gauge', tone:'warn',
        /* ⚠️ KPI `meta` çıktısı HAM basılır (ui.js) — `GV.notice`in aksine
           bileşen escape etmez, sözlük değerleri burada kaçırılır. */
        meta:function(base){
          var d = SAGLIKLAR.map(function(s){
            return GV.esc(s) + ' ' + base.filter(function(p){ return p.saglik === s; }).length;
          }).join(' · ');
          var yok = base.filter(function(p){ return !p.saglik; }).length;
          return d + (yok ? ' · ' + yok + ' projede sağlık işareti yok' : '') +
                 ' · sağlık DURUMDAN bağımsız ikinci eksendir';
        },
        calc:function(base){ return base.filter(saglikUyari).length; } },

      /* 4 — PORTFÖY DEĞERİ. `perm:'finans'` yetkisizde MASKELER; sıfır

      /* GERÇEKLEŞEN SÜRE — `GV.proje.sure` (brief §18.5).

           · defter yüklü değil     → "—" + "zaman defteri yüklü değil"

      { key:'sure', label:'Gerçekleşen süre', cellClass:'num',
        sortValue:function(p){

        exportValue:function(p){

      { key:'maliyet', label:'Maliyet / kârlılık', cellClass:'num', perm:'finans',

      { key:'defter', label:'Zaman defteri kapsamı', type:'select',

    rowActions:[
