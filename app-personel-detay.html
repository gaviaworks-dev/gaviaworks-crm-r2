<script>
/* =====================================================================
   PERSONEL KARTI — brief §22.14 (rota 81) · §20.1 · §20.2 · §20.3 · §20.5

   TEK KAYIT, YEDİ SEKME: ozet · performans · egitim · yasamdongusu ·
   zaman · zimmet · aktivite. Performans, eğitim, kapasite, işe giriş/çıkış
   ve zimmet AYRI EKRAN AİLESİ DEĞİLDİR (brief §20.5) — hepsi bu kartın bir
   sekmesidir. Sekme mekaniği `app-proje-detay.html` deseninin birebir
   aynısıdır (brief §18.7).

   ── ÖNCE KAPI, SONRA ALAN (brief §20.1 · §22.14) ──
   Personel kaydı ÜÇ ayrı hassasiyette alan taşır ve üçü aynı kapıdan
   geçmez:
     · genel  → kapı yok
     · özlük  → `GV.hr.ozlukGorebilir(e)` (kendi kaydı her zaman açık)
     · maaş   → `GV.hr.maasKapi(e)` / `GV.hr.maasGorebilir(e)` (öz-erişim
                açık — K-39 · ADR-R2-39)
   Kapı kapalıysa alan `••••••` basılır; BOŞ ya da `0` DEĞİL. Boş "veri yok"
   demektir, oysa veri var ve görülemiyor — ikisi ayrı şeydir (UID-11).
   Maskelenmiş değeri okuyan tek yer ortak yordamdır (`GV.hr.ozluk` ·
   `GV.hr.maas`); ekran kapıyı kendi lehine gevşetmez, ikinci bir maske
   cümlesi kurmaz.

   ⚠️ KÜME ile KAYIT sorusu ayrıdır (brief §22.1): tek kayıt basılırken
   argümanlı (`maasGorebilir(e)`), küme sayılırken argümansız
   (`maasGorebilir()`) çağrılır. Kişinin kendi ücretini görmesi 16 kişilik
   bir toplamı açmaz.

   ── TEMBEL ÇİZİM ZORUNLU ──
   Sekme gövdesi yalnız `gv:tab` olayında ve yalnız BİR KEZ çizilir.
   Dinleyici `document`a bağlıdır (`GV.refresh()`te ölmeyen kalıcı düğüm)
   ve `GV.on` ile tekil anahtar üzerinden bağlanır (brief §2.6 · L-16).
   `#hash` derin bağlantısı SÖZLEŞMEDİR:
   `app-personel-detay.html?id=EMP-006#zimmet` doğrudan o sekmeyi açar.

   ⚠️ ŞERİTTE İKON YOK (brief §22.13 · V2-04): ikonlu yedi/dokuz sekme
   1440 px'te içerik sütununa sığmıyor, `.gv-tabs` yatay kayıyor ama
   scrollbar'ı gizli — kesilen sekme kullanıcıya işaret bırakmadan
   kaybolurdu. İkonlar kart başlıklarında yaşıyor. Her sekme ÖLÇÜLEN kayıt
   sayısını taşır (`.gv-tab-cnt`).

   ── YASAKLAR (brief §22.17) ──
   · `e.durum = …` YOK → geçişler YALNIZ `GV.flow.gec('employee', …)`.
   · `e.aktif` okunmaz · yazılmaz · süzülmez (tuzak, K-18 → K-33).
   · `DB.salaryHistory` ve `DB.assignments`e satır YAZILMAZ (§22.16).
   · Çizim anında `scrollIntoView` çağrılmaz (K-37 · §21.11).
   · Sekme içindeki her `GV.list` `urlSync:false` bildirir (§18.9).
   ===================================================================== */
document.addEventListener('gv:ready', function(){
  var F     = GV.fmt;
  var esc   = GV.esc;
  var ico   = GV.ico;
  var mount = document.getElementById('rec');
  if(!mount) return;

  var MASK = '••••••';
  var BOS  = '<span class="u-faint">—</span>';
  var kod  = new URLSearchParams(location.search).get('id');

  /* `GV.hr.kayit` kod da kayıt da kabul eder; bulunamazsa null döner
     (K-42: `kod` alanı olmayan nesne kayıt DEĞİLDİR). */
  var e = GV.hr.kayit(kod);

  /* ---- 1. KAYIT YOK (brief §6 adım 1) ------------------------------ */
  if(!e){
    GV.pageHead({
      eyebrow:'Ekip ve Kaynaklar · Personel', title:'Kayıt bulunamadı', sub:kod || '—',
      actions:[{ label:'Personel listesine dön', icon:'i-arrow-left', href:'app-personel.html' }]
    });
    mount.innerHTML = '<div class="gv-card">' + GV.errorState({
      title:'Personel kaydı bulunamadı',
      desc:'Aradığınız personel kaydı silinmiş ya da adres hatalı olabilir. ' +
           'Doğru kaydı personel listesinden seçebilirsiniz.',
      action:'<a class="btn btn-acc" href="app-personel.html">Personel listesine dön</a>'
    }) + '</div>';
    return;
  }

  /* ---- 2. KAYIT SAHİPLİĞİ KAPISI (brief §6 adım 2 · §22.14) ---------
     `GV.guardRecord` müşteri oturumuna karşı kayıt kapısıdır. Personel
     kaydının `musteri` alanı YOKTUR — yani müşteri oturumu hiçbir personel
     kartını açamaz ve yordam yetkisiz durumunu kendisi basar. `false`
     dönerse ekran bastı, biz çıkarız.

     ⚠️ KAYIT BAZLI DÜZENLEME KAPSAMI YORDAMI YOK (brief §22.1e.2 · borç
     V2-85): "bu kullanıcı BU kaydı düzenleyebilir mi" sorusunun ortak bir
     cevabı yazılmamış. Ekran kendi kuralını UYDURMAZ — `GV.perm.can`
     ile yetinir ve eksiği aşağıda beyan eder. */
  if(!GV.guardRecord({ mount:'#rec', kod:e.kod,
                       eyebrow:'Ekip ve Kaynaklar · Personel', title:e.ad,
                       geriHref:'app-personel.html',
                       geriLabel:'Personel listesine dön' })) return;

  /* ===================================================================
     3. KİŞİSEL VERİ KAPILARI — ALANDAN ÖNCE (brief §20.1)
     =================================================================== */
  var ozlukAcik = GV.hr.ozlukGorebilir(e);          /* SATIR sorusu */
  var maasKapi  = GV.hr.maasKapi(e);                /* { acik, kaynak, neden } */
  var maasAcik  = GV.hr.maasGorebilir(e);           /* SATIR sorusu — öz-erişim açık */
  var kumeAcik  = GV.hr.maasGorebilir();            /* KÜME sorusu — öz-erişimden etkilenmez */
  var canFinans = GV.perm.can('finans');
  var canDuzen  = GV.perm.can('duzenle');
  var canOnay   = GV.perm.can('onay');
  var me        = GV.session.emp || null;
  var kendisi   = !!(me && me === e.kod);

  /* Kapının İKİ YÖNÜ de ölçülür ve ekranda yazılır: bir kapı yalnız
     "bana açık mı" ile anlatılırsa kapsamı görünmez kalır. */
  var tumu       = DB.employees || [];
  var OZLUK_N    = tumu.filter(function(x){ return GV.hr.ozlukGorebilir(x); }).length;
  var MAAS_N     = tumu.filter(function(x){ return GV.hr.maasGorebilir(x); }).length;
  var ozlukKapsam= GV.perm.scope('personel');       /* tum | departman | proje | yok */

  /* ===================================================================
     4. BAĞLAR — hepsi `personel` alanı üzerinden; tarih yakınlığı bağ
        değildir. Her sayı ölçülür, hiçbiri varsayılmaz.
     =================================================================== */
  function byPersonel(list){
    return (list || []).filter(function(x){ return x.personel === e.kod; });
  }

  var perfKayit  = byPersonel(DB.performance);
  /* `katilimci` DİZİDİR — `indexOf` ile süzülür (brief §22.14). */
  var egitimler  = (DB.trainings || []).filter(function(t){
                     return (t.katilimci || []).indexOf(e.kod) !== -1; });
  var surecler   = byPersonel(DB.onboarding);
  var zamanlar   = byPersonel(DB.timelogs);
  var defterler  = byPersonel(DB.timesheets);
  var izinler    = byPersonel(DB.leaves);
  var kapasite   = byPersonel(DB.capacity)[0] || null;
  var astlar     = tumu.filter(function(x){ return x.yonetici === e.kod; });
  var izler      = GV.audit.oku(e.kod, 20) || [];

  /* Açık zimmetler ORTAK yordamdan gelir; ekran ikinci bir süzgeç yazmaz. */
  var acikZimmet = (GV.varlik.zimmetliler(e.kod) || []);
  /* Geçmiş (iade edilmiş) tutanaklar — defterin kendisinden okunur; açık
     zimmet yordamı bilerek yalnız yaşayanları döndürür (brief §20.3). */
  var gecmisZimmet = (DB.assignments || []).filter(function(z){
    return z.personel === e.kod && acikZimmet.indexOf(z) === -1; });

  /* DÜŞEN ZİMMET İDDİASI (K-30) — envanterin bir zamanlar BU KİŞİ için
     söylediği ama defterin doğrulamadığı iddia. `GV.varlik` tarafında
     demirbaş ekseninde bir yordam var (`dusenIddiaSatiri`), KİŞİ ekseninde
     yok; defter `iddiaPersonel` alanını taşıdığı için burada o alandan
     süzülüyor ve SATIRIN KENDİSİ yine ortak yordamdan alınıyor — metin
     ekranda kurulmaz. Eksik imza raporlandı. */
  var iddialar = (DB.assetClaimDrops || []).filter(function(d){
    return d.iddiaPersonel === e.kod; });

  /* Defterin YÜKLÜ OLMAMASI ile defterin BU KİŞİYİ KAPSAMAMASI ayrı
     şeylerdir (L-13); ekran hangisini söylediğini bilsin diye ayrı ölçülür. */
  var zamanDefteri = !!(DB.timelogs && DB.timelogs.length);
  var perfDefteri  = !!(DB.performance && DB.performance.length);
  var egtDefteri   = !!(DB.trainings && DB.trainings.length);
  var kapDefteri   = !!(DB.capacity && DB.capacity.length);
  var surecDefteri = !!(DB.onboarding && DB.onboarding.length);
  var zimmetDefteri= !!(DB.assignments && DB.assignments.length);

  /* Defter kapsamı — "5 kayıt 16 personelin 4'ünü kapsıyor" cümlesinin
     kaynağı. Sayılar ölçülür, yazılmaz. */
  function kapsananKisi(list, alan){
    var s = [];
    (list || []).forEach(function(r){
      var v = r[alan];
      if(v && s.indexOf(v) === -1) s.push(v);
    });
    return s.length;
  }
  var perfKisi = kapsananKisi(DB.performance, 'personel');
  var kapKisi  = kapsananKisi(DB.capacity, 'personel');
  var egtKisi  = (function(){
    var s = [];
    (DB.trainings || []).forEach(function(t){
      (t.katilimci || []).forEach(function(k){ if(s.indexOf(k) === -1) s.push(k); });
    });
    return s.length;
  })();

  /* ===================================================================
     5. ÇİZİM YARDIMCILARI (ekran içi — ortak katmana dokunulmadı)
     =================================================================== */
  function kartBasi(ikon, baslik, sag){
    return '<div class="gc-head"><h3 class="gc-title">' + ico(ikon) + esc(baslik) + '</h3>' +
      (sag ? '<div class="gc-head-acts">' + sag + '</div>' : '') + '</div>';
  }
  function sayacEtiketi(n, birim){
    return '<span class="u-faint u-sm">' + n + ' ' + esc(birim) + '</span>';
  }
  function kart(ikon, baslik, sag, govde, ek){
    return '<section class="gv-card' + (ek ? ' ' + ek : '') + '">' + kartBasi(ikon, baslik, sag) +
      '<div class="gc-body">' + govde + '</div></section>';
  }
  function dolu(v){ return v != null && v !== '' && v !== '—'; }
  /* Maskelenmiş değer bir DEĞER değil bir CEVAPTIR: `••••••` geldiğinde
     hücre maske sınıfıyla basılır ve çıktıya girmez. */
  function maskeli(v){
    return '<span class="cell-mask">' + esc(String(v)) + '</span>';
  }
  function metin(v, bosSebep){
    if(v === MASK) return maskeli(v);
    return dolu(v) ? esc(String(v))
                   : BOS + (bosSebep ? GV.cell.sub(esc(bosSebep)) : '');
  }
  /* Dizi alanı `join(' · ')` ile basılır, tekil sanılmaz (brief §21.11). */
  function dizi(v, bosSebep){
    if(v === MASK) return maskeli(v);
    if(!v || !v.length) return BOS + (bosSebep ? GV.cell.sub(esc(bosSebep)) : '');
    return esc(v.join(' · ')) + GV.cell.sub(v.length + ' kayıt · dizi alanı');
  }
  function tarih(iso, bosSebep){
    if(iso === MASK) return maskeli(iso);
    return iso ? '<span class="cell-date">' + esc(F.date(iso)) + '</span>'
               : BOS + (bosSebep ? GV.cell.sub(esc(bosSebep)) : '');
  }
  function kisi(k, bosSebep){
    return k ? GV.user(k, { sm:true }) : BOS + (bosSebep ? GV.cell.sub(esc(bosSebep)) : '');
  }
  function kodEt(v){ return v ? '<span class="cell-code">' + esc(v) + '</span>' : BOS; }
  function rolAd(k){ return (k && DB.roleName) ? DB.roleName(k) : (k || ''); }
  function empAd(k){ return (k && DB.empName) ? (DB.empName(k) || k) : (k || ''); }
  /* Sözlüğü OLMAYAN alanda `GV.badge` UYDURULMAZ — düz metin basılır ve
     değerin nereden türetildiği yazılır (brief §21.11 son madde · §22.17.12). */
  function sozluksuz(v, kaynakNotu){
    if(!dolu(v)) return BOS;
    return '<span class="u-sm">' + esc(v) + '</span>' +
      (kaynakNotu ? GV.cell.sub(esc(kaynakNotu)) : '');
  }
  function bosKart(ikon, baslik, cumle, sebep){
    return '<section class="gv-card">' + kartBasi(ikon, baslik, sayacEtiketi(0, 'kayıt')) +
      '<div class="gc-body">' + GV.empty({ icon:ikon, title:cumle, desc:sebep }) +
      '</div></section>';
  }

  /* Kıdem — `girisTarihi` ve `DB.today`den türetilir; `new Date()` ile
     "bugün" alınmaz (brief §13.2). `GV.fmt.days(iso)` = `iso − DB.today`,
     yani GELECEK POZİTİF (brief §22.1g.2) — geçmiş bir giriş tarihinde
     dönen sayı negatiftir ve kıdem onun ters işaretidir. */
  function kidemGun(){
    var g = F.days(e.girisTarihi);
    return (g == null || isNaN(g)) ? null : -g;
  }

  /* ===================================================================
     6. KÜNYE ALAN ENVANTERİ — özet sekmesinin sayacı buradan gelir

     Yalnız GENEL (kapısız) alanlar sayılır: özlük ve ücret alanları kapı
     arkasındadır ve doluluklarını saymak, kapının arkasındaki verinin
     VARLIĞINI dolaylı olarak bildirmek olurdu.
     =================================================================== */
  var GENEL_ALAN = ['kod','ad','ini','rol','roller','dep','depAd','pozisyon','yonetici',
                    'girisTarihi','durum','lokasyon','uzmanlik','yetkinlik','teknoloji',
                    'calismaTipi','izinBakiye','doluluk'];
  var doluGenel = GENEL_ALAN.filter(function(a){
    var v = e[a];
    if(Array.isArray(v)) return v.length > 0;
    return v != null && v !== '' && v !== '—';
  }).length;

  /* ===================================================================
     7. SEKME ŞERİDİ — brief §22.14 sözleşmesi birebir, YEDİ sekme
        ⚠️ İKON YOK (§22.13). Sayaçlar ÖLÇÜLDÜ.
     =================================================================== */
  var SEKME = [
    { key:'ozet', label:'Özet', sayac:doluGenel,
      ipucu:GENEL_ALAN.length + ' genel künye alanının ' + doluGenel + ' tanesi dolu · ' +
            'özlük ve ücret blokları kapı arkasında, sayıma girmez' },
    { key:'performans', label:'Performans', sayac:perfKayit.length,
      ipucu:'DB.performance · bu kişiye ait değerlendirme kaydı (defterde toplam ' +
            (DB.performance || []).length + ' kayıt, ' + perfKisi + ' kişiyi kapsıyor)' },
    { key:'egitim', label:'Eğitim', sayac:egitimler.length,
      ipucu:'DB.trainings · katilimci dizisi bu kodu içeren eğitim (defterde toplam ' +
            (DB.trainings || []).length + ' kayıt, ' + egtKisi + ' kişiyi kapsıyor)' },
    { key:'yasamdongusu', label:'Yaşam döngüsü', sayac:surecler.length,
      ipucu:'DB.onboarding · bu kişiye ait giriş/çıkış süreç kaydı · ' +
            'yapılabilir geçişler GV.flow.adimlar ile üretilir' },
    { key:'zaman', label:'Zaman', sayac:zamanlar.length + defterler.length,
      ipucu:zamanlar.length + ' zaman kaydı · ' + defterler.length + ' haftalık defter · ' +
            izinler.length + ' izin talebi' },
    { key:'zimmet', label:'Zimmet', sayac:acikZimmet.length + gecmisZimmet.length + iddialar.length,
      ipucu:acikZimmet.length + ' açık zimmet · ' + gecmisZimmet.length + ' iade edilmiş tutanak · ' +
            iddialar.length + ' düşürülmüş envanter iddiası' },
    { key:'aktivite', label:'Aktivite', sayac:izler.length,
      ipucu:'denetim izi ve sistem günlüğü kaydı' }
  ];

  var sekmeHtml = SEKME.map(function(s){
    return '<button type="button" class="gv-tab" role="tab" data-tab="' + s.key + '" ' +
      'aria-selected="false" title="' + esc(s.ipucu) + '">' + esc(s.label) +
      '<span class="gv-tab-cnt">' + s.sayac + '</span></button>';
  }).join('');

  var panelHtml = SEKME.map(function(s){
    return '<div class="gv-tabpanel u-mt-4" role="tabpanel" data-panel="' + s.key + '" ' +
      'aria-label="' + esc(s.label) + '" hidden></div>';
  }).join('');

  /* ===================================================================
     8. SEKME 1 — ÖZET
     =================================================================== */
  function cizOzet(){
    return '<div class="gv-grid gv-grid-main">' +
      '<div>' + kunyeKarti() + ozlukKarti() + ucretKarti() + '</div>' +
      '<aside>' + durumKarti() + kapiKarti() + ekipKarti() + '</aside>' +
    '</div>';
  }

  /* ---- 8.1 Künye — GENEL alanlar, kapı yok ------------------------- */
  function kunyeKarti(){
    var kd = kidemGun();
    var satirlar = [
      ['Personel kodu', kodEt(e.kod)],
      ['Ad', '<span class="cell-main">' + esc(e.ad) + '</span>' +
             GV.cell.sub('kısaltma: ' + esc(e.ini || '—'))],
      ['Pozisyon', metin(e.pozisyon, 'pozisyon yazılmamış')],
      ['Departman', dolu(e.depAd)
        ? '<span class="cell-main">' + esc(e.depAd) + '</span>' + GV.cell.sub(esc(e.dep || ''))
        : kodEt(e.dep)],
      ['Rol', dolu(e.rol)
        ? '<span class="cell-main">' + esc(rolAd(e.rol)) + '</span>' + GV.cell.sub(esc(e.rol))
        : BOS],
      ['Tüm roller', dizi(e.roller, 'rol dizisi boş')],
      ['Yönetici', kisi(e.yonetici, 'yöneticisi tanımlı değil (organizasyonun tepesi)')],
      ['Lokasyon', metin(e.lokasyon, 'lokasyon yazılmamış')],
      ['Giriş tarihi', tarih(e.girisTarihi, 'giriş tarihi yazılmamış') +
        (kd != null ? GV.cell.sub(F.num(kd) + ' gün kıdem · ' + F.date(DB.today) + ' gününe göre') : '')],
      ['İstihdam ilişkisi', dolu(e.calismaTipi)
        ? sozluksuz(e.calismaTipi, 'DB.workTypes (' + (DB.workTypes || []).length + ' değer)') +
          GV.cell.sub(GV.hr.disKaynak(e.kod)
            ? 'GV.hr.disKaynak: DIŞ KAYNAK — proje maliyetinde personel değil dış kaynak kalemine yazılır'
            : 'GV.hr.disKaynak: kadrolu istihdam')
        : BOS + GV.cell.sub('istihdam ilişkisi yazılmamış')],
      ['Uzmanlık', metin(e.uzmanlik, 'uzmanlık alanı yazılmamış (16 kayıttan 9\'unda dolu)')],
      ['Yetkinlik', dizi(e.yetkinlik, 'yetkinlik kaydı yok')],
      ['Teknoloji', dizi(e.teknoloji, 'teknoloji kaydı yok')],
      ['İzin bakiyesi', e.izinBakiye != null
        ? GV.cell.num(e.izinBakiye) + GV.cell.sub('gün · kayıtta yazılı bakiye')
        : BOS + GV.cell.sub('bakiye alanı boş')],
      ['Doluluk', e.doluluk != null
        ? GV.cell.oran(e.doluluk, 90) +
          GV.cell.sub('⚠️ bir SAYAÇ DEĞİL — kayıtta yazılı plandır (brief §22.14). ' +
            'Zaman defterinden türetilmiş bir gerçekleşme oranı değildir; ' +
            'kapasite karşılaştırması Zaman sekmesinde.')
        : BOS + GV.cell.sub('doluluk planı yazılmamış')]
    ];
    return kart('i-user', 'Künye', sayacEtiketi(doluGenel + '/' + GENEL_ALAN.length, 'genel alan'),
      GV.dl(satirlar, { skipEmpty:false }) +
      '<p class="u-sm u-faint u-mt-4">Bu bloktaki alanların hiçbiri kapı arkasında değildir ' +
      '(brief §20.1 · genel sınıf). Özlük ve ücret alanları ayrı bloklarda ve ayrı kapılardadır.</p>');
  }

  /* ---- 8.2 Özlük — `GV.hr.ozlukGorebilir` kapısı ------------------- */
  function ozlukKarti(){
    /* Değerler DOĞRUDAN kayıttan değil `GV.hr.ozluk(e, alan)`dan okunur:
       kapı TEK YERDE kalsın (L-40) ve yetkisizde `••••••` dönsün. */
    function oz(alan){ return GV.hr.ozluk(e, alan); }
    /* Kayıtta kan grubu / acil kişi yerine "—" yazılı olabiliyor: bu bir
       DEĞER değil, "bilgi verilmemiş" demektir; öyle söylenir. */
    function ozMetin(alan, bosSebep){
      var v = oz(alan);
      if(v === MASK) return maskeli(v);
      return dolu(v) ? esc(String(v)) : BOS + GV.cell.sub(esc(bosSebep));
    }
    var sert = oz('sertifika');
    var satirlar = [
      ['Doğum tarihi', (function(){
        var v = oz('dogum');
        return v === MASK ? maskeli(v) : tarih(v, 'doğum tarihi yazılmamış');
      })()],
      ['Kan grubu', ozMetin('kanGrubu', 'kan grubu bildirilmemiş')],
      ['Acil durumda aranacak', ozMetin('acilKisi', 'acil durum kişisi yazılmamış')],
      ['Telefon', ozMetin('tel', 'telefon yazılmamış')],
      ['E-posta', ozMetin('eposta', 'e-posta yazılmamış')],
      ['Eğitim', ozMetin('egitim', 'eğitim kaydı yok')],
      ['Sertifika', sert === MASK ? maskeli(sert) : dizi(sert, 'sertifika kaydı yok')],
      ['Sözleşme türü', ozMetin('sozlesme', 'sözleşme türü yazılmamış') +
        GV.cell.sub('sözlüğü YOK (contractTypes) — değer kayıttan okunur')],
      ['Mesai türü', ozMetin('calismaTuru', 'mesai türü yazılmamış') +
        GV.cell.sub('sözlüğü YOK (calismaTuru) — değer kayıttan okunur')]
    ];
    var not = ozlukAcik
      ? 'Kapı AÇIK — kaynak: ' + (kendisi ? 'kendi kaydınız (öz-erişim)' :
          'personel veri kapsamınız "' + esc(ozlukKapsam) + '"') + '.'
      : 'Kapı KAPALI. Alanlar boş değil, GÖRÜLEMİYOR — bu yüzden ' + MASK +
        ' basıldı, boş bırakılmadı (UID-11). Personel veri kapsamınız "' +
        esc(ozlukKapsam) + '" ve bu kayıt sizin değil.';
    return kart('i-shield', 'Özlük ve sağlık',
      ozlukAcik ? GV.badge('Kapı açık','is-ok') : GV.badge('Maskeli','is-neutral'),
      GV.dl(satirlar, { skipEmpty:false }) +
      '<p class="u-sm u-muted u-mt-4">' + not + ' Kapı yordamı <b>GV.hr.ozlukGorebilir(e)</b>; ' +
      'değerler <b>GV.hr.ozluk(e, alan)</b> üzerinden okundu. ' +
      'Bugünkü ölçüm: ' + tumu.length + ' personel kaydının <b>' + OZLUK_N +
      '</b> tanesinde bu oturum özlüğü görebiliyor.</p>');
  }

  /* ---- 8.3 Ücret — `GV.hr.maasKapi` kapısı, XOR beyanı ------------- */
  function ucretKarti(){
    /* XOR SÖZLEŞMESİ (brief §22.8) — ÖLÇÜM defterin tamamı üzerindedir ve
       tek bir kaydın ücretini açığa vurmaz, o yüzden kapıdan bağımsız
       basılır: 16 personelin 15'i `maas`, 1'i `saatlikUcret` ekseninde;
       ikisi birlikte dolu olan kayıt YOKTUR. */
    var aylikN = tumu.filter(function(x){ return !(x.saatlikUcret > 0) && x.maas > 0; }).length;
    var saatN  = tumu.filter(function(x){ return x.saatlikUcret > 0; }).length;
    var ikiN   = tumu.filter(function(x){ return x.saatlikUcret > 0 && x.maas > 0; }).length;
    var xor = '<p class="u-sm u-muted">XOR sözleşmesi (ölçüldü): ' + tumu.length +
      ' kaydın <b>' + aylikN + '</b> tanesi aylık maaş, <b>' + saatN +
      '</b> tanesi saatlik ücret ekseninde; ikisi birlikte dolu olan kayıt sayısı <b>' +
      ikiN + '</b>. İki eksen aynı kayıtta asla birlikte dolmaz — ' +
      '<b>GV.hr.icMaliyet</b> bu varsayımla çalışır.</p>';

    if(!maasAcik){
      /* Kapı kapalı: alan BASILMAZ ama boş da bırakılmaz — maskelenmiş
         değer ve kapının SEBEBİ basılır (sebep ortak yordamdan gelir). */
      var satirlarK = [
        ['Aylık brüt maaş', maskeli(GV.hr.maas(e, 'maas'))],
        ['Saatlik ücret', maskeli(GV.hr.maas(e, 'saatlikUcret'))],
        ['Şirkete saatlik iç maliyet', maskeli(MASK) +
          GV.cell.sub('GV.hr.icMaliyet çıktısı maaş türevidir ve formülü ham tutarı taşır — kapı arkasındadır')]
      ];
      return kart('i-wallet', 'Ücret ve iç maliyet', GV.badge('Maskeli','is-neutral'),
        GV.dl(satirlarK, { skipEmpty:false }) +
        '<p class="u-sm u-muted u-mt-4">' + esc(maasKapi.neden || 'Kapı kapalı.') +
        ' Kapı kaynağı: <b>' + esc(maasKapi.kaynak || '—') + '</b>. ' +
        'Değer <b>0 değil</b>, ' + MASK + ' — ücret var ve görülemiyor (UID-11).</p>' + xor +
        '<p class="u-sm u-faint u-mt-4">Küme sorusu (<b>GV.hr.maasGorebilir()</b> argümansız): ' +
        (kumeAcik ? 'AÇIK' : 'KAPALI') + '. Bugünkü ölçüm: ' + tumu.length +
        ' kaydın <b>' + MAAS_N + '</b> tanesinde bu oturum ücreti görebiliyor.</p>');
    }

    var maas = GV.hr.maas(e, 'maas');
    var saat = GV.hr.maas(e, 'saatlikUcret');
    var eksen = (e.saatlikUcret > 0) ? 'saatlik' : 'aylık';
    var im = GV.hr.icMaliyet(e.kod);      /* tarih verilmez → BUGÜNKÜ oran */

    var satirlar = [
      ['Ücret ekseni', sozluksuz(eksen === 'saatlik' ? 'Saatlik ücret' : 'Aylık brüt maaş',
        'eksen kayıttan türetildi: saatlikUcret > 0 → saatlik, aksi hâlde aylık')],
      ['Aylık brüt maaş', eksen === 'aylik'
        ? GV.cell.mny(maas)
        : (maas > 0 ? GV.cell.mny(maas) : BOS +
            GV.cell.sub('kayıt saatlik eksende · aylık maaş yazılmaz (XOR)'))],
      ['Saatlik ücret', saat > 0
        ? GV.cell.mny(saat) + GV.cell.sub('sözleşmeli saat ücreti · iç maliyet ile aynı şey değildir')
        : BOS + GV.cell.sub('kayıt aylık maaş ekseninde · saatlik ücret alanı hiç yazılmamış')]
    ];

    /* İÇ MALİYET — `guvenilir` bayrağı ve `formul` BASILIR (brief §22.14).
       Tek bir "iç maliyet: X ₺/saat" satırı basıp güvenilirliği yutmak
       yasaktır. */
    if(im){
      satirlar.push(['Şirkete saatlik iç maliyet',
        GV.cell.mny(im.saat) + GV.cell.sub('kaynak: ' + esc(im.kaynak) +
          ' · güvenilir: ' + (im.guvenilir ? 'evet' : 'HAYIR') +
          (im.donemsiz ? ' (dönemsiz)' : '') +
          (im.donem ? ' · dönem: ' + esc(im.donem) : '') +
          /* ⚠️ Gerekçe artık YORDAMDAN okunuyor (V2-92 · ADR-R2-45). Ekran
             kendi cümlesini kurarsa kural iki yerde yaşar ve yordam değişince
             sessizce ayrışır (L-40). Bayrak da yordamdan: tarihsiz çağrı
             artık `guvenilir:false · donemsiz:true` döner. */
          (im.neden ? ' · ' + esc(im.neden) : '') +
          ' Yordama tarih verilmedi; bu BUGÜNKÜ orandır (' +
          esc(F.date(DB.today)) + ').')]);
      satirlar.push(['Formül', '<span class="u-sm">' + esc(im.formul) + '</span>' +
        GV.cell.sub('GV.hr.icMaliyet · şirket katsayısı ' +
          esc(String((DB.company || {}).isverenMaliyetKatsayisi)) + ' ve aylık ' +
          esc(String((DB.company || {}).aylikCalismaSaati)) +
          ' saat DB.company kaydından okundu; ekran ikinci bir maliyet formülü kurmaz')]);
    } else {
      satirlar.push(['Şirkete saatlik iç maliyet', BOS +
        GV.cell.sub('GV.hr.icMaliyet null döndü — iki ücret ekseninin ikisi de boş, ' +
                    'maliyet UYDURULMAZ (0 basılmaz)')]);
    }

    /* MAAŞ GEÇMİŞİ TABLOSU BASILMAZ (brief §22.14 · §22.4 · V2-44 eki). */
    var gozlem = (DB.salaryHistory || []).filter(function(h){ return h.personel === e.kod; });
    var toplamGozlem = (DB.salaryHistory || []).length;
    var bugunN = (DB.salaryHistory || []).filter(function(h){ return h.baslangic === DB.today; }).length;
    var bitisN = (DB.salaryHistory || []).filter(function(h){ return h.bitis; }).length;
    var gecmisNot = '<p class="u-sm u-muted u-mt-4">Maaş defterinde bu kişi için <b>' +
      gozlem.length + ' gözlem kaydı</b> var' +
      (gozlem.length ? ' (' + esc(F.date(gozlem[0].baslangic)) + ', kaynak: ' +
        esc(gozlem[0].kaynak || '—') + ')' : '') +
      '; geçmiş dönem kaydı yok, o yüzden bir değişim çizelgesi türetilemiyor. ' +
      'Ölçüldü: <code>DB.salaryHistory</code> ' + toplamGozlem + ' kaydın <b>' + bugunN +
      '</b> tanesinde <code>baslangic = DB.today</code> ve <b>' + bitisN +
      '</b> tanesinde <code>bitis</code> dolu. Defterde tek bir AN vardır, bir zaman ' +
      'serisi yoktur — bu yüzden <b>maaş geçmişi tablosu basılmaz</b>. ' +
      'Ekran bu deftere satır da YAZMAZ (brief §22.17.11).</p>';

    return kart('i-wallet', 'Ücret ve iç maliyet',
      GV.badge('Kapı açık','is-ok') + ' <span class="u-faint u-xs">' +
      esc(maasKapi.kaynak === 'ozErisim' ? 'öz-erişim' : 'permMatrix.maas') + '</span>',
      GV.dl(satirlar, { skipEmpty:false }) + xor + gecmisNot +
      '<p class="u-sm u-faint u-mt-4">Küme sorusu (<b>GV.hr.maasGorebilir()</b> argümansız): ' +
      (kumeAcik ? 'AÇIK' : 'KAPALI') + ' — kendi kaydını görmek başkalarının toplamını açmaz ' +
      '(brief §22.1). Bugünkü ölçüm: ' + tumu.length + ' kaydın <b>' + MAAS_N +
      '</b> tanesinde bu oturum ücreti görebiliyor.</p>');
  }

      '<b>GV.flow.gec(\'employee\', …)</b> ve düğmeler Yaşam döngüsü sekmesinde ' +
      '<b>GV.flow.adimlar</b> ne veriyorsa odur.</p>');

  function nedenAd(k){
    var r = (DB.reasonCodes || []).filter(function(x){ return x.kod === k; })[0];
    return r ? r.ad : (k || '');
