<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Yeni Destek Talebi — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-sec="operasyon" data-screen="destek">

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>

<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script src="assets/js/quicknote.js"></script>
<script>
/* =====================================================================
   DESTEK TALEBİ FORMU — ekran brief §5 (CreateEditPage deseni) · §18.6 ·
   §19.0 · §19.2 · §19.6

   DESEN: `GV.pageHead` + `GV.form` + `GV.afterSave`. Bu depoda
   `CreateEditPage` ADINDA BİR BİLEŞEN YOKTUR (brief §5); "oluştur/düzenle
   sayfası" bu üç çağrının desenidir ve burada birebir uygulanır.

   ⚠️ KAYIT YAZMA TEK KAPI: `GV.destek.olustur(v)` (brief §19.2).
   `DB.tickets.push(...)` bu ekranda YOK. Kod üretimi, başlangıç durumu,
   SLA taahhüdünün politikadan okunması ve denetim izi ORTAK YORDAMDADIR.

   ⚠️ SLA — bu ekranın en kolay yanlış yapılacak yeri.
   `DB.slaPolicies[].ilkYanit` ve `.cozum` DAKİKADIR (60 · 120 · 240 · 480 ·
   1440 · 2880 · 4320). `DB.tickets[].sla` ise politikanın `etiket`
   DİZESİDİR ('4 saat' · '8 saat' · '2 gün' · '3 gün'). İkisi ayrı birimdir.
   Bu yüzden `sla` FORMA KONMADI: alanı kullanıcı yazmaz,
   `GV.destek.olustur` politikadan kendisi okur. Form yalnız kategori ve
   önceliği sorar; sağ panel hangi politikanın düşeceğini CANLI gösterir.

   ÖLÇÜLDÜ (bu ekranda uydurma yok): 7 politikanın 7'sinde `etiket`,
   `cozum` dakikasının insan okunur karşılığıdır — `ilkYanit`ın değil.
   SLA-01 cozum 240 dk = '4 saat' · SLA-04 cozum 4320 dk = '3 gün' ·
   SLA-06 cozum 2880 dk = '2 gün'. `ilkYanit` ayrı ve daha kısa bir
   taahhüttür (60 · 120 · 240 · 480 · 1440 dk) ve kayda YAZILMAZ.
   Sağ panel üçünü de ayrı satırda, birimiyle gösterir.

   ⚠️ Üç politika `oncelik:'Tümü'` jokeri taşır (SLA-05 · 06 · 07).
   Eşleştirmeyi `GV.destek.slaPolitikasi` yapar; bu ekran İKİNCİ BİR
   EŞLEŞTİRME KURMAZ.

   ⚠️ `slaDurum` yeni kayıtta `null` kalır (BE-D1). Sayaç canlı çalışmaz;
   'Zamanında' yazmak ölçülmemişi ölçülmüş göstermek olurdu (L-13). Ekran
   bunu "henüz ölçülmedi" diye söyler, boş bırakmaz ve sıfır yazmaz.

   DURUM ALANI FORMDA YOKTUR. Yeni talep `DB.ticketStatuses[0]` durumunda
   doğar (sabit dize yazılmaz, sözlükten okunur) ve durum yalnız
   `GV.flow.gec('ticket', …)` ile değişir — düğmeleri talep detayında.
   Düzenleme kipinde durum sağ panelde SALT OKUNUR bilgi olarak durur.

   VERİ: `org.js` · `crm.js` · `work.js` · `misc.js` · `ops.js` ·
   `lifecycle.js`. `hr.js` GEREKMEZ — bu ekran `DB.timelogs` okumaz
   (brief §19.0). `firsat.js` ve `odeme.js` yüklenmez.
   ===================================================================== */
document.addEventListener('gv:ready', function(){
  var F     = GV.fmt;
  var esc   = GV.esc;
  var ico   = GV.ico;
  var mount = document.getElementById('rec');
  if(!mount) return;

  var GERI = 'app-destek.html';

  var q   = new URLSearchParams(location.search);
  var kod = q.get('id');
  var rec = kod ? GV.destek.kayit(kod) : null;

  /* ---- Kayıt yok durumu (brief §10) -------------------------------- */
  if(kod && !rec){
    GV.pageHead({
      eyebrow:'Operasyon · Destek', title:'Kayıt bulunamadı', sub:kod,
      actions:[{ label:'Destek listesine dön', icon:'i-arrow-left', href:GERI }]
    });
    mount.innerHTML = GV.errorState({
      title:kod + ' bulunamadı',
      desc:'Bu kod hiçbir destek talebiyle eşleşmedi. Adres çubuğundaki kaydı kontrol edin ' +
           'ya da destek listesinden talebi seçin.',
      action:'<a class="btn btn-acc" href="' + GERI + '">Destek listesine dön</a>' });
    return;
  }

  /* ---- Yetki kapısı -------------------------------------------------
     `GV.destek.olustur` kendi içinde de `ekle` kapısını tutuyor; buradaki
     kapı onu tekrarlamak için değil, YETKİSİZ KULLANICIYA DOLDURULAMAYACAK
     BİR FORM AÇMAMAK için var. İki kapı da aynı matris anahtarını okur. */
  var izinli = rec ? GV.perm.can('duzenle') : GV.perm.can('ekle');
  if(!izinli){
    GV.pageHead({
      eyebrow:'Operasyon · Destek',
      title:rec ? rec.kod : 'Yeni Destek Talebi',
      sub:'Bu ekran için yetkiniz yok',
      actions:[{ label:'Destek listesine dön', icon:'i-arrow-left', href:GERI }]
    });
    mount.innerHTML = GV.empty({
      icon:'i-lock',
      title:rec ? 'Talebi düzenleme yetkiniz yok' : 'Destek talebi açma yetkiniz yok',
      desc:'Rolünüz (' + GV.perm.role() + ') bu işlem için yetkili değil. ' +
           'Talepleri görüntülemeye devam edebilirsiniz.',
      action:'<a class="btn btn-line" href="' + GERI + '">Destek listesine dön</a>' });
    return;
  }

  /* =================================================================
     1. SÖZLÜKLER — hepsi veriden, hiçbiri elle
     ================================================================= */
  function benzersiz(list){
    return (list || []).filter(function(v, i, s){
      return v != null && v !== '' && v !== '—' && s.indexOf(v) === i; });
  }
  function bosNull(x){
    var s = (x == null) ? '' : String(x).trim();
    return s === '' ? null : s;
  }

  var TALEPLER  = DB.tickets || [];
  var DURUMLAR  = DB.ticketStatuses || [];
  /* Yeni talebin doğum durumu — SABİT DİZE YAZILMAZ, sözlüğün ilk değeri.
     `GV.destek.olustur` da aynı yerden okur; ekran yalnız GÖSTERİR. */
  var ILK_DURUM = DURUMLAR[0] || null;

  /* KATEGORİ SÖZLÜĞÜ AYRI BİR KOLEKSİYON DEĞİLDİR (ölçüldü: `DB.ticketCategories`
     diye bir şey yok). İki yazılı kaynaktan TÜRETİLİR ve hangisinden geldiği
     ekranda yazılır:
       (a) `DB.slaPolicies[].kategori` — SLA matrisinin kategori ekseni,
       (b) mevcut taleplerin `kategori` alanı.
     Ölçüm: ikisi de aynı dört değeri veriyor, (b)'de fazladan değer yok. */
  var KAT_POLITIKA = benzersiz((DB.slaPolicies || []).map(function(p){ return p.kategori; }));
  var KAT_KAYIT    = benzersiz(TALEPLER.map(function(t){ return t.kategori; }));
  var KAT_EKSTRA   = KAT_KAYIT.filter(function(k){ return KAT_POLITIKA.indexOf(k) === -1; });
  var KATEGORILER  = KAT_POLITIKA.concat(KAT_EKSTRA);

  var ONCELIKLER = DB.priorities || [];   /* brief §18.4 — 4 değer */
  /* ETKİ: brief bir etki SÖZLÜĞÜ adı bildirmiyor, o yüzden ekran bir sözlük
     adı UYDURMAZ — seçenekler mevcut taleplerin `etki` alanından türetilir
     (`app-destek.html`in filtre seçeneklerini üretme biçimiyle aynı) ve
     nereden geldiği "Sözlük kaynakları" kartında yazılıdır. */
  var ETKILER    = benzersiz(TALEPLER.map(function(t){ return t.etki; }));
  var KANALLAR   = DB.ticketChannels || [];

  /* ⚠️ PAKET TİPİ SÖZLÜĞÜ İLE KAYITLAR ÇELİŞİYOR — ölçüm, yorum değil.
     `DB.supportPackageTypes` iki değer taşıyor: 'Standart Bakım' ·
     'Kurumsal Bakım'. Mevcut 7 talebin `bakimPaketi` alanında ise KISA
     biçim yazılı: 'Standart' (2) · 'Kurumsal' (3) · '—' (2, yani paket yok).
     Seçenekler SÖZLÜKTEN üretilir (tek doğru kaynak L-40); kısa biçimler
     seçenek olarak basılmaz çünkü sözlükte yoklar. Çelişki gizlenmez:
     aşağıdaki alanın ipucunda ve "Sözlük kaynakları" kartında yazılıdır ve
     ortak katman sahibine raporlandı. */
  var PAKET_TIPLERI  = DB.supportPackageTypes || [];
  var PAKET_KAYITTA  = benzersiz(TALEPLER.map(function(t){ return t.bakimPaketi; }));
  var PAKET_CELISKI  = PAKET_KAYITTA.filter(function(v){ return PAKET_TIPLERI.indexOf(v) === -1; });

  var HESAPLAR = (DB.accounts || []);
  var PROJELER = (DB.projects || []);
  var PERSONEL = (DB.employees || []).filter(function(e){ return e.aktif !== false; });
  var KONTAKLAR = (DB.contacts || []).filter(function(c){ return c.aktif !== false; });

  /* ⚠️ DÜZENLEME KİPİNDE SESSİZ SİLME OLMAZ — ölçülerek yakalandı.
     Bir `<select>`in seçenek listesinde kayıttaki değer YOKSA alan boş
     açılır ve kaydetme, kullanıcının hiç dokunmadığı o alanı `null`a
     düşürür. Ölçüm: DST-2026-118 düzenlenirken `bakimPaketi:'Standart'`
     siliniyordu, çünkü sözlük ('Standart Bakım' · 'Kurumsal Bakım') o
     kısa biçimi taşımıyor. Sözlüğü tek kaynak saymak doğru; ama sözlükle
     çelişen bir kaydı sessizce boşaltmak veri kaybıdır. Kayıttaki değer
     listeye KAYNAĞI YAZILARAK eklenir — yeni kayıtta eklenmez, yani
     çelişki yayılmaz, yalnız korunur. */
  function korunanSecenek(secenekler, alan, etiket){
    if(!rec) return secenekler;
    var v = rec[alan];
    if(v == null || v === '') return secenekler;
    var mevcut = secenekler.some(function(o){
      return String(typeof o === 'string' ? o : o.value) === String(v); });
    return mevcut ? secenekler : secenekler.concat([{ value:v, label:v + ' · ' + etiket }]);
  }

  /* ---- Bağ okuma yüzeyleri ---------------------------------------- */
  function hesapKaydi(k){ return k ? GV.lifecycle.hesap(k) : null; }
  function hesapAd(k){
    var h = hesapKaydi(k);
    return h ? (h.kisa || h.unvan) : (k || null);
  }
  function hesapUnvan(k){
    var h = hesapKaydi(k);
    return h ? h.unvan : (k || null);
  }
  function projeKaydi(k){
    return k ? PROJELER.filter(function(p){ return p.kod === k; })[0] || null : null;
  }
  function kontakKaydi(k){
    return k ? KONTAKLAR.filter(function(c){ return c.kod === k; })[0] || null : null;
  }
  /* Dakika alanları HAM tutulur; saat karşılığı yalnız okunurluk içindir —
     yeni bir SLA aritmetiği DEĞİLDİR, aynı sayının ikinci yazımıdır.
     Aynı biçim `app-destek-detay.html:155`te de yazılı; ortak katmanda bir
     `GV.fmt.dakika` yuvası yok ve bu eksik raporlandı. */
  function dakika(n){
    if(n == null) return null;
    return F.num(n) + ' dk' + (n >= 60 ? ' · ' + F.num(Math.round(n / 6) / 10, 1) + ' saat' : '');
  }
  function not(metin){ return '<span class="u-faint u-xs">' + esc(metin) + '</span>'; }
  function bos(sebep){
    return '<span class="u-faint">—</span>' + (sebep ? ' ' + not(sebep) : '');
  }

  /* =================================================================
     2. ÖN DOLGU — `?musteri=` · `?proje=` (brief §19.0)
     -----------------------------------------------------------------
     Parametre ÇÖZÜLEMİYORSA sessizce yutulmaz: kullanıcı hangi bağlamdan
     geldiğini biliyor, ekran onu neden kuramadığını söylemek zorunda.
     `?proje=` verilip `?musteri=` verilmediyse müşteri projenin YAZILI
     `musteri` alanından okunur — tarih yakınlığı değil, yazılı bir alandan
     türetme olduğu için bağ sayılır (brief §13.1).
     ================================================================= */
  var onDolguNotlari = [];
  var onMusteri = null, onProje = null;

  if(!rec){
    var pMus = bosNull(q.get('musteri'));
    var pPrj = bosNull(q.get('proje'));

    if(pMus){
      if(hesapKaydi(pMus)) onMusteri = pMus;
      else onDolguNotlari.push({ tone:'warn',
        title:'Adresteki müşteri kodu çözülemedi',
        text:'“' + pMus + '” hiçbir hesap kaydıyla eşleşmedi; müşteri alanı boş açıldı. ' +
             'Defterde ' + HESAPLAR.length + ' hesap var.' });
    }
    if(pPrj){
      var pk = projeKaydi(pPrj);
      if(!pk){
        onDolguNotlari.push({ tone:'warn',
          title:'Adresteki proje kodu çözülemedi',
          text:'“' + pPrj + '” hiçbir proje kaydıyla eşleşmedi; proje alanı boş açıldı. ' +
               'Defterde ' + PROJELER.length + ' proje var.' });
      }else{
        onProje = pPrj;
        if(!onMusteri && pk.musteri){
          onMusteri = pk.musteri;
          onDolguNotlari.push({ tone:'info',
            title:'Müşteri projeden türetildi',
            text:'Adreste müşteri kodu yoktu; ' + pk.kod + ' projesinin yazılı `musteri` alanından ' +
                 (hesapUnvan(pk.musteri) || pk.musteri) + ' okundu. Değiştirebilirsiniz.' });
        }else if(onMusteri && pk.musteri !== onMusteri){
          onDolguNotlari.push({ tone:'warn',
            title:'Ön dolgudaki proje ile müşteri eşleşmiyor',
            text:pk.kod + ' projesi ' + (hesapUnvan(pk.musteri) || pk.musteri) + ' hesabına bağlı, ' +
                 'adresteki müşteri ise ' + (hesapUnvan(onMusteri) || onMusteri) + '. İkisi de dolduruldu; ' +
                 'kaydetmeden önce birini düzeltin.' });
        }
      }
    }
  }

  /* Müşteri oturumu kendi hesabı dışına talep açamaz: `GV.session.musteri`
     doluysa alan kilitlenir (brief §2.2). Bu bir kapı değil, alanın
     KAYNAĞIDIR — gerçek kapı sunucuda olmalıdır (backend payı). */
  var oturumMusteri = (GV.session && GV.session.musteri) || null;
  var oturumKontak  = (GV.session && GV.session.kontak) || null;

  /* Form taslağı — kaydın kendisi değil, bileşenin okuyacağı başlangıç
     değerleri. `durum`, `sla` ve `slaDurum` BİLEREK YOK: üçü de bu formun
     yazmadığı alanlardır. */
  var ALANLAR = ['baslik','proje','kategori','oncelik','etki','sorumlu',
                 'acan','kanal','aciklama','bakimPaketi'];
  var formKayit = {};
  if(rec){
    ALANLAR.forEach(function(k){ formKayit[k] = rec[k] == null ? '' : rec[k]; });
    formKayit.musteri = rec.musteri || '';
    formKayit.ucretli = rec.ucretli === true;
  }else{
    formKayit.musteri = oturumMusteri || onMusteri || '';
    formKayit.proje   = onProje || '';
    formKayit.acan    = oturumKontak || '';
    formKayit.ucretli = false;
  }

  /* =================================================================
     3. SAYFA BAŞLIĞI — form bileşeninden ÖNCE (brief §2.4)
     ================================================================= */
  GV.pageHead({
    eyebrow:'Operasyon · Destek',
    title:rec ? rec.kod : 'Yeni Destek Talebi',
    sub:rec
      ? esc(rec.baslik) + ' · durum bu ekrandan değişmez'
      : 'Talep ' + (ILK_DURUM ? '“' + ILK_DURUM + '”' : 'sözlüğün ilk') + ' durumunda doğar · ' +
        'SLA taahhüdü politikadan okunur',
    actions:[
      { label:'Vazgeç', icon:'i-arrow-left', href:GERI },
      { label:rec ? 'Kaydet' : 'Talebi Aç', icon:'i-check', cls:'btn-acc',
        run:function(){ kaydet(); } }
    ]
  });

  mount.innerHTML =
    '<div id="dstNot" class="u-mb-8"></div>' +
    '<div id="dstForm"></div>' +
    '<div id="dstKaynak"></div>' +
    '<div id="dstBackend"></div>';

  /* ---- Ön dolgu ve sözlük uyarıları ------------------------------- */
  var acilisNotlari = onDolguNotlari.slice();
  if(!DURUMLAR.length){
    acilisNotlari.unshift({ tone:'danger',
      title:'Destek durum sözlüğü yüklenemedi',
      text:'Yeni talebin doğum durumu DB.ticketStatuses[0] üzerinden okunur. Sözlük ' +
           'olmadan ortak yordam kayıt açmayı reddeder; form doldurulabilir ama kaydedilemez.' });
  }
  if(!KATEGORILER.length){
    acilisNotlari.unshift({ tone:'warn',
      title:'Kategori değeri türetilemedi',
      text:'Kategori sözlüğü ayrı bir koleksiyon değildir; DB.slaPolicies kategori ekseninden ' +
           've mevcut taleplerin kategori alanından türetilir. İkisi de boş olduğu için ' +
           'seçenek üretilemedi ve SLA politikası eşleşemez.' });
  }
  document.getElementById('dstNot').innerHTML = acilisNotlari.map(function(n){
    return GV.notice({ tone:n.tone,
      icon:n.tone === 'info' ? 'i-info' : n.tone === 'danger' ? 'i-alert-circle' : 'i-alert',
      title:n.title, text:n.text });
  }).join('');

  /* =================================================================
     4. FORM
     ================================================================= */
  var form = GV.form({
    mount:'#dstForm',
    id:'destekForm',
    record:formKayit,
    tabs:[
      { key:'talep',        label:'Talep',                icon:'i-support' },
      { key:'yonlendirme',  label:'Yönlendirme ve bakım', icon:'i-user-check' }
    ],
    aside:function(veri){ return yanPanel(veri); },
    sections:[
      { title:'Talep', icon:'i-support', tab:'talep',
        desc:'Zorunlu iki alan var: başlık ve müşteri. Ortak yordam ' +
             '(GV.destek.olustur) ikisi olmadan kayıt açmaz. Proje ZORUNLU DEĞİLDİR — ' +
             'ölçüldü: yayındaki 7 talebin 6’sı bir projeye bağlı, DST-2026-117 hiçbir ' +
             'projeye bağlı değil ve bu bir eksiklik değil, bir ölçümdür.',
        fields:[
          { key:'baslik', label:'Talep başlığı', type:'text', cols:12, required:true,
            placeholder:'Örn. Randevu formunda tarih seçici mobilde açılmıyor',
            hint:'Tek cümlede sorunu söyleyin; ayrıntı açıklama alanına yazılır.' },

          { key:'musteri', label:'Müşteri', type:'select', cols:6, required:true,
            readonly:!!rec || !!oturumMusteri,
            options:HESAPLAR.map(function(h){
              return { value:h.kod, label:h.unvan + ' · ' + h.kod }; }),
            hint:rec
              ? 'Talebin müşterisi bu ekrandan değiştirilmez: SLA politikası, bakım paketi ve ' +
                'satır kapsamı bu alana bağlıdır. Yanlış hesapta açılmış bir talep taşınmaz, ' +
                'kapatılıp doğru hesapta yeniden açılır.'
              : oturumMusteri
                ? 'Müşteri oturumundasınız; talep kendi hesabınıza açılır.'
                : HESAPLAR.length + ' hesap listeleniyor. 8 hesap aday kaydından türetildi — ' +
                  'onlarda yetkili, proje ve bakım paketi kaydı yoktur.' },

          { key:'proje', label:'İlgili proje', type:'select', cols:6,
            options:korunanSecenek(PROJELER.map(function(p){
              return { value:p.kod, label:p.ad + ' · ' + (hesapAd(p.musteri) || p.musteri || '—') };
            }), 'proje', 'kayıtta yazılı; proje defterinde bulunamadı'),
            hint:'Zorunlu değil. Seçilen proje talebin müşterisine ait olmalıdır; ' +
                 'defterdeki 14 projenin 14’ünde müşteri alanı yazılı.',
            validate:function(v, veri){
              if(!v) return '';
              var p = projeKaydi(v);
              if(!p) return 'Bu proje kodu defterde bulunamadı.';
              if(veri.musteri && p.musteri && p.musteri !== veri.musteri)
                return 'Seçilen proje ' + (hesapUnvan(p.musteri) || p.musteri) +
                       ' hesabına bağlı; talebin müşterisiyle eşleşmiyor.';
              return '';
            } },

          { key:'aciklama', label:'Açıklama', type:'textarea', cols:12, rows:4,
            placeholder:'Ne oldu, hangi ekranda, nasıl tekrarlanıyor?',
            hint:'Boş bırakılabilir. Talebe DOSYA/EKRAN GÖRÜNTÜSÜ eklemek bu formda YOKTUR: ' +

  /* =================================================================
     5. SAĞ PANEL — SLA politikası CANLI, ikinci eşleştirme YOK
     ================================================================= */
  function taslak(v){
    /* `GV.destek.paketOf` kod da kayıt da kabul eder (`Destek.kayit`
       nesneyi olduğu gibi döndürür), yani henüz kaydedilmemiş taslak da
       ölçülebilir. İkinci bir paket eşleştirme kuralı yazılmadı. */
    return { kod:rec ? rec.kod : null,
             musteri:bosNull(v.musteri),
             proje:bosNull(v.proje),
             bakimPaketi:bosNull(v.bakimPaketi),
             ucretli:v.ucretli === true };
  }

  function kunyeKarti(v){
    var pKayit = projeKaydi(bosNull(v.proje));
    var cKayit = kontakKaydi(bosNull(v.acan));
    return '<section class="gv-card">' +
      '<div class="gc-head"><h3 class="gc-title">' + ico('i-support') + 'Kayıt özeti</h3>' +
        (rec ? '<span class="gc-meta">' + esc(rec.kod) + '</span>' : '') + '</div>' +
      '<div class="gc-body">' + GV.dl([
        ['Kayıt no', rec
          ? '<span class="cell-code">' + esc(rec.kod) + '</span>'
          : bos('kaydederken ortak yordam defterden üretir')],
        /* DURUM SALT OKUNUR BİLGİDİR — form alanı değildir. Durum yalnız
           GV.flow.gec('ticket', …) ile değişir ve düğmeleri talep detayında. */
        ['Durum', rec
          ? GV.badge(rec.durum) + not('bu ekrandan değişmez; talep detayındaki geçiş düğmeleri yürütür')
          : (ILK_DURUM
              ? GV.badge(ILK_DURUM) + not('DB.ticketStatuses[0] — yeni talep bu durumda doğar')
              : bos('durum sözlüğü yüklenmedi'))],
        ['Müşteri', bosNull(v.musteri)
          ? esc(hesapUnvan(v.musteri)) + '<span class="cell-sub">' + esc(v.musteri) + '</span>'
          : bos('zorunlu alan — seçilmeden kayıt açılmaz')],
        ['Proje', pKayit
          ? esc(pKayit.ad) + '<span class="cell-sub">' + esc(pKayit.kod) + '</span>'
          : bos('zorunlu değil; talep projesiz de açılabilir')],
        ['Sorumlu', bosNull(v.sorumlu)
          ? GV.user(v.sorumlu, { sm:true })
          : bos('atanmadı — talep atanmamış olarak açılır')],
        ['Açan yetkili', cKayit
          ? esc(cKayit.ad) + '<span class="cell-sub">' + esc(cKayit.pozisyon || cKayit.kod) + '</span>'
          : bos('boşsa ortak yordam oturumdaki kişiyi yazar')],
        ['Öncelik', bosNull(v.oncelik) ? GV.pri(v.oncelik) : bos('seçilmedi')]
      ]) + '</div></section>';
  }

  function slaKarti(v){
    var kat = bosNull(v.kategori), onc = bosNull(v.oncelik);

    /* ⚠️ EŞLEŞTİRME BU EKRANDA YAZILMAZ. Joker (`oncelik:'Tümü'`) kuralı
       `GV.destek.slaPolitikasi` içindedir; ikinci bir eşleştirme kurmak
       sözlük değişince sessizce ayrışan iki kural üretirdi (L-40). */
    var pol = kat ? GV.destek.slaPolitikasi(kat, onc) : null;

    var govde;
    if(!kat){
      govde = GV.notice({ tone:'info', icon:'i-info',
        title:'Kategori seçilmedi',
        text:'SLA politikası kategori × öncelik matrisinden okunur. Kategori seçilene kadar ' +
             'eşleşme ölçülemez — “yok” değil, henüz ölçülmedi.' });
    }else if(!pol){
      /* Uydurma değer BASILMAZ. Ölçüldü: dört kategori × dört önceliğin
         16’sında da politika var; eşleşmesiz kalan tek hâl, öncelik boşken
         jokersiz bir kategori seçmektir. */
      govde = GV.notice({ tone:'warn', icon:'i-alert',
        title:'Bu kategori/öncelik çiftine politika tanımlı değil',
        text:'“' + kat + '”' + (onc ? ' × “' + onc + '”' : ' (öncelik seçilmedi)') +
             ' için DB.slaPolicies içinde ne birebir kayıt ne de “Tümü” jokeri var. ' +
             'Talep açılabilir ama SLA alanı BOŞ KALIR; uydurma bir süre yazılmaz.' });
    }else{
      var joker = pol.oncelik === 'Tümü';
      govde = GV.dl([
        ['Politika', '<span class="cell-code">' + esc(pol.kod) + '</span>' +
          '<span class="cell-sub">' + esc(pol.kategori) + ' × ' + esc(pol.oncelik) + '</span>' +
          (joker ? not('“Tümü” jokeriyle eşleşti — bu kategoride öncelik SLA’yı değiştirmez') : '')],
        ['Hedef ilk yanıt', esc(dakika(pol.ilkYanit)) +
          not('DB.slaPolicies[].ilkYanit — DAKİKA. Kayda yazılmaz, taahhüdün ölçüsüdür.')],
        ['Hedef çözüm', esc(dakika(pol.cozum)) +
          not('DB.slaPolicies[].cozum — DAKİKA. Etiket bu sürenin insan okunur karşılığıdır.')],
        ['Kayda yazılacak SLA', '<b>' + esc(pol.etiket) + '</b>' +
          not('DB.tickets[].sla = politikanın etiket dizesi. Ölçüldü: 7 politikanın 7’sinde ' +
              'etiket, cozum dakikasının karşılığı — ilkYanit’ın değil.')],
        ['Çalışma saati', pol.calismaSaati ? esc(pol.calismaSaati) : bos('politikada yazılı değil')],
        ['Eskalasyon', pol.eskalasyon ? esc(pol.eskalasyon) : bos('politikada yazılı değil')]
      ], { skipEmpty:false });
    }

    /* SLA DURUMU — sayaç canlı çalışmaz (BE-D1). */
    var durumSatiri = rec
      ? (rec.slaDurum
          ? GV.dl([['SLA durumu', GV.badge(rec.slaDurum) +
              not('kaynak veride yazılı sabit; bu formdan değişmez ve yeniden hesaplanmaz (BE-D1)')]])
          : GV.dl([['SLA durumu', bos('bu kayıtta ölçülmemiş; sayaç canlı çalışmaz (BE-D1)')]]))
      : GV.dl([['SLA durumu', bos('yeni kayıtta null kalır — henüz ölçülmedi, “Zamanında” varsayılmaz (BE-D1)')]]);

    return '<section class="gv-card">' +
      '<div class="gc-head"><h3 class="gc-title">' + ico('i-hourglass') + 'SLA politikası</h3>' +
        '<span class="gc-meta">' + (DB.slaPolicies || []).length + ' politika</span></div>' +
      '<div class="gc-body">' + govde + durumSatiri + '</div>' +
    '</section>';
  }

  function bakimKarti(v){
    var t = taslak(v);
    var paket = t.musteri ? GV.destek.paketOf(t) : null;
    var govde;

    if(!t.musteri){
      govde = bos('müşteri seçilmeden paket aranamaz');
      govde = GV.dl([['Aktif paket', govde]]);
    }else if(!paket){
      govde = GV.dl([
        ['Aktif paket', bos('bu müşterinin defterde aktif bakım paketi yok')],
        ['Kota düşümü', bos('paket olmadığı için kota düşümü yapılmaz')]
      ]);
    }else{
      govde = GV.dl([
        ['Aktif paket', '<span class="cell-code">' + esc(paket.kod) + '</span>' +
          '<span class="cell-sub">' + esc(paket.ad) + ' · ' + esc(paket.tip || '—') + '</span>' +
          not('GV.destek.paketOf ile müşteri üzerinden bulundu')],
        ['Kalan saat', esc(F.num(paket.kalan)) + ' saat' +
          not('kullanılan ' + F.num(paket.kullanilan) + ' · aylık ' + F.num(paket.aylikSaat) + ' saat')],
        ['Kota düşümü', t.ucretli
          ? 'Yapılmayacak' + not('ücretli talep bakım kotasından düşmez')
          : 'Yapılacak' + not('harcanan süre girildikçe kotadan düşer; yeni talepte harcanan süre 0 doğar')]
      ]);
    }

    return '<section class="gv-card">' +
      '<div class="gc-head"><h3 class="gc-title">' + ico('i-wrench') + 'Bakım paketi</h3></div>' +
      '<div class="gc-body">' + govde +
        (t.bakimPaketi
          ? not('Seçilen “' + t.bakimPaketi + '” bir TİP adıdır; paket kaydı bu değerden ' +
                'değil, müşteri bağından bulunur.')
          : '') +
      '</div></section>';
  }

  function acikTalepKarti(v){
    var mus = bosNull(v.musteri);
    if(!mus) return '';
    var hepsi = TALEPLER.filter(function(t){
      return t.musteri === mus && (!rec || t.kod !== rec.kod); });
    var acik = hepsi.filter(function(t){ return GV.destek.acik(t); });

    if(!hepsi.length){
      return GV.notice({ tone:'ok', icon:'i-check-circle',
        title:'Bu müşterinin başka talebi yok',
        text:'Defterdeki ' + TALEPLER.length + ' talebin hiçbiri ' +
             (hesapUnvan(mus) || mus) + ' hesabına bağlı değil.' });
    }
    if(!acik.length){
      return GV.notice({ tone:'ok', icon:'i-check-circle',
        title:'Bu müşterinin açık talebi yok',
        text:hepsi.length + ' talebin hepsi kapalı sayılan bir durumda (' +
             GV.destek.kapaliDurumlar().join(' · ') + ').' });
    }
    return GV.notice({ tone:'warn', icon:'i-inbox',
      title:'Bu müşterinin ' + acik.length + ' açık talebi var',
      text:'Aynı sorunun ikinci kez açılmaması için bakın: ' +
           acik.map(function(t){ return t.kod + ' (' + t.durum + ')'; }).join(' · ') +
           '. Kayıtlar otomatik birleştirilmez; karar sizindir.',
      actions:[{ label:'Bu müşterinin taleplerini aç', cls:'btn-line',
                 href:'app-destek.html?f_musteri=' + encodeURIComponent(mus) }] });
  }

  function yanPanel(v){
    return kunyeKarti(v) + slaKarti(v) + bakimKarti(v) + acikTalepKarti(v);
  }

  /* =================================================================
     6. KAYDETME
     ================================================================= */
  function kaydet(){
    var v = form.submit();
    if(!v) return false;

    var hedefKod, mesaj;

    if(!rec){
      /* ---- YENİ KAYIT — TEK KAPI ---------------------------------
         `DB.tickets.push(...)` YOK. Kod üretimi, doğum durumu, SLA
         etiketinin politikadan okunması, `slaDurum:null` ve denetim izi
         ortak yordamdadır (brief §19.2). Ekran yalnız alanları taşır. */
      var r = GV.destek.olustur({
        baslik:      v.baslik,
        musteri:     bosNull(v.musteri),
        proje:       bosNull(v.proje),
        kategori:    bosNull(v.kategori),
        oncelik:     bosNull(v.oncelik),
        etki:        bosNull(v.etki),
        sorumlu:     bosNull(v.sorumlu),
        acan:        bosNull(v.acan),
        kanal:       bosNull(v.kanal),
        aciklama:    bosNull(v.aciklama),
        ucretli:     v.ucretli === true,
        bakimPaketi: bosNull(v.bakimPaketi)
      });

      /* Hata metni tek yerden çevrilir (`GV.flowHata`); ekran kendi
         cümlesini yazmaz. `zorunlu` dalı formda `required` ile zaten
         kapalı, `yetki` dalı da yukarıdaki kapıda — bu çağrı geriye kalan
         hâller (sözlük yüklenmemiş gibi) için ağdır. */
      if(r.ok === false){ GV.toast(GV.flowHata(r), 'danger'); return false; }

      hedefKod = r.talep.kod;
      mesaj = 'Talep “' + r.talep.durum + '” durumunda açıldı. ' +
        (r.politika
          ? 'SLA taahhüdü ' + r.politika.kod + ' politikasından okundu: “' + r.talep.sla +
            '” (hedef çözüm ' + r.politika.cozum + ' dk, hedef ilk yanıt ' + r.politika.ilkYanit + ' dk).'
          : 'Kategori/öncelik çiftine politika düşmediği için SLA alanı boş bırakıldı; ' +
            'uydurma bir süre yazılmadı.') +
        ' SLA durumu ölçülmedi (BE-D1).';

    }else{
      /* ---- DÜZENLEME ---------------------------------------------
         ⚠️ ORTAK KATMANDA `GV.destek.guncelle` YOKTUR (raporlandı):
         brief §19.2 yalnız `olustur` imzasını taşıyor. Alanlar bu yüzden
         doğrudan yazılıyor — `app-musteri-form.html:575-582` ile aynı
         desen. Yazılmayan alanlar bilerek dışarıda:
           · `durum`      — yalnız GV.flow.gec('ticket', …),
           · `slaDurum`   — canlı sayaç yok, kaynak veride sabit (BE-D1),
           · `musteri` / `musteriAd` — alan salt okunur,
           · ölçüm alanları (`mudahaleSuresi` · `cozumSuresi` ·
             `harcananSure` · `memnuniyet`) — bu form onları ölçmez. */
      hedefKod = rec.kod;
      var degisen = [];

      ALANLAR.forEach(function(k){
        var yeni = bosNull(v[k]);
        if(yeni !== bosNull(rec[k])) degisen.push(k);
        rec[k] = yeni;
      });

      var yeniUcretli = v.ucretli === true;
      if(yeniUcretli !== (rec.ucretli === true)) degisen.push('ucretli');
      rec.ucretli = yeniUcretli;

      /* SLA TAAHHÜDÜ TÜRETİLİR, YAZILMAZ. Kategori ya da öncelik
         değiştiyse `sla` eski çiftin etiketini taşımaya devam ederdi ve
         kayıt kendi kendisiyle çelişirdi (destek listesi bunu “politika
         ile çelişiyor” diye zaten basıyor). Eşleştirme yine tek yerden:
         `GV.destek.slaPolitikasi` — ikinci bir matris kurulmadı. */
      var pol = rec.kategori ? GV.destek.slaPolitikasi(rec.kategori, rec.oncelik) : null;
      var yeniSla = pol ? pol.etiket : null;
      var slaNotu = '';
      if(yeniSla !== (rec.sla || null)){
        slaNotu = ' SLA taahhüdü ' +
          (yeniSla ? '“' + yeniSla + '” olarak politikadan (' + pol.kod + ') yeniden okundu.'
                   : 'boşaltıldı: yeni kategori/öncelik çiftine politika düşmüyor.');
        degisen.push('sla');
        rec.sla = yeniSla;
      }

      GV.audit.yaz({
        kayit:hedefKod, modul:'Destek',
        islem:degisen.length
          ? 'Destek talebi güncellendi — değişen alan: ' + degisen.join(', ')
          : 'Destek talebi kaydedildi — alan değişmedi',
        tone:'info', icon:'i-edit' });

      mesaj = 'Talep bilgileri güncellendi; durum (' + rec.durum + ') değişmedi — ' +
              'durum yalnız talep detayındaki geçiş düğmeleriyle ilerler.' + slaNotu;
    }

    /* `location.href` YAZILMAZ — karar ortak yordamda (brief §5.4). */
    GV.afterSave({
      kod:hedefKod,
      liste:GERI,
      detay:'app-destek-detay.html',
      yeni:!rec,
      mesaj:mesaj
    });
    return true;
  }

  /* =================================================================
