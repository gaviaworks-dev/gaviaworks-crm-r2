<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Proje Detayı — GaviaWorks CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body data-sec="operasyon" data-screen="proje">

<script src="assets/data/org.js"></script>
<script src="assets/data/crm.js"></script>
<script src="assets/data/work.js"></script>
<script src="assets/data/misc.js"></script>
<script src="assets/data/ops.js"></script>
<script src="assets/data/hr.js"></script>
<script src="assets/data/lifecycle.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/domain.js"></script>
<script src="assets/js/quicknote.js"></script>
<script>
/* =====================================================================
   PROJE DETAYI — brief §18.7 (on sekme) · §18.1 · §18.2 · §18.5 · §23.2

   TEK KAYIT, ON SEKME. Milestone, sprint, kalite, hata, değişiklik,
   teslim ve belge AYRI EKRAN DEĞİLDİR (rota 33-47): hepsi bu ekranın bir
   sekmesidir. Proje bağlamı dışında bir alt kayıt tipini görmek gerekirse
   yeni ekran değil Operasyon filtresi kullanılır (brief §18.7 son paragraf).

   BÜTÇE SEKMESİ (rota 79 · ADR-R2-12 · brief §23.2) — onuncu sekme, Özet'ten
   hemen sonra. K-21 gereği maliyet kartı ve künyenin `Bütçe (iç maliyet
   ekseni)` satırı Özet'ten BURAYA TAŞINDI (silinmedi); Özet'te yerine tek
   satırlık bir bağ kaldı. Aynı sayı iki sekmede basılmaz.

   TEMBEL YÜKLEME ZORUNLU (risk R-04): R1'de bu ekran 111 KB'tı. Sekme
   gövdesi yalnız `gv:tab` olayında, yalnız bir kez çizilir. Dinleyici
   `document`a bağlıdır — `document` `GV.refresh()`te ölmeyen kalıcı bir
   düğümdür, bu yüzden `GV.on` ile tekil anahtar üzerinden bağlanır (L-16).

   ⚠️ İKİ FARKLI "MILESTONE" (brief §18.2): Milestone sekmesi
   `DB.projectMilestones` okur (işin teslim adımı). `DB.milestones` ÖDEME
   PLANI TAKSİTİDİR ve bu ekranda yalnız kapanış kontrolünün finans
   maddesinde, o adla anılır. İkisini aynı sekmede aynı adla basmak, iki
   ayrı defteri tek sayı gibi göstermek olurdu.

   BOŞ SEKME "KAYIT YOK" DEMEZ. On dört projenin altısı hiçbir alt kayıt
   taşımıyor ve bu bir eksiklik değil ÖLÇÜMDÜR: hepsi kapanmış kayıtlar,
   alt defterleri hiç açılmamış. Boş sekme "bu projede X kaydı defterde
   yok" der ve sebebini yazar (§10.1 · L-13).

   DURUM DEĞİŞİMİNİN TEK KAPISI `GV.flow.gec`; `p.durum = …` yasaktır.
   Butonlar `GV.flow.adimlar('project', kod)` ne veriyorsa odur; ekran kendi
   durum listesini YAZMAZ. Hata metni `GV.flowHata(r)`'dan gelir.
   ===================================================================== */
document.addEventListener('gv:ready', function(){
  var F     = GV.fmt;
  var esc   = GV.esc;
  var ico   = GV.ico;
  var mount = document.getElementById('rec');
  var kod   = new URLSearchParams(location.search).get('id');

  var canFinans = GV.perm.can('finans');
  var canDuzen  = GV.perm.can('duzenle');
  var MASK      = '••••••';
  var BOS       = '<span class="u-faint">—</span>';

  /* `GV.proje.kayit` kod da kayıt da kabul eder; kayıt yoksa null döner. */
  var p = GV.proje.kayit(kod);

  /* ---- 1. KAYIT YOK (brief §6 adım 1) ------------------------------ */
  if(!p){
    GV.pageHead({
      eyebrow:'Operasyon · Projeler', title:'Kayıt bulunamadı', sub:kod || '—',
      actions:[{ label:'Proje listesine dön', icon:'i-arrow-left', href:'app-proje.html' }]
    });
    mount.innerHTML = '<div class="gv-card">' + GV.errorState({
      title:'Proje bulunamadı',
      desc:'Aradığınız proje silinmiş ya da adres hatalı olabilir. Doğru kaydı ' +
           'proje listesinden seçebilirsiniz.'
    }) + '</div>';
    /* `GV.errorState` "Tekrar dene" düğmesini basar ama yordamı yalnız
       `GV.list` içinde bağlıdır; tek başına kullanıldığında ölü kalırdı. */
    var rt = mount.querySelector('[data-retry]');
    if(rt) rt.addEventListener('click', function(){ GV.refresh(); });
    return;
  }

  /* ---- 2. KAYIT SAHİPLİĞİ KAPISI (brief §6 adım 2) ------------------
     Proje `musteri` alanı taşır; müşteri oturumu yalnız kendi projesini
     açabilir. `false` dönerse ekran yetkisiz durumunu BASTI, biz çıkarız. */
  if(!GV.guardRecord({ mount:'#rec', musteri:p.musteri, kod:p.kod,
                       eyebrow:'Operasyon · Projeler', title:p.ad,
                       geriHref:'app-proje.html', geriLabel:'Proje listesine dön' })) return;

  /* ===================================================================
     3. BAĞLAR — hepsi `proje` alanı üzerinden, tarih yakınlığı bağ değildir
     =================================================================== */
  function byProje(list){
    return (list || []).filter(function(x){ return x.proje === p.kod; });
  }

  var msler   = byProje(DB.projectMilestones);   /* ⚠️ DB.milestones DEĞİL (§18.2) */
  var sprler  = byProje(DB.sprints);
  var senler  = byProje(DB.testCases);
  /* ⚠️ `DB.tests` brief §18.1 tablosunda ADI GEÇMİYOR ama `GV.test.sayac`
     bir TEST KAYDI ister (`sayac(test)` → `kosumlar(test.kod)`), proje kodu
     değil. Sayaç bayrağını (§18.6) ekranda söyleyebilmenin tek yolu kayıt
     koleksiyonunu okumaktır; sapma rapora yazıldı. */
  var kosumK  = byProje(DB.tests);
  var hatalar = byProje(DB.bugs);
  var degler  = byProje(DB.changeRequests);
  var tslmler = byProje(DB.deliveries);
  var belgeler= byProje(DB.documents);
  var izler   = GV.audit.oku(p.kod, 30);
  /* Rota 62 · 63 — bu projenin toplantıları. Sekme sayacı bunu okur, tanım
     sekme şeridinden ÖNCE durur. `aktif` alanı var ama `durum` da var:
     arşiv sorusu `GV.arsivli`ye sorulur, `aktif` orada tuzaktır (K-33). */
  var toplantilar = (DB.meetings || [])
    .filter(function(m){ return m.proje === p.kod && !GV.arsivli(m); })
    .sort(function(a,b){ return String(b.tarih).localeCompare(String(a.tarih)); });

  /* Alt kayıt toplamı — "bu proje hiç defter tutmamış" ölçümü.
     Sayı ekranda gerekçe olarak kullanılıyor, o yüzden türetilir. */
  function altToplam(x){
    var c = function(l){ return (l || []).filter(function(r){ return r.proje === x.kod; }).length; };
    return c(DB.projectMilestones) + c(DB.sprints) + c(DB.testCases) + c(DB.tests) +
           c(DB.bugs) + c(DB.changeRequests) + c(DB.deliveries) + c(DB.documents) + c(DB.tasks);
  }
  var buProjeBos = altToplam(p) === 0;
  var kapaliBosSayi = (DB.projects || []).filter(function(x){
    return GV.proje.kapali(x) && altToplam(x) === 0; }).length;
  var kapaliSayi = (DB.projects || []).filter(function(x){ return GV.proje.kapali(x); }).length;

  /* Boş sekmenin SEBEBİ — proje kapalıysa bu bir eksiklik değil ölçümdür. */
  var bosSebep = GV.proje.kapali(p)
    ? 'Bu proje kapalı (' + p.durum + (p.gercekBitis ? ' · gerçek bitiş ' + F.date(p.gercekBitis) : '') +
      '). Kapanmış ' + kapaliSayi + ' projenin ' + kapaliBosSayi +
      ' tanesinde hiçbir alt kayıt yok — eksik veri değil, defterin hiç açılmamış olması.'
    : 'Bu projede henüz böyle bir kayıt açılmamış.';

  /* ===================================================================
     4. ZAMAN DEFTERİ — üç ayrı cümle, üç ayrı biçim (§10.1)

     ⚠️ ÖLÇÜLDÜ: `DB.timelogs` `assets/data/hr.js` içinde yaşıyor ve bu
     ekranın veri kümesi brief §18.0'da `org · crm · work · misc · ops ·
     lifecycle` olarak SABİTLENMİŞ. Yani koleksiyon bu ekranda YÜKLÜ DEĞİL.
     `GV.proje.sure()` bu durumda `kapsam:false` döndürür — ama "zaman
     defteri bu projeyi kapsamıyor" cümlesi YANLIŞ olurdu: defter projeyi
     kapsamıyor değil, defter burada HİÇ YOK. İkisi ayrı şeydir ve ekran
     ikisini ayrı yazar (L-13). Sapma rapora yazıldı.
     =================================================================== */
  var defterVar = !!(window.DB && DB.timelogs);

  /* ---- Bütçeyi BESLEYEN ölçülmüş kayıt sayısı (sekme sayacı) --------
     Bütçe sekmesinin sayacı uydurma bir rakam değil ÖLÇÜMDÜR: gerçekleşen
     maliyeti üreten iki küme sayılır — onaylı zaman kaydı ve TESLİM ALINMIŞ
     satın alma. `GV.proje.maliyet` tam olarak bu iki kümeyi topluyor
     (domain.js "PROJE — maliyet ve kârlılık"). Talep aşamasındaki satın alma
     henüz maliyet değildir, o yüzden sayılmaz.
     ⚠️ Bu iki süzgeç ortak katmanda bir SAYAÇ yordamı olarak açık değil
     (`GV.proje.maliyet` yalnız tutarı döndürüyor, kaç kayıttan geldiğini
     değil); süzgeç burada tekrarlandı ve sapma rapora yazıldı. */
  var butceLog = defterVar
    ? (DB.timelogs || []).filter(function(l){
        return l.proje === p.kod && l.onay === 'Onaylandı'; }).length
    : 0;
  var butceSat = (DB.purchases || []).filter(function(x){
    return x.proje === p.kod && ['Tam Teslim','Kapandı'].indexOf(x.durum) !== -1; }).length;
  var butceKayit = butceLog + butceSat;

  /* ===================================================================
     5. ÇİZİM YARDIMCILARI (ekran içi — ortak katmana dokunulmadı)
     =================================================================== */
  function kartBasi(ikon, baslik, sag){
    return '<div class="gc-head"><h3 class="gc-title">' + ico(ikon) + esc(baslik) + '</h3>' +
      (sag ? '<div class="gc-head-acts">' + sag + '</div>' : '') + '</div>';
  }
  function sayacEtiketi(n, birim){
    return '<span class="u-faint u-sm">' + n + ' ' + esc(birim) + '</span>';
  }
  function para(v){
    if(!canFinans) return '<span class="cell-mask">' + MASK + '</span>';
    return v == null ? BOS : '<span class="cell-money">' + esc(F.money(v)) + '</span>';
  }
  function saat(v){
    return v == null ? BOS : '<span class="u-num">' + esc(F.hours(v)) + '</span>';
  }
  function gecmisTarih(iso){
    /* `GV.dateCell` gecikmeyi kırmızı boyar; geçmişte kalmış bir kayıt
       tarihi için bu yanlış anlam üretir. İleriye dönük tarihlerde
       (planlanan bitiş, taksit, kilometre taşı) `GV.dateCell` kullanılır. */
    return iso ? '<span class="cell-date">' + esc(F.date(iso)) + '</span>' : BOS;
  }
  function kisiler(kodlar){
    if(!kodlar || !kodlar.length) return null;
    return '<span class="gv-user-stack">' +
      kodlar.map(function(k){ return GV.user(k, { sm:true, nameOnly:false }); }).join('') +
      '</span>' + GV.cell.sub(esc(kodlar.map(function(k){ return DB.empName(k) || k; }).join(' · ')));
  }
  function bosKart(ikon, baslik, ne, ekSebep){
    return '<section class="gv-card">' + kartBasi(ikon, baslik, sayacEtiketi(0, 'kayıt')) +
      '<div class="gc-body">' + GV.empty({
        icon:ikon,
        title:'Bu projede ' + ne + ' defterde yok',
        desc:bosSebep + (ekSebep ? ' ' + ekSebep : '')
      }) + '</div></section>';
  }

  /* ===================================================================
     6. SEKME ŞERİDİ — brief §18.7 tablosu + §23.2 Bütçe, on sekme

     ⚠️ ŞERİTTE İKON YOK: dokuz ikonlu sekme 1440 px'te içerik sütununa
     sığmıyordu, `.gv-tabs` yatay kayıyor ama scrollbar'ı gizli — kesilen
     sekme kullanıcıya işaret bırakmadan kaybolurdu. Onuncu sekme bu kısıtı
     daha da sıkıştırır; ikon KONMADI (§22.17.8 · §23.9.8). İkonlar kart
     başlıklarında yaşıyor. Her sekme ÖLÇÜLEN kayıt sayısını taşır.
     =================================================================== */
  var SEKME = [
    { key:'ozet', label:'Özet', sayac:GV.proje.kapanisKontrol(p.kod).length,
      ipucu:'künye · süre · kapanış kontrolü (8 madde) · bakım' },
    { key:'butce', label:'Bütçe', sayac:butceKayit,
      ipucu:butceLog + ' onaylı zaman kaydı · ' + butceSat + ' teslim alınmış satın alma — ' +
        'gerçekleşen maliyeti besleyen ölçülmüş kayıt' },
    { key:'milestone', label:'Milestone', sayac:msler.length,
      ipucu:'DB.projectMilestones — proje kilometre taşı (ödeme taksiti değil)' },
    { key:'sprint', label:'Sprint', sayac:sprler.length,
      ipucu:'bu projeye bağlı sprint kaydı' },
    { key:'test', label:'Kalite', sayac:senler.length + kosumK.length,
      ipucu:senler.length + ' test senaryosu · ' + kosumK.length + ' test kaydı' },
    { key:'hata', label:'Hatalar', sayac:hatalar.length,
      ipucu:'bu projeye bağlı hata kaydı' },
    { key:'degisiklik', label:'Değişiklik', sayac:degler.length,
      ipucu:'bu projeye bağlı değişiklik talebi' },
    { key:'teslim', label:'Teslim', sayac:tslmler.length,
      ipucu:'bu projeye bağlı teslim kaydı' },
    { key:'belge', label:'Belgeler', sayac:belgeler.length,
      ipucu:'DB.documents · proje alanı bu projeyi gösteren belge' },
    { key:'aktivite', label:'Aktivite', sayac:izler.length + toplantilar.length,
      ipucu:'denetim izi ve sistem günlüğü kaydı' }
  ];

  var sekmeHtml = SEKME.map(function(s){
    return '<button type="button" class="gv-tab" role="tab" data-tab="' + s.key + '" ' +
      'aria-selected="false" title="' + esc(s.ipucu) + '">' + esc(s.label) +
      '<span class="gv-tab-cnt">' + s.sayac + '</span></button>';
  }).join('');

  var panelHtml = SEKME.map(function(s){
    return '<div class="gv-tabpanel u-mt-4" role="tabpanel" data-panel="' + s.key + '" ' +
      'aria-label="' + esc(s.label) + '" hidden></div>';
  }).join('');

  /* ===================================================================
     7. ORTAK LİSTE KURUCUSU

     Sekme içindeki her liste `GV.list`tir ve **`urlSync:false`** bildirir
     (brief §18.9): bayrak iki yönlüdür — yazmayan liste okumaz da. Aynı
     sayfada dokuz panel var; biri diğerinin adres durumunu üstlenemez.

     `countTarget` ZORUNLU: verilmezse `GV.list` sayfada tek liste
     gördüğünde sayacı `GV.pageHead`in `[data-listcount]` düğümüne yazar ve
     projenin künye satırını "5 kayıt" ile ezerdi (`ui.js` UID-06).

     KAPSAM: `scopeField` yalnız `musteri` eksenini eşler. `kendi` ya da
     `proje` kapsamlı bir rolde alt kayıtları sorumluya göre süzmek YANLIŞ
     olurdu — bu ekranda kapsam kararı zaten KAYIT düzeyinde verildi
     (`GV.guardRecord`). Eşlenmemiş kapsamı bileşen kendi şeridinde söyler,
     sessiz kalmaz.
     =================================================================== */
  function kapsamAlani(){
    return { musteri:function(){ return p.musteri; } };
  }

  function benzersiz(list, alan){
    var out = [];
    (list || []).forEach(function(r){
      if(r[alan] != null && r[alan] !== '' && out.indexOf(r[alan]) === -1) out.push(r[alan]);
    });
    return out.sort();
  }

  function liste(cfg){
    cfg.urlSync = false;
    cfg.archive = false;
    cfg.scopeField = kapsamAlani();
    cfg.pageSize = cfg.pageSize || 10;
    cfg.delay = 0;
    return GV.list(cfg);
  }

  /* Sekme gövdesi iskeleti: açıklama kartı + liste yuvası. */
  function listeKabuk(key, ikon, baslik, aciklama, sayi){
    return '<section class="gv-card">' +
        kartBasi(ikon, baslik, '<span class="gc-meta" id="pdSay-' + key + '">' + sayi + ' kayıt</span>') +
        '<div class="gc-body u-sm u-muted">' + aciklama + '</div>' +
      '</section>' +
      '<div class="u-mt-4" id="pdListe-' + key + '"></div>';
  }

  /* ===================================================================
     8. SEKME 1 — ÖZET
     =================================================================== */
  function cizOzet(){
    return '<div class="gv-grid gv-grid-main">' +
      '<div>' + kunyeKarti() + sureKarti() + maliyetBagi() + kapanisKarti() + bakimKarti() + '</div>' +
      '<aside>' + durumKarti() + saglikKarti() + '</aside>' +
    '</div>';
  }

  /* ---- 8.1 Künye ---------------------------------------------------- */
  function kunyeKarti(){
    var satirlar = [
      ['Proje kodu',      '<span class="cell-code">' + esc(p.kod) + '</span>'],
      ['Proje adı',       esc(p.ad)],
      ['Müşteri',         p.musteri
        ? '<a href="app-musteri-detay.html?id=' + esc(p.musteri) + '">' + esc(p.musteriAd || p.musteri) + '</a>' +
          GV.cell.sub(esc(p.musteri))
        : null],
      ['Durum',           GV.badge(p.durum) +
        GV.cell.sub(GV.proje.acik(p) ? 'açık' : GV.proje.kapali(p) ? 'kapalı' : 'işi bitti, defter kapanmadı')],
      ['Sağlık',          p.saglik ? GV.badge(p.saglik) : null],
      ['İlerleme',        p.ilerleme == null ? null : GV.progress(p.ilerleme)],
      ['Faz',             p.faz ? esc(p.faz) : null],
      ['Tür',             p.tur ? esc(p.tur) : null],
      ['Kaynak',          p.kaynak ? esc(p.kaynak) : null],
      ['Öncelik',         p.oncelik ? GV.badge(p.oncelik) : null],
      ['Proje yöneticisi',p.pm ? GV.user(p.pm, { sm:true }) : null],
      ['Teknik sorumlu',  p.teknikSorumlu ? GV.user(p.teknikSorumlu, { sm:true }) : null],
      ['Müşteri sorumlusu', p.musteriSorumlu ? GV.user(p.musteriSorumlu, { sm:true }) : null],
      ['Ekip',            kisiler(p.ekip)],
      ['Başlangıç',       gecmisTarih(p.baslangic)],
      ['Planlanan bitiş', p.planlananBitis
        ? GV.dateCell(p.planlananBitis, { done:!GV.proje.acik(p) }) +
          (GV.proje.geciken(p) ? GV.cell.sub('<span class="u-danger">' + esc(F.rel(p.planlananBitis)) + '</span>') : '')
        : null],
      ['Gerçek bitiş',    p.gercekBitis ? gecmisTarih(p.gercekBitis) : null],
      ['Sözleşme tutarı', p.sozlesmeTutari == null ? null : para(p.sozlesmeTutari)],
      /* `Bütçe (iç maliyet ekseni)` satırı BURADAN KALDIRILMADI, BÜTÇE
         SEKMESİNE TAŞINDI (K-21 · §23.2): plan rakamı gerçekleşenle aynı
         yüzeyde okunmalı, künyede tek başına duran bir sayı olmamalı. */
      ['Tahmini süre',    p.tahminiSure == null ? null : saat(p.tahminiSure)],
      ['Teknoloji',       (p.teknoloji || []).length ? esc(p.teknoloji.join(' · ')) : null],
      ['Üçüncü taraf',    (p.ucuncuTaraf || []).length ? esc(p.ucuncuTaraf.join(' · ')) : null],
      ['Depo',            p.repo ? esc(p.repo) : null],
      ['Test ortamı',     p.test ? esc(p.test) : null],
      ['Canlı ortam',     p.canli && p.canli !== '—' ? esc(p.canli) : null],
      ['Tasarım',         p.tasarim ? esc(p.tasarim) : null],
      ['Sunucu',          p.sunucu ? esc(p.sunucu) : null],
      ['Son güncelleme',  gecmisTarih(p.sonGuncelleme)]
    ];

    var riskler = (p.riskler || []).length
      ? '<div class="gc-body">' + GV.notice({ tone:'warn', icon:'i-alert',
          title:'Kayıtlı risk (' + p.riskler.length + ')',
          text:p.riskler.join(' · ') }) + '</div>'
      : '';
    var gecikme = p.gecikmeNedeni
      ? '<div class="gc-body">' + GV.notice({ tone:'warn', icon:'i-clock',
          title:'Gecikme nedeni', text:p.gecikmeNedeni }) + '</div>'
      : '';

    return '<section class="gv-card">' +
      kartBasi('i-briefcase', 'Proje künyesi', GV.badge(p.durum)) +
      '<div class="gc-body">' + GV.dl(satirlar, { skipEmpty:true }) + '</div>' +
      riskler + gecikme +
    '</section>';
  }

  /* ---- 8.2 Süre — GV.proje.sure ------------------------------------- */
  function sureKarti(){
    var s = GV.proje.sure(p.kod);
    var govde;

    if(!defterVar){
      /* Koleksiyon hiç yüklü değil → "0 saat" da "kapsamıyor" da yanlış
         olurdu; ölçülemedi denir ve SEBEBİ yazılır (§10.1 üçüncü satır). */
      govde = '<div class="gc-body">' + GV.notice({ tone:'warn', icon:'i-alert',
          title:'Zaman defteri bu ekranda ölçülemedi',
          text:'Zaman kaydı koleksiyonu (DB.timelogs) bu ekranın veri kümesinde ' +
               'yüklü değil. Gerçekleşen saat, faturalanabilir saat ve onay ' +
               'farkı bu yüzden BOŞ bırakıldı — sıfır yazılmadı. Planlanan süre ' +
               'proje kaydından okunur ve ölçülüdür.' }) + '</div>' +
        '<div class="gc-body">' + GV.dl([
          ['Planlanan süre', saat(s.planlanan) + GV.cell.sub('proje kaydındaki tahmini süre')],
          ['Gerçekleşen (onaylı)', BOS + GV.cell.sub('zaman defteri yüklü değil')],
          ['Onaysız dahil toplam', BOS + GV.cell.sub('zaman defteri yüklü değil')],
          ['Faturalanabilir', BOS + GV.cell.sub('zaman defteri yüklü değil')]
        ]) + '</div>';
    }else if(!s.kapsam){
      govde = '<div class="gc-body">' + GV.notice({ tone:'info', icon:'i-timer',
          title:'Zaman defteri bu projeyi kapsamıyor',
          text:'Defterde bu projeye yazılmış tek bir kayıt yok. Bu bir ölçümdür; ' +
               '"0 saat çalışıldı" demek değildir.' }) + '</div>' +
        '<div class="gc-body">' + GV.dl([
          ['Planlanan süre', saat(s.planlanan)],
          ['Defterdeki kayıt', '<span class="u-num">0</span>' + GV.cell.sub('bu projeyi kapsamıyor')]
        ]) + '</div>';
    }else{
      var fark = s.tum - s.gerceklesen;
      govde = '<div class="gc-body">' + GV.dl([
          ['Planlanan süre', saat(s.planlanan)],
          ['Gerçekleşen (yalnız onaylı)', saat(s.gerceklesen)],
          ['Onaysız dahil toplam', saat(s.tum) +
            (fark > 0 ? GV.cell.sub('<span class="u-warn">' + esc(F.hours(fark)) + ' henüz onaylanmadı</span>') : '')],
          ['Faturalanabilir', saat(s.faturalanabilir)],
          ['Defterdeki kayıt', '<span class="u-num">' + s.kayit + '</span>'],
          ['Plan sapması', s.planlanan
            ? GV.cell.num(s.gerceklesen - s.planlanan, { basamak:1, signed:true }) +
              GV.cell.sub('gerçekleşen − planlanan')
            : BOS + GV.cell.sub('planlanan süre yazılı değil')]
        ]) + '</div>' +
        '<div class="gc-body u-faint u-xs">Gerçekleşen yalnız ONAYLI zaman kayıtlarından ' +
          'sayılır; onaysız satırlar ayrı satırda gösterilir (GV.proje.sure).</div>';
    }

    return '<section class="gv-card u-mt-4">' +
      kartBasi('i-timer', 'Süre', defterVar ? '' : '<span class="badge is-warn">ölçülemedi</span>') +
      govde +
    '</section>';
  }

  /* ---- 8.3 Maliyet ve bütçe — TEK SATIRLIK BAĞ (K-21 · §23.2) -------
     Maliyet kartı BU EKRANDAN SİLİNMEDİ, Bütçe sekmesine TAŞINDI. İki
     yüzey aynı defteri göstermez: dört gider kalemi, kârlılık ve planlanan
     bütçe karşılaştırması tek bir yerde, Bütçe sekmesinde durur. Buradaki
     düğme yeni bir yordam açmaz — kapanış kartındaki `data-git` deseninin
     aynısıdır ve sekmeyi doğrudan açar. */
  function maliyetBagi(){
    return '<section class="gv-card u-mt-4">' +
      kartBasi('i-wallet', 'Maliyet ve bütçe') +
      '<div class="gc-body u-sm u-muted">Maliyet ve bütçe ayrıntısı ' +
        '<b>Bütçe sekmesindedir</b>: dört gider kalemi, kârlılık ve planlanan ' +
        'bütçe ile karşılaştırma orada tutulur. Aynı sayı iki sekmede basılmaz. ' +
        '<button type="button" class="btn btn-ghost btn-xs" data-git="butce">' +
        ico('i-arrow-right','ic-sm') + ' Bütçe sekmesine git</button></div>' +
    '</section>';
  }

  /* ---- 8.4 Kapanış kontrolü — GV.proje.kapanisKontrol ---------------
     ⚠️ ÜÇ GÖRÜNÜM: geçti · geçmedi · ÖLÇÜLEMEDİ. `olculdu:false` "geçti"
     DEĞİLDİR; ölçülemeyen maddeyi yeşile yazmak, kapanışı olmayan bir
     güvenceyle onaylatmaktır (L-25). Üçüncüsü ayrı tonla basılır. */
  function kapanisKarti(){
    var kontrol = GV.proje.kapanisKontrol(p.kod);
    var gecen     = kontrol.filter(function(k){ return k.olculdu && k.gecti; }).length;
    var gecmeyen  = kontrol.filter(function(k){ return k.olculdu && !k.gecti; });
    var olculemez = kontrol.filter(function(k){ return !k.olculdu; });

    var maddeler = kontrol.map(function(k){
      var rozet = !k.olculdu ? GV.badge('Ölçülemedi', 'is-neutral')
                : k.gecti    ? GV.badge('Geçti', 'is-ok')
                             : GV.badge('Geçmedi', 'is-danger');
      /* Aynı sayfaya giden bağlantı ANCHOR DEĞİL BUTONDUR: adres
         `app-proje-detay.html?id=…#teslim` biçiminde sözleşmedir ama sayfa
         zaten açıkken bir hash bağlantısı sekmeyi değiştirmez — ölü
         bağlantı olurdu. Sekmeyi doğrudan açan gerçek bir düğme basılır. */
      var ayni = k.href && k.href.indexOf('app-proje-detay.html') === 0;
      var hedefSekme = ayni ? (k.href.split('#')[1] || '') : '';
      var git = '';
      if(ayni && SEKME.some(function(s){ return s.key === hedefSekme; })){
        git = '<button type="button" class="btn btn-ghost btn-xs" data-git="' + esc(hedefSekme) + '">' +
              ico('i-arrow-right','ic-sm') + ' Sekmeye git</button>';
      }else if(k.href && !ayni){
        git = '<a class="btn btn-ghost btn-xs" href="' + esc(k.href) + '">' +
              ico('i-external','ic-sm') + ' Aç</a>';
      }
      return '<li><span><b>' + esc(k.etiket) + '</b>' +
        GV.cell.sub(esc(k.detay || '')) + '</span>' +
        '<span class="u-row">' + git + rozet + '</span></li>';
    }).join('');

    var durusu = gecmeyen.length
      ? GV.notice({ tone:'danger', icon:'i-lock',
          title:'Kapanış KİLİTLİ — ölçülebilen ' + gecmeyen.length + ' madde geçmiyor',
          text:gecmeyen.map(function(k){ return k.etiket; }).join(' · ') +
               '. Bu maddeler tamamlanmadan proje kapatılamaz; yalnız sahip / genel müdür ' +
               'neden kodu ve açıklama ile yönetici istisnası uygulayabilir.' })
      : olculemez.length
        ? GV.notice({ tone:'warn', icon:'i-alert',
            title:'Kaydı olmadığı için ölçülemeyen ' + olculemez.length + ' madde var',
            text:olculemez.map(function(k){ return k.etiket; }).join(' · ') +
                 '. Ölçülemeyen madde kapanışı kilitlemez ama kapanış gerekçesi zorunludur.' })
        : GV.notice({ tone:'ok', icon:'i-check-circle',
            title:'Ölçülebilen maddelerin tamamı geçti',
            text:gecen + ' madde ölçüldü ve geçti; kapanışın önünde engel yok.' });

    var dugme;
    if(GV.proje.kapali(p)){
      dugme = '<div class="gc-body u-faint u-sm">Bu proje zaten kapalı (' + esc(p.durum) +
              (p.gercekBitis ? ' · ' + esc(F.date(p.gercekBitis)) : '') + '); kapanış akışı çalışmaz.</div>';
    }else{
      dugme = '<div class="gc-body"><button type="button" class="btn btn-ok" id="pdKapat"' +
        (canDuzen ? '' : ' disabled title="Bu işlem için düzenleme yetkiniz yok"') + '>' +
        ico('i-clipboard-check') + ' Kapanış akışını başlat</button>' +
        '<p class="u-faint u-xs u-mt-4">Kapanış akışı kaydı "Tamamlandı" durumuna taşır, ' +
        'gerçek bitişi ' + esc(F.date(DB.today)) + ' yazar ve kararı denetim izine geçirir ' +
        '(GV.proje.kapat). Durum şeridindeki geçişlerden ayrı bir yordamdır.</p></div>';
    }

    return '<section class="gv-card u-mt-4">' +
      kartBasi('i-clipboard-check', 'Kapanış kontrolü',
        sayacEtiketi(gecen + '/' + kontrol.length, 'madde geçti')) +
      '<ul class="gv-checklist">' + maddeler + '</ul>' +
      '<div class="gc-body">' + durusu + '</div>' +
      dugme +
    '</section>';
  }

  /* ---- 8.5 Bakım paketi --------------------------------------------- */
  function bakimKarti(){
    var bagli   = (DB.supportPackages || []).filter(function(x){ return x.proje === p.kod; });
    var adaylar = GV.proje.bakimPaketleri(p.kod) || [];
    var bosta   = adaylar.filter(function(x){ return !x.proje; });

    var listeHtml;
    if(bagli.length){
      listeHtml = '<ul class="gv-checklist">' + bagli.map(function(x){
        return '<li><span><b>' + esc(x.kod) + '</b> — ' + esc(x.ad || x.tip || '—') +
          GV.cell.sub(esc((x.periyot || 'periyot yazılı değil') + ' · ' +
            (x.baslangic ? F.date(x.baslangic) : '—') + ' → ' + (x.bitis ? F.date(x.bitis) : '—') +
            ' · aylık ' + (x.aylikSaat != null ? x.aylikSaat + ' sa' : '—'))) + '</span>' +
          GV.badge(x.durum) + '</li>';
      }).join('') + '</ul>';
    }else{
      listeHtml = '<div class="gc-body">' + GV.empty({
        icon:'i-support', title:'Bu projeye bağlı bakım paketi yok',
        desc:'Bakım paketi ile proje arasındaki bağ pakette (DB.supportPackages.proje) ' +
             'tutulur ve kaynak veride 7 paketin 7\'sinde de boştur. Tek dolaylı zincir ' +
             '(paket → sözleşme → proje) hiçe çıkıyor; tarih yakınlığı ve müşteri ' +
             'eşleşmesi bağ sayılmadı. Bağı kullanıcı kurar.'
      }) + '</div>';
    }

    var adayHtml = '';
    if(bosta.length){
      adayHtml = '<div class="gc-body u-sm u-muted">Aynı müşterinin boştaki paketleri — ' +
        'bağı siz kurarsınız:</div><ul class="gv-checklist">' + bosta.map(function(x){
          return '<li><span><b>' + esc(x.kod) + '</b> — ' + esc(x.ad || x.tip || '—') +
            GV.cell.sub(esc((x.baslangic ? F.date(x.baslangic) : '—') + ' → ' +
              (x.bitis ? F.date(x.bitis) : '—'))) + '</span>' +
            '<button type="button" class="btn btn-line btn-xs" data-bakim="' + esc(x.kod) + '"' +
            (canDuzen ? '' : ' disabled title="Bu işlem için düzenleme yetkiniz yok"') + '>' +
            ico('i-link','ic-sm') + ' Bu projeye bağla</button></li>';
        }).join('') + '</ul>';
    }else if(adaylar.length){
      adayHtml = '<div class="gc-body u-faint u-sm">Bu müşterinin ' + adaylar.length +
        ' paketi var ama hepsi başka bir projeye bağlı.</div>';
    }else{
      adayHtml = '<div class="gc-body u-faint u-sm">Bu müşteriye ait bakım paketi kaydı yok; ' +
        'bağlanacak aday paket bulunamadı.</div>';
    }

    return '<section class="gv-card u-mt-4">' +
      kartBasi('i-support', 'Bakım ve destek', sayacEtiketi(bagli.length, 'bağlı paket')) +
      listeHtml + adayHtml +
    '</section>';
  }

  /* ---- 8.6 Durum geçişleri (yan sütun) ------------------------------
     Ekran kendi durum listesini YAZMAZ; `GV.flow.adimlar` ne veriyorsa o. */
  function durumKarti(){
    var adimlar = GV.flow.adimlar('project', p.kod) || [];
    var govde = adimlar.length
      ? '<div class="gc-body"><div class="u-row u-wrap">' + adimlar.map(function(a){
          var kilit = !a.izin
            ? ' disabled title="Bu geçiş için yetkiniz yok"'
            : (a.eksik && a.eksik.length
                ? ' disabled title="Eksik alan: ' + esc(a.eksik.join(', ')) + '"' : '');
          return '<button type="button" class="btn ' + (a.birincil ? 'btn-acc' : (a.tone || 'btn-line')) +
            ' btn-sm" data-hedef="' + esc(a.hedef) + '"' + kilit + '>' + esc(a.etiket) +
            (a.gerekce ? ' ' + ico('i-quote','ic-sm') : '') + '</button>';
        }).join('') + '</div></div>' +
        '<div class="gc-body u-faint u-xs">' + ico('i-quote','ic-sm') +
          ' işaretli geçiş neden kodu ve açıklama ister. Ön koşulu olan geçişler ' +
          'reddedilirse sebebi motordan gelir.</div>'
      : '<div class="gc-body u-faint u-sm">Bu durumdan tanımlı bir geçiş yok — ' +
        esc(p.durum) + ' bu varlıkta son duraktır.</div>';

    return '<section class="gv-card">' +
      kartBasi('i-refresh', 'Durum geçişleri', GV.badge(p.durum)) +
      govde +
    '</section>';
  }

  /* ---- 8.7 Sağlık özeti (yan sütun) --------------------------------- */
  function saglikKarti(){
    var acikKritik = hatalar.filter(function(b){
      return b.siddet === 'Kritik' && ['Kapandı','Reddedildi','Mükerrer'].indexOf(b.durum) === -1; });
    var satir = function(l, v){
      return '<div class="gv-summary-row"><span class="gv-summary-lbl">' + esc(l) +
             '</span><span class="gv-summary-val">' + v + '</span></div>';
    };
    return '<section class="gv-card u-mt-4">' +
      kartBasi('i-gauge', 'Durum özeti') +
      '<div class="gc-body"><div class="gv-summary">' +
        satir('Sağlık', p.saglik ? GV.badge(p.saglik) : BOS) +
        satir('İlerleme', p.ilerleme == null ? BOS : '%' + p.ilerleme) +
        satir('Planlanan bitiş', p.planlananBitis ? esc(F.rel(p.planlananBitis)) : BOS) +
        satir('Açık kritik hata', hatalar.length
          ? '<span class="' + (acikKritik.length ? 'u-danger' : 'u-ok') + '">' + acikKritik.length + '</span>'
          : BOS + GV.cell.sub('hata kaydı yok')) +
        satir('Alt kayıt toplamı', '<span class="u-num">' + altToplam(p) + '</span>') +
      '</div></div>' +
      (buProjeBos
        ? '<div class="gc-body u-faint u-xs">Bu projede hiçbir alt kayıt yok; alt kayıt ' +
          'sekmelerinin hepsi boş açılır. Sebebi sekmelerin içinde yazılıdır.</div>'
        : '') +
    '</section>';
  }

  /* ===================================================================
     9. SEKME 2 — BÜTÇE (rota 79 · ADR-R2-12 · brief §23.2)

     İKİ EKSEN, İKİ KART, İKİ FARKLI GÜVENİLİRLİK:
       · PLAN — `DB.projects[].butce` kayıtta ELLE YAZILI tek bir sayıdır
         (14/14 kayıtta dolu). Ölçüm değil beyandır.
       · GERÇEKLEŞEN — `GV.proje.maliyet` zaman defteri ve satın alma
         defterinden TÜRETİR. Kalem dökümü ikinci kartta durur.
     İkisini tek tabloda toplamak, beyanı ölçüm gibi göstermek olurdu.

     ⚠️ `butce` alanının DÖNEMİ ve PARA BİRİMİ kayıtta YAZILI DEĞİL (§23.2
     "Sapma"). Ekran bunu beyan eder; ne dönem uydurur ne para birimi.
     ⚠️ `kapsam:false` ise bütçe/gerçekleşen KARŞILAŞTIRMASI BASILMAZ —
     sıfır maliyet yazmak "bütçenin %0'ı kullanıldı" demek olurdu ve bu
     ölçülmemişi ölçülmüş göstermektir (§23.2 · L-13).
     ⚠️ Bütçe KALEM BAZINDA planlanmamıştır: dört gider kaleminin her biri
     için ayrı plan rakamı kayıtta yok, o yüzden kalem bazında sapma
     BASILMADI. Tek karşılaştırma toplam eksenindedir.

     K-21: bu sekmedeki maliyet kartı Özet'ten TAŞINDI (silinmedi) ve
     künyedeki `Bütçe (iç maliyet ekseni)` satırı buradaki ilk satırdır.
     =================================================================== */
  function butceKarti(){
    var m = GV.proje.maliyet(p.kod);
    var s = GV.proje.sure(p.kod);

    /* Fark hücresi: `para()` maskeyi ve yetkiyi taşır ama işaretli biçimi
       yok; eksi bütçe farkı "₺-133.941" diye basılırdı. İşaretli para
       hücresi ortak katmanda VAR (`GV.cell.mny` · signed) — maske onun
       üstüne bu ekranda konur. */
    function paraFark(v){
      if(!canFinans) return '<span class="cell-mask">' + MASK + '</span>';
      return v == null ? BOS : GV.cell.mny(v, { signed:true });
    }

    var beyan = '<div class="gc-body">' + GV.notice({ tone:'info', icon:'i-info',
      title:'Bütçe rakamının dönemi ve para birimi kayıtta yazılı değil',
      text:'DB.projects[].butce tek bir sayıdır: hangi dönemi kapsadığı (proje ' +
           'ömrü mü, yıllık mı, kalan mı) ve hangi para biriminde tutulduğu ' +
           'kayıtta YOK — kayıtta ne dönem ne para birimi alanı var. Ekrandaki ' +
           '₺ işareti ortak biçimlendiricinin varsayılanıdır, kaydın beyanı ' +
           'değildir. Aşağıdaki oran bu yüzden bir DÖNEM oranı değil, kayıttaki ' +
           'bütçe rakamı ile bugüne kadar ölçülmüş maliyetin oranıdır.' }) + '</div>';

    var kalemNotu = '<div class="gc-body u-faint u-xs">Kalem bazında plan yok: bütçe ' +
      'tek sayıdır, dört gider kaleminin (personel · dış kaynak · satın alma · ' +
      'diğer) her birine ayrı plan rakamı kayıtta yazılı değil. Kalem bazında ' +
      'sapma bu yüzden BOŞ bırakıldı; karşılaştırma yalnız toplam eksenindedir.</div>';

    /* ---- kapsam:false → KARŞILAŞTIRMA BASILMAZ (§23.2) ---- */
    if(!m.kapsam){
      return '<section class="gv-card">' +
        kartBasi('i-wallet', 'Planlanan bütçe ve gerçekleşen',
          '<span class="badge is-warn">karşılaştırılamadı</span>') +
        '<div class="gc-body">' + GV.notice({ tone:'warn', icon:'i-alert',
          title:'Bütçe–gerçekleşen karşılaştırması BASILMADI',
          text:(defterVar
                ? 'Bu projede onaylı zaman kaydı ve teslim alınmış satın alma kaydı yok. '
                : 'Zaman defteri (DB.timelogs) bu ekranda yüklü değil ve bu projede ' +
                  'teslim alınmış satın alma kaydı da yok. ') +
               'Gerçekleşen maliyet ÖLÇÜLEMEDİ; sıfır yazıp "bütçenin %0\'ı ' +
               'kullanıldı" demek, ölçülmemişi ölçülmüş göstermek olurdu. Planlanan ' +
               'bütçe kayıttan okunur ve aşağıda tek başına durur.' }) + '</div>' +
        '<div class="gc-body">' + GV.dl([
          ['Bütçe (iç maliyet ekseni)', para(p.butce) +
            GV.cell.sub('proje kaydında yazılı plan rakamı — ölçüm değil beyan')],
          ['Gerçekleşen toplam', BOS + GV.cell.sub('ölçülemedi — karşılaştırma basılmadı')],
          ['Kalan / aşım', BOS + GV.cell.sub('gerçekleşen ölçülemediği için türetilemez')],
          ['Bütçe kullanımı', BOS + GV.cell.sub('gerçekleşen ölçülemediği için türetilemez')]
        ]) + '</div>' +
        beyan + kalemNotu +
      '</section>';
    }

    /* ---- kapsam:true → karşılaştırma türetilir ---- */
    var kalan = p.butce == null ? null : p.butce - m.toplam;
    var kullanim = (p.butce > 0) ? Math.round(m.toplam / p.butce * 100) : null;
    var kullanimHtml;
    if(!canFinans){
      kullanimHtml = '<span class="cell-mask">' + MASK + '</span>';
    }else if(kullanim == null){
      kullanimHtml = BOS + GV.cell.sub('bütçe rakamı yok ya da sıfır — oran türetilemez');
    }else{
      kullanimHtml = '<span class="u-num ' +
        (kullanim > 100 ? 'u-danger' : kullanim > 90 ? 'u-warn' : 'u-ok') + '">%' +
        esc(F.num(kullanim)) + '</span>';
    }

    /* Ölçülen ortalama saatlik iç maliyet — `GV.proje.sure` ile birlikte
       türetilir: (personel + dış kaynak) ÷ değerlenen saat. `maliyetsizPersonel`
       doluysa PAY eksik ama PAYDA tam olurdu; ortalama olduğundan düşük
       çıkardı — o durumda türetilmez, sebebi yazılır. */
    var ortalama = null;
    var ortalamaSebep = '';
    if((m.maliyetsizPersonel || []).length){
      ortalamaSebep = 'saatleri maliyete girmeyen personel var — ortalama düşük çıkardı';
    }else if(!s.gerceklesen){
      ortalamaSebep = 'değerlenen onaylı saat yok';
    }else if(!(m.personel + m.disKaynak)){
      ortalamaSebep = 'bu projede saat ekseninde maliyet yok (yalnız satın alma)';
    }else{
      ortalama = Math.round((m.personel + m.disKaynak) / s.gerceklesen);
    }

    return '<section class="gv-card">' +
      kartBasi('i-wallet', 'Planlanan bütçe ve gerçekleşen',
        sayacEtiketi(butceKayit, 'ölçülmüş kayıt')) +

  /* ---- 9.1 Maliyet — GV.proje.maliyet -------------------------------
     ⚠️ BU BLOK ÖZET SEKMESİNDEN TAŞINDI (K-21 · §23.2). Tek satırı bile
     değişmedi: aynı yordam, aynı satırlar, aynı sayılar. Değişen tek şey
     hangi sekmede durduğudur. */
  function maliyetKarti(){
    var m = GV.proje.maliyet(p.kod);

    var uyari = '';
    if(!m.kapsam){
      uyari = '<div class="gc-body">' + GV.notice({ tone:'warn', icon:'i-alert',
        title:'Maliyet ölçülemedi',
        text:(defterVar
              ? 'Bu projede onaylı zaman kaydı ve teslim alınmış satın alma kaydı yok. '
              : 'Zaman defteri (DB.timelogs) bu ekranda yüklü değil ve bu projede teslim ' +
                'alınmış satın alma kaydı da yok. ') +
             'Maliyeti sıfır saymak, kârlılığı %100 göstermek olurdu — kâr ve ' +
             'kârlılık bu yüzden BOŞ bırakıldı.' }) + '</div>';
    }

    var eksikP = (m.maliyetsizPersonel || []).map(function(k){ return DB.empName(k) || k; });
    var guvenP = (m.oranGuvenilmez || []).map(function(k){ return DB.empName(k) || k; });
    var notlar = '';
    if(eksikP.length) notlar += '<div class="gc-body">' + GV.notice({ tone:'warn', icon:'i-user',
      title:'Saatleri maliyete GİRMEYEN personel (' + eksikP.length + ')',
      text:eksikP.join(' · ') + ' — bu kişilerin saatlik iç maliyeti türetilemedi, ' +
           'saatleri toplama eklenmedi. Toplam bu kadar eksiktir.' }) + '</div>';
    if(guvenP.length) notlar += '<div class="gc-body">' + GV.notice({ tone:'warn', icon:'i-percent',
      title:'Kârlılık yüzdesi güvenilmez (' + guvenP.length + ' personel)',
      text:guvenP.join(' · ') + ' — bu kişilerin zaman kaydı tarihinde geçerli maaş ' +
           'kaydı yok, bugünkü oran kullanıldı. Yüzde bu yüzden kesin değildir.' }) + '</div>';

    var satirlar = [
      /* ⚠️ TEK AD (Beyar kararı, 13 Ağustos · K-21). Aynı alan
         (`DB.projects[].sozlesmeTutari`) künyede "Sözleşme tutarı",
         burada "Gelir (sözleşme tutarı)" diye geçiyordu — iki sekmede iki
         ad. Bir alanın iki adı olması K-21'in yasakladığı şeydir: okuyan
         iki ayrı sayı sanır. Ad künyedeki adla aynıdır; alanın bu
         hesaptaki ROLÜ (gelir tarafı) alt satırda yazılır, ada karışmaz. */
      ['Sözleşme tutarı', para(m.gelir) +
        GV.cell.sub('hesabın gelir tarafı — künyedeki alanın ta kendisi')],
      ['Personel maliyeti', m.kapsam || m.personel ? para(m.personel) : BOS + GV.cell.sub('ölçülemedi')],
      ['Dış kaynak', m.kapsam || m.disKaynak ? para(m.disKaynak) : BOS + GV.cell.sub('ölçülemedi')],
      ['Satın alma', para(m.satinAlma) + GV.cell.sub('yalnız teslim alınmış satın alma kaydı')],
      ['Diğer gider', BOS + GV.cell.sub('bu depoda projeye bağlı gider koleksiyonu YOK — ' +
        'sıfır bir ölçüm değil, kaynak boşluğudur')],
      ['Toplam maliyet', m.kapsam ? para(m.toplam) : BOS + GV.cell.sub('ölçülemedi')],
      ['Brüt kâr', m.brutKar == null ? BOS + GV.cell.sub('maliyet ölçülemedi') : para(m.brutKar)],
      ['Kârlılık', m.karlilikYuzde == null
        ? BOS + GV.cell.sub('maliyet ölçülemedi')
        : (canFinans ? GV.cell.oran(m.karlilikYuzde, 20) : '<span class="cell-mask">' + MASK + '</span>')],
      ['Değerlenen saat', m.kapsam ? saat(m.saat) : BOS + GV.cell.sub('zaman defteri okunamadı')]
    ];

    return '<section class="gv-card u-mt-4">' +
      kartBasi('i-wallet', 'Maliyet ve kârlılık',
        m.kapsam ? '' : '<span class="badge is-warn">ölçülemedi</span>') +
      uyari +
      '<div class="gc-body">' + GV.dl(satirlar) + '</div>' +
      notlar +
      (canFinans ? '' : '<div class="gc-body u-faint u-xs">Para alanları rolünüzde ' +
        'maskelidir; sıfır değil, "göremezsiniz" demektir.</div>') +
    '</section>';
  }

    el.innerHTML = butceKarti() + maliyetKarti();

  /* ===================================================================
     12. SEKME 5 — KALİTE (DB.testCases + GV.test.*)

     ⚠️ İKİ FARKLI GÜVENİLİRLİK, İKİ FARKLI BİÇİM (brief §18.6):
     `GV.test.sayac(...).turetilmis === false` ise sayılar kayıttaki sabit
     alanlardan gelir ve koşum defterinden TÜRETİLMEMİŞTİR. İki farklı
     güvenilirlikteki sayıyı aynı biçimde basmak yanlış beyandır.
     =================================================================== */
  function cizTest(el){
    if(!senler.length && !kosumK.length){
      el.innerHTML = bosKart('i-flask', 'Kalite', 'test kaydı',
        'Test senaryosu DB.testCases, test kaydı ise proje alanıyla bağlanır. ' +
        'Bu depoda senaryo dökümü yalnız bir projede tutuluyor.');
      return;
    }

    /* ---- Test kayıtları ve sayaçları ---- */
    var kosumHtml;
    if(kosumK.length){
      kosumHtml = '<ul class="gv-checklist">' + kosumK.map(function(t){
        var c = GV.test.sayac(t) || {};
        var kosumlar = GV.test.kosumlar(t.kod) || [];
        var bayrak = c.turetilmis
          ? GV.badge('koşum defterinden türetildi', 'is-ok')
          : GV.badge('kayıttaki sabit sayı', 'is-warn');
        var sayilar = c.turetilmis
          ? c.senaryo + ' senaryo · ' + c.basarili + ' başarılı · ' + c.basarisiz + ' başarısız · ' +
            c.engellendi + ' engellendi · ' + c.kosulmadi + ' koşulmadı'
          : c.senaryo + ' senaryo · ' + c.basarili + ' başarılı · ' + c.basarisiz + ' başarısız ' +
            '(engellendi ve koşulmadı ölçülemedi)';
        return '<li><span><b>' + esc(t.kod) + '</b> — ' + esc(t.ad) +
          GV.cell.sub(esc(sayilar) + ' · ' + kosumlar.length + ' koşum · ' +
            esc(t.tur || '—') + ' · ' + esc(F.date(t.tarih))) + '</span>' +
          '<span class="u-row">' + GV.badge(t.durum) + bayrak + '</span></li>';
      }).join('') + '</ul>';
    }else{
      kosumHtml = '<div class="gc-body">' + GV.empty({
        icon:'i-flask', title:'Bu projede test kaydı defterde yok',
        desc:bosSebep }) + '</div>';
    }

    var turetilmeyen = kosumK.filter(function(t){
      var c = GV.test.sayac(t); return c && !c.turetilmis; }).length;
    var bayrakNotu = turetilmeyen
      ? '<div class="gc-body">' + GV.notice({ tone:'warn', icon:'i-alert',
          title:turetilmeyen + ' test kaydının sayıları TÜRETİLMEDİ',
          text:'Bu kayıtlarda senaryo dökümü yok; senaryo, başarılı ve başarısız ' +
               'sayıları kaydın kendi alanlarından okunuyor. Hangi senaryonun ' +
               'başarısız olduğu bu kayıtlardan okunamaz — 62 senaryo adı uydurmak ' +
               'olmayan bir bilgiyi varmış gibi göstermek olurdu. Engellendi ve ' +
               'koşulmadı sayıları bu kayıtlarda ölçülemez.' }) + '</div>'
      : '';

    /* ---- Senaryo → son sonuç eşlemesi (yalnız GV.test.* üzerinden) ---- */
    var sonuclar = [];
    kosumK.forEach(function(t){
      (GV.test.kosumlar(t.kod) || []).forEach(function(r){
        (GV.test.sonuclar(r.kod) || []).forEach(function(x){ sonuclar.push(x); });
      });
    });
    function senaryoSonucu(tc){
      var v = sonuclar.filter(function(x){ return x.senaryo === tc.kod; });
      return v.length ? v[v.length - 1] : null;
    }

    var senaryoBlok = senler.length
      ? listeKabuk('test', 'i-flask', 'Test senaryoları',
          '<b>DB.testCases</b> — senaryo koşumdan bağımsız tanımdır; sonuç senaryoda ' +
          'değil koşumda tutulur. Aşağıdaki sonuç sütunu bu projenin koşum ' +
          'defterinden okunur (GV.test.kosumlar → GV.test.sonuclar); koşulmamış ' +
          'senaryoda BOŞ kalır.', senler.length)
      : '<section class="gv-card u-mt-4">' +
          kartBasi('i-flask', 'Test senaryoları', sayacEtiketi(0, 'kayıt')) +
          '<div class="gc-body">' + GV.empty({
            icon:'i-flask', title:'Bu projede test senaryosu defterde yok',
            desc:'Senaryo dökümü yalnız senaryoları veriye girilmiş projelerde var; ' +
                 'bu projenin test kayıtları sayaç ekseninde tutuluyor.' }) + '</div>' +
        '</section>';

    el.innerHTML = '<section class="gv-card">' +
        kartBasi('i-flask', 'Test kayıtları', sayacEtiketi(kosumK.length, 'kayıt')) +
        kosumHtml + bayrakNotu +
      '</section>' + senaryoBlok;

    if(!senler.length) return;

    liste({
      mount:el.querySelector('#pdListe-test'), id:'pdTest', key:'kod',
      countTarget:'#pdSay-test',
      source:function(){ return byProje(DB.testCases); },
      exportName:'proje-senaryo-' + p.kod, exportTitle:p.kod + ' test senaryoları',
      defaultSort:'kod', defaultDir:'asc',
      search:{ placeholder:'Senaryo ara', fields:['kod','ad','tur','onKosul'] },
      filters:[
        { key:'tur', label:'Tür', type:'multi', options:benzersiz(senler,'tur') },
        { key:'oncelik', label:'Öncelik', type:'multi', options:benzersiz(senler,'oncelik') }
      ],
      columns:[
        GV.cols.kod('kod','Senaryo', { width:'12%', locked:true }),
        { key:'ad', label:'Adı', width:'32%', cellClass:'cell-wrap',
          render:function(x){ return '<span class="cell-main">' + esc(x.ad) + '</span>' +
            (x.onKosul ? GV.cell.sub('ön koşul: ' + esc(x.onKosul)) : ''); } },
        { key:'tur', label:'Tür', cellClass:'center',
          render:function(x){ return x.tur ? GV.badge(x.tur) : BOS; } },
        { key:'oncelik', label:'Öncelik', cellClass:'center',
          render:function(x){ return x.oncelik ? GV.badge(x.oncelik) : BOS; } },
        { key:'modul', label:'Modül', cellClass:'center',
          render:function(x){ return x.modul ? '<span class="cell-code">' + esc(x.modul) + '</span>' : BOS; } },
        { key:'sonuc', label:'Son sonuç', cellClass:'center', sortable:false,
          exportValue:function(x){ var s = senaryoSonucu(x); return s ? s.sonuc : ''; },
          render:function(x){
            var s = senaryoSonucu(x);
            if(!s) return GV.cell.faint('koşulmadı — koşum defterinde kaydı yok');
            return GV.badge(s.sonuc) +
              (s.not ? GV.cell.sub(esc(s.not)) : '') +
              (s.hata ? GV.cell.sub('hata: ' + esc(s.hata)) : ''); } }
      ],
      mobile:function(x){
        var s = senaryoSonucu(x);
        return GV.cell.mrow(
          '<span class="cell-main">' + esc(x.ad) + '</span>',
          esc(x.kod),
          [ ico('i-layers','ic-sm') + esc(x.modul || '—'),
            ico('i-tag','ic-sm') + esc(x.tur || '—') ],
          s ? GV.badge(s.sonuc) : '<span class="u-faint u-xs">koşulmadı</span>');
      },
      emptyState:{ icon:'i-flask', title:'Süzgeç sonucu boş',
        desc:'Bu projede ' + senler.length + ' senaryo var; arama ya da filtre hiçbirine uymadı.' }
    });
  }

  /* ===================================================================
     17. SEKME 10 — AKTİVİTE (GV.audit.oku)
     =================================================================== */
  /* ---- 17.1 TOPLANTILAR — rota 62 · 63 -----------------------------
     Brief §23.7: toplantı AYRI EKRAN değil, kaydın kendi geçmiş yüzeyinde
     bağlamsal satırdır. Panel ayağı ("Günün ajandası") zaten yayında;
     müşteri ayağı `app-musteri-detay.html`te, proje ayağı burada.
     Ölçüm: `DB.meetings` 9 kayıt · **5'inde `proje` dolu** (aynı 5'inde
     `musteri` de dolu); kalan 4'ü departman/satış toplantısıdır ve hiçbir
     projeye bağlı değildir.
     ⚠️ Rozet YOK — `tur` ve `durum` için sözlük koleksiyonu ölçülmedi,
     sözlüksüz alana rozet basmak §22.17.12 ihlalidir.
     ⚠️ "Toplantı ekle" düğmesi YOK — `DB.meetings`e yazan yordam yok
     (rota 64 bloke · V2-99); olmayan yordam düğme olarak vaat edilmez. */
  function toplantiKarti(){
    var govde;
    if(!toplantilar.length){
      govde = '<div class="gc-body">' + GV.empty({
        icon:'i-calendar', title:'Bu projede toplantı kaydı yok',
        desc:'Toplantı defterinde ' + (DB.meetings || []).length + ' kayıt var; ' +
             (DB.meetings || []).filter(function(m){ return !!m.proje; }).length +
             '’i bir projeye bağlı ve hiçbiri bu proje değil.' }) + '</div>';
    }else{
      govde = '<div class="gc-body"><ul class="gv-tl">' + toplantilar.map(function(m){
        var dis = (m.disKatilimci || []).filter(Boolean);
        return '<li class="gv-tl-row">' +
          '<div class="gv-tl-head"><span class="gv-tl-who">' + esc(m.ad) + '</span>' +
            '<span class="gv-tl-when">' + esc(F.dt(m.tarih)) + '</span></div>' +
          '<div class="gv-tl-body">' +
            esc(m.tur) + ' · ' + esc(m.durum) +
            (m.sure != null ? ' · ' + esc(m.sure + ' dk') : '') +
            (m.yer ? ' · ' + esc(m.yer) : '') +
            '<span class="cell-code">' + esc(m.kod) + '</span>' +
            ((m.gundem || []).length
              ? GV.cell.sub('Gündem: ' + esc(m.gundem.join(' · '))) : '') +
            ((m.katilimci || []).length
              ? '<div class="gv-user-stack">' + m.katilimci.map(function(k){
                  return GV.user(k, { sm:true }); }).join('') + '</div>' : '') +
            /* Dış katılımcı SATIRI boşsa basılmaz (§23.7): boş dizi
               "kimse yoktu" demez, "yazılmadı" demektir. */
            (dis.length ? GV.cell.sub('Dış katılımcı: ' + esc(dis.join(', '))) : '') +
          '</div></li>';
      }).join('') + '</ul></div>';
    }
    return '<section class="gv-card">' +
      kartBasi('i-calendar', 'Toplantılar', sayacEtiketi(toplantilar.length, 'toplantı')) +
      '<div class="gc-body u-sm u-muted">Toplantının ayrı bir ekranı yoktur; kayıt ' +
        'bağlamında yaşar (rota 62 · 63). <b>Yeni toplantı açma düğmesi yok</b>: ' +
        '<code>DB.meetings</code> defterine kayıt ekleyen bir yordam ortak katmanda ' +
        'ölçülmedi. Tür ve durum düz metin basılır — sözlük koleksiyonu yok.</div>' +
      govde +
    '</section>';
  }

  function cizAktivite(el){
    el.innerHTML = toplantiKarti() +

      '<div class="gc-body u-sm u-muted">Olay defteri ve sistem günlüğü zaman sırasına ' +
        'dizilmiş hâlde; en fazla 30 hareket gösterilir. Durum geçişlerini motor kendisi ' +

        ['Kayıt', '<span class="cell-code">' + esc(r.kod) + '</span>'],

        ['Durum', GV.badge(r.durum)],

        ['Etki süresi', r.etkiSure == null ? null : saat(r.etkiSure) +
          GV.cell.sub('saat ekseninde — gün karşılığı veride yazılı değil')],
        ['Etki bedeli', r.etkiMaliyet == null ? null : para(r.etkiMaliyet) +
          GV.cell.sub('net · KDV hariç · müşteriye yansıyan bedel')],
        ['Kapsam', GV.badge(r.kapsamIci ? 'Kapsam içi' : 'Kapsam dışı',
          r.kapsamIci ? 'is-ok' : 'is-warn')],
        ['Karar', r.karar && r.karar !== '—' ? esc(r.karar) : null],

    delivery:{ baslik:'Teslim', ikon:'i-truck', ad:function(r){ return r.ad; },

        ['Kapsanan modüller', (r.moduller || []).length ? esc(r.moduller.join(' · ')) : null],
        ['Bağlı test kaydı', r.test ? '<span class="cell-code">' + esc(r.test) + '</span>' : null],
        ['Not', r.not ? esc(r.not) : null]
      ]; } }
  };

  function adimButonlari(tur, rec){
    var adimlar = GV.flow.adimlar(tur, rec.kod) || [];
    if(!adimlar.length)
      return '<p class="u-faint u-sm">Bu durumdan tanımlı bir geçiş yok.</p>';
    return '<div class="u-row u-wrap">' + adimlar.map(function(a){
      var kilit = !a.izin
        ? ' disabled title="Bu geçiş için yetkiniz yok"'
        : (a.eksik && a.eksik.length
            ? ' disabled title="Eksik alan: ' + esc(a.eksik.join(', ')) + '"' : '');
      return '<button type="button" class="btn ' + (a.birincil ? 'btn-acc' : (a.tone || 'btn-line')) +
        ' btn-sm" data-akis="' + esc(a.hedef) + '"' + kilit + '>' + esc(a.etiket) +
        (a.gerekce ? ' ' + ico('i-quote','ic-sm') : '') + '</button>';
    }).join('') + '</div>';
  }

  function akisCekmecesi(tur, rec){
    var t = ALAN[tur];
    var onayBlok = '';
    if(tur === 'delivery'){
      onayBlok = '<div class="gv-drawer-sec"><h4>Müşteri onayı</h4>' +
        '<div class="u-row u-wrap">' + (GV.delivery.kararlar || []).map(function(k){
          var ayni = rec.musteriOnay === k;
          return '<button type="button" class="btn btn-line btn-sm" data-onay="' + esc(k) + '"' +
            (ayni ? ' disabled title="Kayıt zaten bu kararda"' : '') + '>' + esc(k) + '</button>';
        }).join('') + '</div>' +
        '<p class="u-faint u-xs u-mt-4">Onay kararı işlendiğinde teslim durumu motor ' +
          'tarafından taşınır; motor geçişe izin vermezse karar da geri alınır — ' +
          'yarım sonuç bırakılmaz.</p></div>';
    }

    GV.drawer({
      title:t.baslik + ' — ' + rec.kod,
      body:'<div class="gv-drawer-sec"><h4>Kayıt</h4>' +
             GV.dl(t.dl(rec), { skipEmpty:true }) + '</div>' +
           onayBlok +
           '<div class="gv-drawer-sec"><h4>Durum geçişleri</h4>' +
             adimButonlari(tur, rec) +
             '<p class="u-faint u-xs u-mt-4">Liste motordan gelir; ekran kendi durum ' +
             'listesini yazmaz. ' + ico('i-quote','ic-sm') + ' işaretli geçiş neden kodu ' +
             've açıklama ister.</p></div>',
      onMount:function(govde){
        govde.addEventListener('click', function(ev){
          var b = ev.target.closest('[data-akis]');
          if(b){ altAkis(tur, rec, b.dataset.akis); return; }
          var o = ev.target.closest('[data-onay]');
          if(o){ teslimOnay(rec, o.dataset.onay); return; }
        });
      }
    });
  }

  function altAkis(tur, rec, hedef){
    var a = (GV.flow.adimlar(tur, rec.kod) || []).filter(function(x){ return x.hedef === hedef; })[0];
    if(!a) return;
    if(!a.gerekce){
      var r = GV.flow.gec(tur, rec.kod, hedef);
      if(r.ok === false){ GV.toast(GV.flowHata(r), 'danger'); return; }
      GV.toast(rec.kod + ' → ' + hedef, 'ok');
      GV.refresh();
      return;
    }
    GV.action({
      eylem:/İptal|Ret|Reddedildi/.test(hedef) ? 'İptal Et'
          : /Revizyon|Revize/.test(hedef) ? 'Revizyon İste' : hedef,
      kayit:{ kod:rec.kod, baslik:ALAN[tur].ad(rec) },
      sonuc:'Kayıt "' + hedef + '" durumuna geçecek.',
      gerekce:true,
      nedenTuru:/İptal/.test(hedef) ? 'iptal' : /Ret|Reddedildi/.test(hedef) ? 'ret'
              : /Revizyon|Revize/.test(hedef) ? 'revizyon' : null,
      tone:/İptal|Ret|Reddedildi/.test(hedef) ? 'danger' : 'accent',
      run:function(v){
        var r = GV.flow.gec(tur, rec.kod, hedef, null, { neden:v.neden, not:v.not });
        if(r.ok === false) return { ok:false, mesaj:GV.flowHata(r) };
        GV.refresh();
        return { mesaj:rec.kod + ' → ' + hedef, auditKod:(r.kayit || {}).kod };
      }
    });
  }

  function teslimOnay(rec, karar){
    var r = GV.delivery.approve(rec.kod, karar, DB.today);
    if(!r || r.ok === false){ GV.toast(GV.flowHata(r || {}), 'danger'); return; }
    GV.toast(rec.kod + ' müşteri onayı: ' + karar +
      (r.eskiDurum !== r.teslim.durum ? ' · teslim durumu ' + r.teslim.durum : ''), 'ok');
    GV.refresh();
  }

  /* ===================================================================
     19. BACKEND PAYI — brief §18.10 tablosundan KOPYALANIR (§10.2 (b))
     `BE-D1` yalnız destek ekranlarında yazılır; burada YOKTUR.
     =================================================================== */
  var BACKEND = [
    { kod:'BE-P1', bolum:'§9',
      madde:'Görev/proje durum geçişi sunucuda yeniden doğrulanmaz; yetki ve zorunlu alan kontrolü istemcide koşar' },
    { kod:'BE-P2', bolum:'§9',
      madde:'Zaman kaydı ve onay zinciri gerçek bir timesheet servisine bağlı değil; süreler bellekte' },
    { kod:'BE-S4', bolum:'§9',
      madde:'Belge yükleme gerçek depoya yazmaz; dosya adı ve boyutu bellekte tutulur' },
    { kod:'BE-S5', bolum:'§9 audit_event',
      madde:'Aktivite/denetim izi kalıcı değildir; sayfa yenilenince sıfırlanır' }
  ];
  function cizBackend(){
    return '<section class="gv-card u-mt-4">' +
      kartBasi('i-shield', 'Backend payı', sayacEtiketi(BACKEND.length, 'madde')) +
      '<ul class="gv-checklist">' + BACKEND.map(function(g){
        return '<li><span><b>' + esc(g.kod) + '</b> — ' + esc(g.madde) + '</span>' +
          '<span class="cell-sub">' + esc(g.bolum) + '</span></li>';
      }).join('') + '</ul>' +
      '<div class="gc-body u-faint u-sm">Bu maddeler prototipte <b>uygulanmadı</b> ve ' +
        '<b>taklit edilmedi</b>. Canlıya çıkmadan önce karşılanması zorunludur.</div>' +
    '</section>';
  }

  /* ===================================================================
     20. ÇİZİM
     =================================================================== */
  GV.pageHead({
    eyebrow:'Operasyon · Projeler',
    title:p.ad,
    sub:p.kod + ' · ' + (p.musteriAd || p.musteri || 'müşteri bağı yok') + ' · ' + p.durum,
    actions:[
      { label:'Proje listesine dön', icon:'i-arrow-left', href:'app-proje.html' },
      { label:'Müşteri kartı', icon:'i-building',
        href:'app-musteri-detay.html?id=' + encodeURIComponent(p.musteri || '') }
    ]
  });

  mount.innerHTML =
    (buProjeBos
      ? '<div class="u-mb-4">' + GV.notice({ tone:'info', icon:'i-archive',
          title:'Bu projenin alt defterleri boş',
          text:'Kilometre taşı, sprint, test, hata, değişiklik, teslim, belge ve görev ' +
               'kaydı yok. ' + bosSebep }) + '</div>'
      : '') +
    (defterVar ? '' :
      '<div class="u-mb-4">' + GV.notice({ tone:'warn', icon:'i-timer',
        title:'Zaman defteri bu ekranda yüklü değil',
        text:'Gerçekleşen süre ve personel maliyeti ÖLÇÜLEMEDİ; sıfır yazılmadı. ' +
             'Özet sekmesindeki süre kartı ile Bütçe sekmesindeki bütçe ve maliyet ' +
             'kartları hangi alanın neden boş olduğunu tek tek söyler.' }) + '</div>') +
    '<div class="gv-card">' +
      '<div class="gv-tabs" id="projeSekme" role="tablist" ' +
        'aria-label="Proje detay sekmeleri">' + sekmeHtml + '</div>' +
    '</div>' +
    panelHtml +
    cizBackend();

  /* ---- Tembel çizim (risk R-04) ------------------------------------ */
  var PANEL = {
    ozet:function(el){ el.innerHTML = cizOzet(); },
    butce:cizButce,
    milestone:cizMilestone, sprint:cizSprint, test:cizTest, hata:cizHata,
    degisiklik:cizDegisiklik, teslim:cizTeslim, belge:cizBelge, aktivite:cizAktivite
  };
  var cizildi = {};
  function cizPanel(key){
    if(cizildi[key] || !PANEL[key]) return;
    var el = mount.querySelector('[data-panel="' + key + '"]');
    if(!el) return;
    cizildi[key] = true;
    PANEL[key](el);
  }
  /* `document` KALICI düğümdür — `GV.on` tekil anahtarı ikinci çizimde
     öncekini söker, dinleyici birikmez (brief §2.6 · L-16). */
  GV.on(document, 'gv:tab', function(e){ cizPanel(e.detail.key); }, 'projeDetay-tab');

  /* `GV.tabs` açılışta `location.hash`i okur ve `gv:tab` atar; yani
     `app-proje-detay.html?id=PRJ-2026-006#degisiklik` doğrudan o sekmeyi
     açar. Bu adres biçimi sözleşmedir (brief §18.7). */
  var tabApi = GV.tabs('#projeSekme');

  /* ===================================================================
     21. EYLEMLER — mount içi delegasyon
     =================================================================== */
  GV.on(mount, 'click', function(ev){
    var git = ev.target.closest('[data-git]');
    if(git){ if(tabApi) tabApi.activate(git.dataset.git, true); return; }
    var hedef = ev.target.closest('[data-hedef]');
    if(hedef){ durumGec(hedef.dataset.hedef); return; }
    if(ev.target.closest('#pdKapat')){ kapanisAkisi(); return; }
    var bak = ev.target.closest('[data-bakim]');
    if(bak){ bakimBagla(bak.dataset.bakim); return; }
  }, 'projeDetay-click');

  /* ---- 21.1 Proje durum geçişi -------------------------------------- */
  function durumGec(hedef){
    var a = (GV.flow.adimlar('project', p.kod) || []).filter(function(x){ return x.hedef === hedef; })[0];
    if(!a) return;

    if(!a.gerekce){
      var r = GV.flow.gec('project', p.kod, hedef);
      if(r.ok === false){ GV.toast(GV.flowHata(r), 'danger'); return; }
      GV.toast(p.kod + ' → ' + hedef, 'ok');
      GV.refresh();
      return;
    }
    GV.action({
      eylem:hedef === 'İptal Edildi' ? 'İptal Et' : hedef,
      kayit:{ kod:p.kod, baslik:p.ad },
      sonuc:'Proje "' + hedef + '" durumuna geçecek.',
      gerekce:true,
      nedenTuru:hedef === 'İptal Edildi' ? 'iptal' : null,
      tone:hedef === 'İptal Edildi' ? 'danger' : 'warn',
      run:function(v){
        var r = GV.flow.gec('project', p.kod, hedef, null, { neden:v.neden, not:v.not });
        if(r.ok === false) return { ok:false, mesaj:GV.flowHata(r) };
        GV.refresh();
        return { mesaj:p.kod + ' → ' + hedef, auditKod:(r.kayit || {}).kod };
      }
    });
  }

  /* ---- 21.2 Kapanış akışı — GV.proje.kapat --------------------------
     KAPI REDDEDER: ölçülebilen ve geçmeyen madde varsa kapanış olmaz.
     Yalnız sahip / genel müdür neden kodu + açıklama + istisna ile geçer.
     Ölçülemeyen madde kilit saymaz ama gerekçe ister (brief §18.5).

     ⚠️ `GV.action`ın alan yuvası yok (V2-01): "yönetici istisnası"
     kutucuğu penceredeki bir alan olarak SUNULAMIYOR. İstisna bayrağı
     kaydın ölçülen durumundan türetilir ve pencerede açıkça yazılır. */
  function kapanisAkisi(){
    var kontrol   = GV.proje.kapanisKontrol(p.kod);
    var gecmeyen  = kontrol.filter(function(k){ return k.olculdu && !k.gecti; });
    var olculemez = kontrol.filter(function(k){ return !k.olculdu; });
    var gerekli   = gecmeyen.length > 0 || olculemez.length > 0;

    var sonuc = gecmeyen.length
      ? 'Kapanış kontrolünde geçmeyen ' + gecmeyen.length + ' madde var (' +
        gecmeyen.map(function(k){ return k.etiket; }).join(' · ') +
        '). Bu kapanış YÖNETİCİ İSTİSNASI olarak denetim izine yazılır ve yalnız ' +
        'sahip / genel müdür rolünde uygulanabilir.'
      : olculemez.length
        ? 'Kaydı olmadığı için ölçülemeyen ' + olculemez.length + ' madde var (' +
          olculemez.map(function(k){ return k.etiket; }).join(' · ') +
          '). Kapanış engellenmez ama gerekçe zorunludur.'
        : 'Ölçülebilen maddelerin tamamı geçti. Proje "Tamamlandı" durumuna geçecek, ' +
          'gerçek bitiş ' + F.date(DB.today) + ' yazılacak.';

    GV.action({
      eylem:'Projeyi Kapat',
      kayit:{ kod:p.kod, baslik:p.ad },
      sonuc:sonuc,
      gerekce:gerekli,
      nedenTuru:gecmeyen.length ? 'istisna' : null,
      etkilenen:gecmeyen.map(function(k){ return k.etiket; }),
      tone:gecmeyen.length ? 'danger' : 'ok',
      run:function(v){
        var r = GV.proje.kapat(p.kod, {
          neden:v.neden, aciklama:v.not, istisna:gecmeyen.length > 0
        });
        if(!r || r.ok === false) return { ok:false, mesaj:GV.flowHata(r || {}) };
        GV.refresh();
        return { mesaj:p.kod + ' kapatıldı · gerçek bitiş ' + r.tarih +
          (r.istisna ? ' (yönetici istisnası)' : '') };
      }
    });
  }

  /* ---- 21.3 Bakım paketi bağlama ------------------------------------ */
  function bakimBagla(paketKod){
    var r = GV.proje.bakimBagla(p.kod, paketKod);
    if(!r || r.ok === false){ GV.toast(GV.flowHata(r || {}), 'danger'); return; }
    GV.toast(paketKod + ' bakım paketi ' + p.kod + ' projesine bağlandı', 'ok');
    GV.refresh();
  }
});
</script>
</body>
</html>
